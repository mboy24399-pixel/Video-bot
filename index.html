<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD LEVEL - Autonomous Drawing Bot Video Engine</title>
    <style>
        :root {
            --primary: #00ff00;
            --secondary: #ff00ff;
            --accent: #00ffff;
            --warning: #ffff00;
            --danger: #ff0000;
            --bg-dark: #0a0a0a;
            --bg-panel: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background: #000000;
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0,255,0,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,0,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0,255,255,0.03) 0%, transparent 70%);
        }
        
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        
        .video-section {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 100px rgba(0,255,0,0.2);
        }
        
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            border-radius: 15px;
            border: 2px solid #444;
        }
        
        .video-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff00, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }
        
        .video-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        
        .video-stage.portrait {
            aspect-ratio: 9/16;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .video-stage canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .board {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: background 0.5s ease;
        }
        
        .board.classroom_green {
            background: #2c5e3a;
        }
        
        .board.blueprint {
            background: #1a3a5c;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .board.dark_mode {
            background: #0a0a0a;
        }
        
        .board.matrix {
            background: #000000;
            background-image: 
                linear-gradient(rgba(0,255,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,0,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        
        .board.whiteboard {
            background: #ffffff;
        }
        
        .bot-hand {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ff6600;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255,102,0,0.8);
            z-index: 1000;
            pointer-events: none;
            transition: all 0.1s;
            display: none;
        }
        
        .bot-hand.active {
            display: block;
            animation: botPulse 1s infinite;
        }
        
        @keyframes botPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .bot-hand::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed #ff6600;
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 20px;
            border: 2px solid #444;
            background: #222;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: #666;
        }
        
        .btn.primary {
            background: #0066cc;
            border-color: #0088ff;
        }
        
        .btn.success {
            background: #00aa00;
            border-color: #00cc00;
        }
        
        .btn.danger {
            background: #cc0000;
            border-color: #ff3333;
        }
        
        .btn.warning {
            background: #cc8800;
            border-color: #ffaa00;
        }
        
        .btn.bot-btn {
            background: #ff6600;
            border-color: #ffaa00;
            animation: botBtnGlow 2s infinite;
        }
        
        @keyframes botBtnGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255,102,0,0.5); }
            50% { box-shadow: 0 0 30px rgba(255,102,0,0.8); }
        }
        
        .control-panel {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(255,0,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 95vh;
            overflow-y: auto;
        }
        
        .panel-section {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #333;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ffcc;
        }
        
        .panel-title .icon {
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .script-box {
            width: 100%;
            min-height: 400px;
            background: #000;
            color: #00ff00;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            transition: all 0.3s;
        }
        
        .script-box:focus {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
            outline: none;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .stat-card {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
        }
        
        .stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .slider-group label {
            min-width: 60px;
            font-size: 12px;
        }
        
        .slider {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: #444;
            border-radius: 5px;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .layer-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 5px;
        }
        
        .layer-btn {
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
        }
        
        .layer-btn.active {
            background: #0066cc;
            border-color: #0088ff;
        }
        
        .tool-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 5px;
        }
        
        .tool-btn {
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            text-align: center;
        }
        
        .tool-btn.active {
            background: #ff6600;
            border-color: #ffaa00;
            box-shadow: 0 0 15px rgba(255,102,0,0.5);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }
        
        .modal-content {
            background: #1a1a1a;
            margin: 5% auto;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 600px;
            border: 2px solid #333;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close-modal {
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }
        
        .recording-indicator {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #ff0000;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
            animation: blink 1s infinite;
        }
        
        .recording-indicator.active {
            display: block;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

    <script>
        class Particle {
            constructor(x, y, color, type = 'normal') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1;
                this.decay = 0.01 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.type === 'gravity') {
                    this.vy += 0.1;
                } else if (this.type === 'spiral') {
                    this.x += Math.cos(this.rotation) * 2;
                    this.y += Math.sin(this.rotation) * 2;
                    this.rotation += this.rotationSpeed;
                }
                
                this.life -= this.decay;
                this.size *= 0.99;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        class GodLevelBotEngine {
            constructor() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particleCanvas = document.getElementById('particleCanvas');
                this.particleCtx = this.particleCanvas.getContext('2d');
                this.effectCanvas = document.getElementById('effectCanvas');
                this.effectCtx = this.effectCanvas.getContext('2d');
                this.botCanvas = document.getElementById('botCanvas');
                this.botCtx = this.botCanvas.getContext('2d');
                this.board = document.getElementById('board');
                this.timestamp = document.getElementById('timestamp');
                this.scriptBox = document.getElementById('scriptBox');
                this.progressFill = document.getElementById('progressFill');
                this.botHand = document.getElementById('botHand');
                
                this.animations = [];
                this.currentTime = 0;
                this.isPlaying = false;
                this.isRecording = false;
                this.isBotMode = false;
                this.lastFrameTime = 0;
                this.activeElements = [];
                this.particles = [];
                this.speed = 1;
                this.currentLayer = 'all';
                this.fps = 60;
                this.frameCount = 0;
                this.fpsTime = 0;
                this.quality = 'high';
                this.selectedTool = 'pen';
                this.botSize = 20;
                this.botSpeed = 5;
                this.botOpacity = 100;
                this.isPortrait = false;
                this.botPosition = { x: 300, y: 300 };
                this.botTarget = { x: 300, y: 300 };
                
                this.initializeCanvas();
                this.loadScript();
                this.setupEventListeners();
                this.animate();
            }
            
            initializeCanvas() {
                const width = this.board.offsetWidth;
                const height = this.board.offsetHeight;
                
                this.canvas.width = width;
                this.canvas.height = height;
                this.ctx = this.canvas.getContext('2d');
                
                this.particleCanvas.width = width;
                this.particleCanvas.height = height;
                this.particleCtx = this.particleCanvas.getContext('2d');
                
                this.effectCanvas.width = width;
                this.effectCanvas.height = height;
                this.effectCtx = this.effectCanvas.getContext('2d');
                
                this.botCanvas.width = width;
                this.botCanvas.height = height;
                this.botCtx = this.botCanvas.getContext('2d');
            }
            
            loadScript() {
                try {
                    this.animations = JSON.parse(this.scriptBox.value);
                    this.currentTime = 0;
                    this.clearCanvas();
                    this.updateStats();
                } catch (e) {
                    console.error('Invalid JSON script:', e);
                }
            }
            
            setupEventListeners() {
                document.getElementById('playBtn').addEventListener('click', () => {
                    this.isPlaying = true;
                    this.lastFrameTime = performance.now();
                });
                
                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.isPlaying = false;
                });
                
                document.getElementById('stopBtn').addEventListener('click', () => {
                    this.isPlaying = false;
                    this.isRecording = false;
                    document.getElementById('recIndicator').classList.remove('active');
                    this.currentTime = 0;
                    this.clearCanvas();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.isPlaying = false;
                    this.currentTime = 0;
                    this.clearCanvas();
                    this.applyBoardTheme('classroom_green');
                    this.updateProgress();
                });
                
                document.getElementById('botModeBtn').addEventListener('click', () => {
                    this.isBotMode = !this.isBotMode;
                    if (this.isBotMode) {
                        this.botHand.classList.add('active');
                        document.getElementById('botStatus').textContent = 'Drawing';
                    } else {
                        this.botHand.classList.remove('active');
                        document.getElementById('botStatus').textContent = 'Idle';
                    }
                });
                
                document.getElementById('recordBtn').addEventListener('click', () => {
                    this.isRecording = !this.isRecording;
                    const indicator = document.getElementById('recIndicator');
                    if (this.isRecording) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
                
                document.getElementById('screenshotBtn').addEventListener('click', () => {
                    this.takeScreenshot();
                });
                
                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportScript();
                });
                
                document.getElementById('importBtn').addEventListener('click', () => {
                    this.importScript();
                });
                
                document.getElementById('aspectBtn').addEventListener('click', () => {
                    this.isPortrait = !this.isPortrait;
                    const stage = document.getElementById('videoStage');
                    if (this.isPortrait) {
                        stage.classList.add('portrait');
                    } else {
                        stage.classList.remove('portrait');
                    }
                    this.initializeCanvas();
                    this.clearCanvas();
                });
                
                this.scriptBox.addEventListener('change', () => {
                    this.loadScript();
                    this.clearCanvas();
                });
                
                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speed = parseFloat(e.target.value);
                    document.getElementById('speedValue').textContent = this.speed.toFixed(1) + 'x';
                });
                
                document.getElementById('qualitySlider').addEventListener('input', (e) => {
                    const qualities = ['Low', 'Medium', 'High'];
                    this.quality = qualities[parseInt(e.target.value) - 1].toLowerCase();
                    document.getElementById('qualityValue').textContent = qualities[parseInt(e.target.value) - 1];
                });
                
                document.getElementById('botSizeSlider').addEventListener('input', (e) => {
                    this.botSize = parseInt(e.target.value);
                    document.getElementById('botSizeValue').textContent = this.botSize + 'px';
                    this.botHand.style.width = this.botSize + 'px';
                    this.botHand.style.height = this.botSize + 'px';
                });
                
                document.getElementById('botSpeedSlider').addEventListener('input', (e) => {
                    this.botSpeed = parseInt(e.target.value);
                    document.getElementById('botSpeedValue').textContent = this.botSpeed + 'x';
                });
                
                document.getElementById('botOpacitySlider').addEventListener('input', (e) => {
                    this.botOpacity = parseInt(e.target.value);
                    document.getElementById('botOpacityValue').textContent = this.botOpacity + '%';
                });
                
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.selectedTool = btn.dataset.tool;
                    });
                });
                
                document.querySelectorAll('.layer-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentLayer = btn.dataset.layer;
                    });
                });
                
                window.addEventListener('resize', () => {
                    this.initializeCanvas();
                    this.clearCanvas();
                    this.replayActiveElements();
                });
            }
            
            exportScript() {
                const blob = new Blob([this.scriptBox.value], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'animation_script.json';
                a.click();
                URL.revokeObjectURL(url);
            }
            
            importScript() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        this.scriptBox.value = event.target.result;
                        this.loadScript();
                    };
                    reader.readAsText(file);
                };
                input.click();
            }
            
            takeScreenshot() {
                const combinedCanvas = document.createElement('canvas');
                combinedCanvas.width = this.canvas.width;
                combinedCanvas.height = this.canvas.height;
                const combinedCtx = combinedCanvas.getContext('2d');
                
                combinedCtx.fillStyle = getComputedStyle(this.board).backgroundColor;
                combinedCtx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);
                combinedCtx.drawImage(this.canvas, 0, 0);
                combinedCtx.drawImage(this.particleCanvas, 0, 0);
                combinedCtx.drawImage(this.effectCanvas, 0, 0);
                combinedCtx.drawImage(this.botCanvas, 0, 0);
                
                const link = document.createElement('a');
                link.download = 'screenshot_' + Date.now() + '.png';
                link.href = combinedCanvas.toDataURL();
                link.click();
            }
            
            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particleCtx.clearRect(0, 0, this.particleCanvas.width, this.particleCanvas.height);
                this.effectCtx.clearRect(0, 0, this.effectCanvas.width, this.effectCanvas.height);
                this.botCtx.clearRect(0, 0, this.botCanvas.width, this.botCanvas.height);
                this.activeElements = [];
                this.particles = [];
            }
            
            replayActiveElements() {
                const elements = this.activeElements.filter(el => el.t <= this.currentTime);
                elements.forEach(el => this.renderElement(el));
            }
            
            applyBoardTheme(theme) {
                this.board.className = 'board ' + theme;
            }
            
            updateStats() {
                document.getElementById('elementCount').textContent = this.animations.length;
                document.getElementById('activeCount').textContent = this.activeElements.length;
                document.getElementById('particleCount').textContent = this.particles.length;
            }
            
            updateProgress() {
                if (this.animations.length > 0) {
                    const lastTime = Math.max(...this.animations.map(a => a.t + (a.duration || 0)));
                    const progress = (this.currentTime / lastTime) * 100;
                    this.progressFill.style.width = Math.min(100, progress) + '%';
                }
            }
            
            animate() {
                const now = performance.now();
                const deltaTime = this.lastFrameTime ? now - this.lastFrameTime : 0;
                this.lastFrameTime = now;
                
                this.frameCount++;
                if (now - this.fpsTime >= 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.fpsTime = now;
                    document.getElementById('fpsCounter').textContent = this.fps;
                }
                
                if (this.isPlaying) {
                    this.currentTime += deltaTime * this.speed;
                    this.updateAnimations();
                    this.updateParticles();
                    
                    if (this.isBotMode) {
                        this.updateBotPosition();
                    }
                }
                
                this.render();
                this.timestamp.textContent = (this.currentTime / 1000).toFixed(1) + 's';
                this.updateProgress();
                this.updateStats();
                
                requestAnimationFrame(() => this.animate());
            }
            
            updateBotPosition() {
                const currentAnim = this.activeElements.find(el => el.t <= this.currentTime);
                if (currentAnim) {
                    if (currentAnim.cmd === 'text') {
                        this.botTarget = { x: currentAnim.x, y: currentAnim.y };
                    } else if (currentAnim.cmd === 'line') {
                        const progress = Math.min(1, (this.currentTime - currentAnim.t) / (currentAnim.duration || 2000));
                        this.botTarget = {
                            x: currentAnim.x1 + (currentAnim.x2 - currentAnim.x1) * progress,
                            y: currentAnim.y1 + (currentAnim.y2 - currentAnim.y1) * progress
                        };
                    } else if (currentAnim.cmd === 'circle') {
                        this.botTarget = { x: currentAnim.x, y: currentAnim.y };
                    }
                }
                
                const dx = this.botTarget.x - this.botPosition.x;
                const dy = this.botTarget.y - this.botPosition.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 1) {
                    const moveSpeed = this.botSpeed * 10;
                    this.botPosition.x += (dx / distance) * moveSpeed;
                    this.botPosition.y += (dy / distance) * moveSpeed;
                }
                
                this.botHand.style.left = (this.botPosition.x - this.botSize / 2) + 'px';
                this.botHand.style.top = (this.botPosition.y - this.botSize / 2) + 'px';
            }
            
            updateAnimations() {
                const currentAnimations = this.animations.filter(anim => {
                    const animationEnd = anim.t + (anim.duration || 0);
                    return anim.t <= this.currentTime && animationEnd >= this.currentTime;
                });
                
                const newElements = currentAnimations.filter(anim => {
                    return !this.activeElements.some(el => 
                        el.t === anim.t && el.cmd === anim.cmd && el.text === anim.text
                    );
                });
                
                newElements.forEach(anim => {
                    if (anim.cmd === 'setBoard') {
                        this.applyBoardTheme(anim.theme);
                    } else if (anim.cmd === 'particles') {
                        this.spawnParticles(anim);
                    } else {
                        this.activeElements.push({...anim, startTime: anim.t});
                    }
                });
                
                this.activeElements = this.activeElements.filter(el => {
                    const elementEnd = el.t + (el.duration || 2000);
                    return elementEnd >= this.currentTime;
                });
            }
            
            spawnParticles(anim) {
                const particleTypes = ['normal', 'gravity', 'spiral'];
                const type = particleTypes[Math.floor(Math.random() * particleTypes.length)];
                
                for (let i = 0; i < anim.count; i++) {
                    this.particles.push(new Particle(anim.x, anim.y, anim.color, type));
                }
            }
            
            updateParticles() {
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => p.update());
            }
            
            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particleCtx.clearRect(0, 0, this.particleCanvas.width, this.particleCanvas.height);
                this.effectCtx.clearRect(0, 0, this.effectCanvas.width, this.effectCanvas.height);
                this.botCtx.clearRect(0, 0, this.botCanvas.width, this.botCanvas.height);
                
                this.activeElements.forEach(el => {
                    if (this.shouldRenderLayer(el)) {
                        this.renderElement(el);
                    }
                });
                
                this.particles.forEach(p => p.draw(this.particleCtx));
                
                if (this.isBotMode) {
                    this.renderBot();
                }
            }
            
            renderBot() {
                this.botCtx.save();
                this.botCtx.globalAlpha = this.botOpacity / 100;
                this.botCtx.fillStyle = '#ff6600';
                this.botCtx.shadowColor = '#ff6600';
                this.botCtx.shadowBlur = 20;
                this.botCtx.beginPath();
                this.botCtx.arc(this.botPosition.x, this.botPosition.y, this.botSize / 2, 0, Math.PI * 2);
                this.botCtx.fill();
                this.botCtx.restore();
                
                this.botCtx.save();
                this.botCtx.strokeStyle = '#ffaa00';
                this.botCtx.lineWidth = 2;
                this.botCtx.setLineDash([5, 5]);
                this.botCtx.beginPath();
                this.botCtx.arc(this.botPosition.x, this.botPosition.y, this.botSize, 0, Math.PI * 2);
                this.botCtx.stroke();
                this.botCtx.restore();
            }
            
            shouldRenderLayer(el) {
                if (this.currentLayer === 'all') return true;
                
                switch(this.currentLayer) {
                    case 'lines':
                        return el.cmd === 'line';
                    case 'shapes':
                        return ['circle', 'rectangle', 'polygon', 'arc'].includes(el.cmd);
                    case 'text':
                        return el.cmd === 'text';
                    case 'particles':
                        return el.cmd === 'particles';
                    case 'effects':
                        return el.style === 'neon' || el.style === 'glow';
                    default:
                        return true;
                }
            }
            
            renderElement(el) {
                const progress = Math.min(1, (this.currentTime - el.t) / (el.duration || 2000));
                
                switch(el.style) {
                    case 'chalk':
                        this.renderChalkElement(el, progress);
                        break;
                    case 'neon':
                        this.renderNeonElement(el, progress);
                        break;
                    case 'glow':
                        this.renderGlowElement(el, progress);
                        break;
                    default:
                        this.renderDefaultElement(el, progress);
                }
            }
            
            renderChalkElement(el, progress) {
                if (el.cmd === 'line') {
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.8;
                    this.ctx.strokeStyle = el.color;
                    this.ctx.lineWidth = el.width;
                    this.ctx.setLineDash([10, 5]);
                    
                    const currentX = el.x1 + (el.x2 - el.x1) * progress;
                    const currentY = el.y1 + (el.y2 - el.y1) * progress;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(el.x1, el.y1);
                    this.ctx.lineTo(currentX, currentY);
                    this.ctx.stroke();
                    this.ctx.restore();
                }
            }
            
            renderNeonElement(el, progress) {
                this.ctx.save();
                
                this.ctx.shadowColor = el.color;
                this.ctx.shadowBlur = 20;
                this.ctx.strokeStyle = el.color;
                this.ctx.lineWidth = el.width;
                
                switch(el.cmd) {
                    case 'circle':
                        const endAngle = (Math.PI * 2) * progress;
                        this.ctx.beginPath();
                        this.ctx.arc(el.x, el.y, el.r, -Math.PI/2, -Math.PI/2 + endAngle);
                        this.ctx.stroke();
                        break;
                        
                    case 'line':
                        const currentX = el.x1 + (el.x2 - el.x1) * progress;
                        const currentY = el.y1 + (el.y2 - el.y1) * progress;
                        
                        this.ctx.beginPath();
                        this.ctx.moveTo(el.x1, el.y1);
                        this.ctx.lineTo(currentX, currentY);
                        this.ctx.stroke();
                        break;
                        
                    case 'rectangle':
                        const rectProgress = Math.min(1, progress * 1.5);
                        const w = el.width * rectProgress;
                        const h = el.height * rectProgress;
                        const rx = el.x - w/2;
                        const ry = el.y - h/2;
                        
                        this.ctx.strokeRect(rx, ry, w, h);
                        break;
                        
                    case 'polygon':
                        if (el.points && el.points.length > 2) {
                            const pointCount = Math.floor(el.points.length * progress);
                            if (pointCount >= 2) {
                                this.ctx.beginPath();
                                this.ctx.moveTo(el.points[0][0], el.points[0][1]);
                                for (let i = 1; i < pointCount; i++) {
                                    this.ctx.lineTo(el.points[i][0], el.points[i][1]);
                                }
                                this.ctx.stroke();
                            }
                        }
                        break;
                        
                    case 'arc':
                        const arcEndAngle = (el.endAngle * Math.PI / 180) * progress;
                        this.ctx.beginPath();
                        this.ctx.arc(el.x, el.y, el.r, el.startAngle * Math.PI / 180, arcEndAngle);
                        this.ctx.stroke();
                        break;
                }
                
                this.ctx.restore();
            }
            
            renderGlowElement(el, progress) {
                this.ctx.save();
                
                this.ctx.shadowColor = el.color;
                this.ctx.shadowBlur = 40;
                this.ctx.fillStyle = el.color;
                this.ctx.globalAlpha = progress;
                
                if (el.cmd === 'text') {
                    this.ctx.font = el.size + ' "Courier New", monospace';
                    this.ctx.textAlign = 'left';
                    this.ctx.fillText(el.text, el.x, el.y);
                }
                
                this.ctx.restore();
            }
            
            renderDefaultElement(el, progress) {
                this.ctx.save();
                
                if (el.cmd === 'text') {
                    this.ctx.globalAlpha = progress;
                    this.ctx.fillStyle = el.color;
                    this.ctx.font = el.size + ' "Courier New", monospace';
                    this.ctx.textAlign = 'left';
                    this.ctx.fillText(el.text, el.x, el.y);
                }
                
                this.ctx.restore();
            }
        }
        
        const engine = new GodLevelBotEngine();
    </script>
</body>
</html>
