<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="description" content="KALAM — an autonomous drawing and animation studio that runs entirely in your browser. Type a topic, and a bot draws, animates, narrates and exports a finished video. Single file, zero dependencies, works offline.">
<meta name="keywords" content="AI video bot, autonomous drawing bot, canvas animation studio, whiteboard animation, explainer video generator, browser video editor, single file app">
<meta name="author" content="KALAM Studio">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KALAM">
<meta property="og:title" content="KALAM — Autonomous Drawing Intelligence">
<meta property="og:description" content="Type a topic. A bot draws it, animates it, narrates it and exports the video. 100% in your browser.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>KALAM · कलम — Autonomous Drawing Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070c'/%3E%3Cpath d='M18 46 L40 18 M30 33 L44 46' stroke='%2300f5d4' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='46' cy='16' r='4' fill='%23ff2a6d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05070c; --bg2:#0b1018; --panel:rgba(14,20,30,.78); --panel2:rgba(20,28,42,.9);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#e8eefc; --dim:#8ea0bb; --dim2:#5d6f8a;
  --acc:#00f5d4; --acc2:#ff2a6d; --warn:#ffd166; --ok:#4ade80; --err:#ff4d6d;
  --r:14px; --rs:10px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --tap:46px;
  --glass:saturate(160%) blur(18px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar)}

/* ---------------------------------------------------------------- TOP --- */
#topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px;
  background:linear-gradient(180deg,rgba(8,12,20,.96),rgba(8,12,20,.72));
  border-bottom:1px solid var(--line);z-index:40;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:9px;padding-right:6px}
.brand svg{width:28px;height:28px;flex:0 0 auto}
.brand b{font-size:16px;letter-spacing:.14em;font-weight:800}
.brand span{font-size:9.5px;color:var(--dim2);letter-spacing:.22em;text-transform:uppercase;display:block;margin-top:-3px}
#projName{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;min-width:0;
  flex:1 1 auto;font-weight:600;font-size:13px;color:var(--txt)}
#projName:focus{outline:none;border-color:var(--line2);background:rgba(255,255,255,.04)}
.spacer{flex:1 1 auto}
.tbtn{min-width:var(--tap);height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.09);border-color:var(--line2)}
.tbtn:active{transform:scale(.96)}
.tbtn.on{background:rgba(0,245,212,.16);border-color:rgba(0,245,212,.5);color:var(--acc)}
.tbtn.accent{background:var(--acc);color:#04121a;border-color:var(--acc);font-weight:800}
.tbtn.accent:hover{background:#3dffe4}
.tbtn.danger{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.45);color:#ffb3c1}
.tbtn .ico{font-size:15px;line-height:1}
#fpsPill{font-variant-numeric:tabular-nums;font-size:11px;color:var(--dim);border:1px solid var(--line);
  padding:4px 8px;border-radius:20px;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
#fpsPill b{color:var(--ok)}
#fpsPill.warn b{color:var(--warn)} #fpsPill.bad b{color:var(--err)}

/* -------------------------------------------------------------- STAGE --- */
#stage{position:relative;flex:1 1 auto;min-height:0;background:#000;overflow:hidden;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#uiCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stageFrame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));
  max-width:min(92%,860px);padding:9px 16px;border-radius:12px;background:rgba(4,8,14,.72);
  border:1px solid var(--line);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  font-size:15px;font-weight:600;text-align:center;pointer-events:none;opacity:0;transition:opacity .18s;z-index:12}
#caption.show{opacity:1}
#handTag{position:absolute;top:10px;right:10px;padding:5px 10px;border-radius:20px;font-size:11px;
  background:rgba(4,8,14,.7);border:1px solid var(--line);color:var(--acc);pointer-events:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;opacity:0;transition:opacity .2s;z-index:12}
#handTag.show{opacity:1}
#recDot{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:7px;padding:5px 11px;
  border-radius:20px;background:rgba(255,40,70,.18);border:1px solid rgba(255,77,109,.5);
  color:#ffc2cd;font-size:11.5px;font-weight:700;z-index:12;font-family:ui-monospace,monospace}
#recDot.show{display:flex}
#recDot i{width:9px;height:9px;border-radius:50%;background:#ff2a4a;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* --------------------------------------------------------------- HUD --- */
#hud{position:absolute;left:10px;bottom:calc(10px + var(--sab));display:grid;gap:2px;
  padding:8px 10px;border-radius:10px;background:rgba(4,8,14,.62);border:1px solid var(--line);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--dim);
  pointer-events:none;z-index:11;line-height:1.5;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
#hud b{color:var(--acc);font-weight:600}
#hud .k{color:var(--dim2)}
body.hideHud #hud{display:none}

/* ----------------------------------------------------------- TRANSPORT -- */
#transport{flex:0 0 auto;background:linear-gradient(0deg,rgba(8,12,20,.97),rgba(8,12,20,.8));
  border-top:1px solid var(--line);padding:6px 10px 8px;z-index:40}
#tlWrap{position:relative;height:44px;border-radius:10px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:none}
#tlCanvas{position:absolute;inset:0;width:100%;height:100%}
#tlRow{display:flex;align-items:center;gap:8px;margin-top:7px}
#tPlay{width:48px;height:40px;border-radius:12px;background:var(--acc);color:#04121a;font-size:17px;
  display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
#tPlay:active{transform:scale(.94)}
#tTime{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--txt);
  font-variant-numeric:tabular-nums;min-width:112px}
#tProg{flex:1 1 auto;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#tProg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#3a86ff);border-radius:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:6px 9px;font-size:11px;color:var(--dim);border-right:1px solid var(--line);font-weight:600}
.seg button:last-child{border-right:none}
.seg button.on{background:rgba(0,245,212,.16);color:var(--acc)}

/* -------------------------------------------------------------- DOCK --- */
#dock{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px calc(8px + var(--sab));
  background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:40}
#dock::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;min-width:64px;min-height:var(--tap);padding:7px 11px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim)}
.dbtn .ico{font-size:19px;line-height:1}
.dbtn.on{background:rgba(0,245,212,.15);border-color:rgba(0,245,212,.45);color:var(--acc)}
.dbtn:active{transform:scale(.95)}

/* ----------------------------------------------------------- DRAW BAR -- */
#drawbar{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:9px 10px;
  background:var(--bg2);border-top:1px solid var(--line);z-index:41}
#prompt{flex:1 1 auto;min-width:0;height:46px;padding:0 14px;border-radius:13px;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--txt);font-size:14px}
#prompt:focus{outline:none;border-color:var(--acc);background:rgba(0,245,212,.06)}
#prompt::placeholder{color:var(--dim2)}
#goBtn{flex:0 0 auto;height:46px;padding:0 20px;border-radius:13px;background:var(--acc);color:#04121a;
  font-weight:900;font-size:14.5px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
#goBtn:active{transform:scale(.96)}
#goBtn.busy{opacity:.6;pointer-events:none}
#chips{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;max-width:46vw;scrollbar-width:none;padding:2px 0}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);font-size:11.5px;color:var(--dim);white-space:nowrap}
.chip:active{background:rgba(0,245,212,.14);color:var(--acc)}

/* ------------------------------------------------------------ SHEETS --- */
#sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:80;display:none;
  background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet.open{display:block}
#sheetBody{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;
  background:var(--panel2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  padding-bottom:var(--sab);box-shadow:0 -18px 60px rgba(0,0,0,.6);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
#sheetHead{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
#sheetHead h3{font-size:15px;font-weight:800;letter-spacing:.02em;flex:1 1 auto}
#sheetClose{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);color:var(--dim);font-size:16px}
#sheetContent{overflow-y:auto;overflow-x:hidden;padding:12px 14px 22px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@media (min-width:900px){
  #sheetBody{left:50%;transform:translateX(-50%);width:min(880px,94vw);border-radius:18px;bottom:22px;border:1px solid var(--line2)}
}

/* generic UI bits inside sheets */
.grid{display:grid;gap:9px}
.g2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.035);
  display:flex;flex-direction:column;gap:5px;text-align:left;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.card.on{border-color:var(--acc);background:rgba(0,245,212,.1)}
.card b{font-size:12.5px;font-weight:700}
.card small{font-size:10.5px;color:var(--dim2);line-height:1.35}
.card .em{font-size:20px}
.card .sw{height:26px;border-radius:7px;border:1px solid var(--line)}
.sec{margin:16px 0 8px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.sec:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0}
.row label{flex:1 1 auto;font-size:12.5px;color:var(--dim)}
.row .val{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--acc);min-width:52px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--acc);margin-top:-7.5px;border:2px solid #04121a}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--acc);border:2px solid #04121a}
select,.inp{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;
  font-size:12.5px;color:var(--txt);min-width:0}
textarea.inp{width:100%;min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  line-height:1.6;resize:vertical;touch-action:pan-y}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07);
  font-size:10.5px;color:var(--dim);margin:2px 3px 2px 0;font-family:ui-monospace,monospace}
.tag.ok{background:rgba(74,222,128,.15);color:#86efac}
.tag.bad{background:rgba(255,77,109,.15);color:#ffa3b3}
.tag.warn{background:rgba(255,209,102,.14);color:#ffe08a}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px;border-bottom:1px dashed rgba(255,255,255,.06)}
.kv span:first-child{color:var(--dim2)}
.kv span:last-child{font-family:ui-monospace,monospace;color:var(--txt);text-align:right}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.empty{padding:26px 12px;text-align:center;color:var(--dim2);font-size:12.5px}
.layerRow{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:7px}
.layerRow .nm{flex:1 1 auto;font-size:12.5px;font-weight:600}
.layerRow .cnt{font-size:10.5px;color:var(--dim2);font-family:ui-monospace,monospace}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--dim)}
.mini.on{background:rgba(0,245,212,.14);color:var(--acc);border-color:rgba(0,245,212,.4)}

/* --------------------------------------------------------- BOOT/TOAST --- */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#boot.gone{opacity:0;pointer-events:none}
#boot .lg{font-size:34px;font-weight:900;letter-spacing:.34em;color:var(--acc);text-shadow:0 0 30px rgba(0,245,212,.5)}
#boot .sub{font-size:11px;letter-spacing:.3em;color:var(--dim2);text-transform:uppercase}
#boot .ld{width:210px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
#boot .ld i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#boot .st{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace;min-height:14px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--sat));z-index:300;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;width:min(92vw,460px)}
.toast{padding:10px 14px;border-radius:11px;background:rgba(10,16,26,.94);border:1px solid var(--line2);
  font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease}
.toast.ok{border-color:rgba(74,222,128,.5)} .toast.err{border-color:rgba(255,77,109,.55)}
.toast.warn{border-color:rgba(255,209,102,.5)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
#progressWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab));z-index:120;
  width:min(90vw,420px);padding:11px 14px;border-radius:13px;background:rgba(8,12,20,.95);
  border:1px solid var(--acc);display:none;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#progressWrap.show{display:block}
#progressWrap .t{font-size:12px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between}
#progressWrap .t span{color:var(--acc);font-family:ui-monospace,monospace}

/* ------------------------------------------------------- DESKTOP LAYOUT */
@media (min-width:1000px) and (min-height:640px){
  #app{flex-direction:row;flex-wrap:wrap}
  #topbar{flex:1 1 100%;order:1}
  #side{order:2;flex:0 0 268px;display:flex;flex-direction:column;background:var(--bg2);
    border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 52px)}
  #main{order:3;flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
  #stage{flex:1 1 auto}
  body{overflow:hidden}
  #dock{flex-wrap:wrap}
}
@media (max-width:999px){ #side{display:none} }

/* -------------------------------------------- SMALL PHONE (stop the fight) -- */
@media (max-width:640px){
  .brand span{display:none}
  .brand b{font-size:14px}
  .tbtn .lbl{display:none}          /* icon-only top buttons — nothing truncates */
  .tbtn{min-width:40px;padding:0 9px}
  #projName{font-size:12px}
  #fpsPill{font-size:10px;padding:3px 6px}
  #drawbar{flex-wrap:wrap}
  #chips{order:3;max-width:100%;width:100%}   /* chips drop below the input, full width */
  #prompt{font-size:16px}          /* iOS-safe: no auto-zoom on focus */
  #tTime{min-width:86px;font-size:11px}
  .seg button{padding:5px 7px;font-size:10px}
  #dock .dbtn{min-width:58px}
  #sheetBody{max-height:92vh}
}
#side .sp{padding:10px;border-bottom:1px solid var(--line)}
#side h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px}
#side .g3{grid-template-columns:repeat(3,1fr)}
.hidden{display:none !important}
body.lowfx .glass,#sheet{backdrop-filter:none;-webkit-backdrop-filter:none}

/* ---------------------------------------------------- CINEMA (BOT MODE) -- */
/* The bot has the wheel: every chrome bar disappears and the drawing is the
   whole screen. A tap adds .cinemaPeek which brings the chrome back for 3.5s. */
body.cinema #topbar, body.cinema #transport, body.cinema #dock, body.cinema #drawbar{
  display:none}
body.cinema.cinemaPeek #topbar{display:flex}
body.cinema.cinemaPeek #transport{display:block}
body.cinema.cinemaPeek #dock{display:flex}
body.cinema.cinemaPeek #drawbar{display:flex}
body.cinema #caption{font-size:17px}
body.cinema #hud{display:none}
</style>
</head>
<body>
<div id="boot">
  <div class="lg">KALAM</div>
  <div class="sub">कलम · Autonomous Drawing Intelligence</div>
  <div class="ld"><i id="bootBar"></i></div>
  <div class="st" id="bootStatus">initialising…</div>
</div>

<div id="app">
  <!-- ============================ TOP ============================ -->
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0b1018"/><path d="M18 46 L40 18 M30 33 L44 46" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="46" cy="16" r="4" fill="#ff2a6d"/></svg>
      <div><b>KALAM</b><span>Autonomous Studio</span></div>
    </div>
    <input id="projName" value="Untitled" aria-label="Project name" spellcheck="false">
    <div class="spacer"></div>
    <div id="fpsPill" title="Performance"><b>60</b> fps</div>
    <button class="tbtn" id="btnHome" title="Home dashboard"><span class="ico">🏠</span></button>

/* ------------------------------------------------------------ POOL ------- */
class Pool {
  constructor(factory, reset, initial = 0, max = 100000) {
    this.factory = factory; this.reset = reset || (() => {});
    this.free = []; this.active = 0; this.max = max; this.created = 0;
    for (let i = 0; i < initial; i++) { this.free.push(this.factory()); this.created++; }
  }
  acquire() {
    this.active++;
    const o = this.free.pop() || (this.created++, this.factory());
    return o;
  }
  release(o) { if (this.free.length < this.max) { this.reset(o); this.free.push(o); } this.active = Math.max(0, this.active - 1); }
  stats() { return { free: this.free.length, active: this.active, created: this.created }; }
}

/* --------------------------------------------------------- EVENTBUS ------ */
class EventBus {
  constructor() { this.map = new Map(); }
  on(evt, fn) { if (!this.map.has(evt)) this.map.set(evt, new Set()); this.map.get(evt).add(fn); return () => this.off(evt, fn); }
  once(evt, fn) { const w = (...a) => { this.off(evt, w); fn(...a); }; return this.on(evt, w); }
  off(evt, fn) { const s = this.map.get(evt); if (s) s.delete(fn); }
  emit(evt, ...args) { const s = this.map.get(evt); if (!s) return; for (const fn of Array.from(s)) { try { fn(...args); } catch (e) { console.warn('[KALAM] bus error', evt, e); } } }
  clear() { this.map.clear(); }
}

/* --------------------------------------------------------- STORAGE ------- */
/** Versioned, quota-aware localStorage wrapper. Everything namespaced. */
const Storage = {
  NS: 'kalam.v1.',
  available: (() => { try { const k = '__k'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  get(key, fallback = null) {
    if (!Storage.available) return fallback;
    try { const raw = localStorage.getItem(Storage.NS + key); return raw === null ? fallback : JSON.parse(raw); }
    catch (e) { return fallback; }
  },
  set(key, value) {
    if (!Storage.available) return false;
    try { localStorage.setItem(Storage.NS + key, JSON.stringify(value)); return true; }
    catch (e) { Storage.prune(); try { localStorage.setItem(Storage.NS + key, JSON.stringify(value)); return true; } catch (e2) { return false; } }
  },
  del(key) { if (Storage.available) try { localStorage.removeItem(Storage.NS + key); } catch (e) {} },
  keys(prefix = '') {
    if (!Storage.available) return [];
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(Storage.NS + prefix)) out.push(k.slice(Storage.NS.length));
    }
    return out;
  },
  prune() {
    const projects = Storage.keys('project.').sort();
    for (let i = 0; i < Math.ceil(projects.length / 2); i++) Storage.del(projects[i]);
  },
  usageBytes() {
    if (!Storage.available) return 0;
    let n = 0;
    for (const k of Storage.keys()) { const v = localStorage.getItem(Storage.NS + k); if (v) n += v.length + k.length; }
    return n;
  }
};

/* ------------------------------------------------------------ PERF ------- */
/** Rolling frame-time monitor + automatic quality governor. */
class PerfMonitor {
  constructor() {
    this.samples = new Float32Array(120); this.idx = 0; this.count = 0;
    this.fps = 60; this.frameMs = 16.7; this.worst = 0;
    this.quality = 1; this.tier = 'high'; this.dropped = 0;
    this._acc = 0; this._frames = 0; this._last = 0;
    this.autoAdjust = true;
  }
  tick(now) {
    if (this._last) {
      const dt = now - this._last;
      this.samples[this.idx = (this.idx + 1) % this.samples.length] = dt;
      this.count = Math.min(this.count + 1, this.samples.length);
      this.frameMs = this.avg();
      this.worst = Math.max(this.worst * 0.98, dt);
      this._acc += dt; this._frames++;
      if (this._acc >= 500) { this.fps = (this._frames * 1000) / this._acc; this._acc = 0; this._frames = 0; this.govern(); }
      if (dt > 34) this.dropped++;
    }
    this._last = now;
  }
  avg() { let s = 0; for (let i = 0; i < this.count; i++) s += this.samples[i]; return this.count ? s / this.count : 16.7; }
  govern() {
    if (!this.autoAdjust) return;
    const prev = this.quality;
    if (this.fps < 34 && this.quality > 0.45) this.quality = Math.max(0.45, this.quality - 0.12);
    else if (this.fps < 50 && this.quality > 0.7) this.quality = Math.max(0.7, this.quality - 0.06);
    else if (this.fps > 57 && this.quality < 1) this.quality = Math.min(1, this.quality + 0.04);
    this.tier = this.quality > 0.9 ? 'high' : this.quality > 0.65 ? 'medium' : 'low';
    if (prev !== this.quality) EventBus.global?.emit('quality', this.quality);
  }
  memoryMB() { return performance.memory ? performance.memory.usedJSHeapSize / 1048576 : 0; }
}
EventBus.global = new EventBus();

/* ------------------------------------------------------ UTILITIES -------- */
const Util = {
  debounce(fn, ms = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  throttle(fn, ms = 100) { let last = 0, t; return (...a) => { const n = Date.now(); if (n - last >= ms) { last = n; fn(...a); } else { clearTimeout(t); t = setTimeout(() => { last = Date.now(); fn(...a); }, ms - (n - last)); } }; },
  deepClone(o) { return JSON.parse(JSON.stringify(o)); },
  merge(target, ...srcs) { for (const s of srcs) { if (!s) continue; for (const k of Object.keys(s)) { const v = s[k]; if (v && typeof v === 'object' && !Array.isArray(v) && typeof target[k] === 'object' && target[k] !== null && !Array.isArray(target[k])) Util.merge(target[k], v); else target[k] = v; } } return target; },
  el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
      else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    }
    for (const c of [].concat(children)) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return e;
  },
  download(blobOrUrl, filename) {
    const url = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); if (typeof blobOrUrl !== 'string') URL.revokeObjectURL(url); }, 1500);
  },
  formatBytes(b) { const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return `${roundTo(b, 1)} ${u[i]}`; },
  formatTime(s) { const m = Math.floor(s / 60), r = s - m * 60; return `${String(m).padStart(2, '0')}:${r.toFixed(2).padStart(5, '0')}`; },
  timecode(s, fps) { const f = Math.round((s % 1) * fps); const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}:${String(f).padStart(2, '0')}`; },
  haptic(pattern = 8) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} },
  isMobile() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024); },
  isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent); },
  deviceTier() {
    const mem = navigator.deviceMemory || 4;
    const cores = navigator.hardwareConcurrency || 4;
    if (Util.isMobile() && (mem <= 3 || cores <= 4)) return 'low';
    if (mem <= 4 || cores <= 4) return 'medium';
    return 'high';
  },
  words(str) { return (str || '').toLowerCase().replace(/[^a-z0-9\u0900-\u097F\s-]/g, ' ').split(/\s+/).filter(Boolean); },
  wrapText(ctx, text, maxWidth) {
    const words = String(text).split(/\s+/);
    const lines = []; let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  },
  truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
};

/* Path helpers used by geometry + brushes */
const PathUtil = {
  length(pts) { let l = 0; for (let i = 1; i < pts.length; i++) l += distXY(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y); return l; },
  cumulative(pts) {
    const c = [0];
    for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + distXY(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y));
    return c;
  },
  /** Resample a polyline to N evenly spaced points (keeps drawing speed natural). */
  resample(pts, n) {
    if (pts.length < 2) return pts.slice();
    const cum = PathUtil.cumulative(pts);
    const total = cum[cum.length - 1];
    if (total === 0) return [pts[0], pts[pts.length - 1]];
    const out = []; let j = 0;
    for (let i = 0; i < n; i++) {
      const target = (i / (n - 1)) * total;
      while (j < cum.length - 2 && cum[j + 1] < target) j++;
      const t = cum[j + 1] === cum[j] ? 0 : (target - cum[j]) / (cum[j + 1] - cum[j]);
      const a = pts[j], b = pts[j + 1];
      out.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), p: lerp(a.p || 0.5, b.p || 0.5, t) });
    }
    return out;
  },
  /** Slice polyline by arc-length ratio 0..1 — this is how "progressive draw" works. */
  sliceByRatio(pts, ratio) {
    if (pts.length < 2) return pts.slice();
    const r = clamp01(ratio);
    if (r >= 1) return pts.slice();
    if (r <= 0) return [pts[0]];
    const cum = PathUtil.cumulative(pts);
    const total = cum[cum.length - 1] * r;
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      if (cum[i] <= total) out.push(pts[i]);
      else {
        const t = (total - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        out.push({ x: lerp(pts[i - 1].x, pts[i].x, t), y: lerp(pts[i - 1].y, pts[i].y, t), p: lerp(pts[i - 1].p || .5, pts[i].p || .5, t) });
        break;
      }
    }
    return out;
  },
  pointAt(pts, ratio) {
    const cum = PathUtil.cumulative(pts);
    const total = cum[cum.length - 1] || 1;
    const target = clamp01(ratio) * total;
    for (let i = 1; i < pts.length; i++) {
      if (cum[i] >= target) {
        const t = (target - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        return { x: lerp(pts[i - 1].x, pts[i].x, t), y: lerp(pts[i - 1].y, pts[i].y, t), a: angleTo(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y) };
      }
    }
    const l = pts[pts.length - 1], p = pts[Math.max(0, pts.length - 2)];
    return { x: l.x, y: l.y, a: angleTo(p.x, p.y, l.x, l.y) };
  },
  /** Ramer-Douglas-Peucker simplification, iterative (no stack overflow on 10k points). */
  simplify(pts, epsilon = 1.5) {
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length);
    keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [s, e] = stack.pop();
      let maxD = 0, idx = -1;
      const ax = pts[s].x, ay = pts[s].y, bx = pts[e].x, by = pts[e].y;
      const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
      for (let i = s + 1; i < e; i++) {
        const d = Math.abs(dx * (ay - pts[i].y) - (ax - pts[i].x) * dy) / len;
        if (d > maxD) { maxD = d; idx = i; }
      }
      if (maxD > epsilon && idx > 0) { keep[idx] = 1; stack.push([s, idx], [idx, e]); }
    }
    const out = [];
    for (let i = 0; i < pts.length; i++) if (keep[i]) out.push(pts[i]);
    return out;
  },
  /** Chaikin corner-cutting smoothing — gives hand-drawn strokes their organic feel. */
  smooth(pts, iterations = 2) {
    let cur = pts;
    for (let it = 0; it < iterations; it++) {
      if (cur.length < 3) break;
      const out = [cur[0]];
      for (let i = 0; i < cur.length - 1; i++) {
        const p = cur[i], q = cur[i + 1];
        out.push({ x: 0.75 * p.x + 0.25 * q.x, y: 0.75 * p.y + 0.25 * q.y, p: 0.75 * (p.p || .5) + 0.25 * (q.p || .5) });
        out.push({ x: 0.25 * p.x + 0.75 * q.x, y: 0.25 * p.y + 0.75 * q.y, p: 0.25 * (p.p || .5) + 0.75 * (q.p || .5) });
      }
      out.push(cur[cur.length - 1]);
      cur = out;
    }
    return cur;
  },
  /** Add human-like jitter + overshoot to a perfect geometric path. */
  humanize(pts, amount = 1.6, seed = 1) {
    const r = new RNG(seed);
    let phase = r.range(0, 100);
    return pts.map((p, i) => {
      phase += 0.13;
      const j = noise.value1(phase) * amount;
      const j2 = noise.value1(phase + 37.7) * amount;
      const taper = Math.sin(PI * clamp01(i / (pts.length - 1)));
      return { x: p.x + j * (0.4 + taper * 0.6), y: p.y + j2 * (0.4 + taper * 0.6), p: p.p };
    });
  },
  bounds(pts, pad = 0) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; }
    if (x0 === Infinity) return { x: 0, y: 0, w: 0, h: 0, x0: 0, y0: 0, x1: 0, y1: 0 };
    return { x: x0 - pad, y: y0 - pad, w: (x1 - x0) + pad * 2, h: (y1 - y0) + pad * 2, x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
  },
  toPath2D(pts) {
    const p = new Path2D();
    if (!pts.length) return p;
    p.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      p.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    p.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    return p;
  }
};

/* ==========================================================================
   MODULE 10 · GEOMETRY  —  every path the bot can draw, generated as math
   40+ generators. All return [{x,y,p}] so brushes & reveal work uniformly.
   ========================================================================== */
'use strict';

const Geometry = {
  /* ---------------------------------------------------------- BASIC ------ */
  line(x1, y1, x2, y2, seg = 24) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg; out.push({ x: lerp(x1, x2, t), y: lerp(y1, y2, t), p: 0.5 + 0.2 * Math.sin(PI * t) }); }
    return out;
  },
  arc(cx, cy, r, a0, a1, seg = 60) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg, a = lerp(a0, a1, t); out.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, p: 0.5 }); }
    return out;
  },
  circle(cx, cy, r, seg = 96, startA = -PI / 2) { return Geometry.arc(cx, cy, r, startA, startA + TAU, seg); },
  ellipse(cx, cy, rx, ry, seg = 96, rot = 0) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * TAU;
      const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      const c = Math.cos(rot), s = Math.sin(rot);
      out.push({ x: cx + x * c - y * s, y: cy + x * s + y * c, p: 0.5 });
    }
    return out;
  },
  rect(x, y, w, h) {
    return [
      { x, y, p: .5 }, { x: x + w, y, p: .5 }, { x: x + w, y: y + h, p: .5 },
      { x, y: y + h, p: .5 }, { x, y, p: .5 }
    ];
  },
  roundedRect(x, y, w, h, r = 12, seg = 8) {
    r = Math.min(r, w / 2, h / 2);
    const out = [];
    const corner = (ccx, ccy, a0) => { for (let i = 0; i <= seg; i++) { const a = a0 + (i / seg) * (PI / 2); out.push({ x: ccx + Math.cos(a) * r, y: ccy + Math.sin(a) * r, p: .5 }); } };
    out.push({ x: x + r, y, p: .5 });
    out.push({ x: x + w - r, y, p: .5 }); corner(x + w - r, y + r, -PI / 2);
    out.push({ x: x + w, y: y + h - r, p: .5 }); corner(x + w - r, y + h - r, 0);
    out.push({ x: x + r, y: y + h, p: .5 }); corner(x + r, y + h - r, PI / 2);
    out.push({ x, y: y + r, p: .5 }); corner(x + r, y + r, PI);
    out.push({ x: x + r, y, p: .5 });
    return out;
  },
  polygon(cx, cy, r, sides = 5, rot = -PI / 2) {
    const out = [];
    for (let i = 0; i <= sides; i++) { const a = rot + (i / sides) * TAU; out.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, p: .5 }); }
    return out;
  },
  triangle(x, y, w, h) {
    return [{ x: x + w / 2, y, p: .5 }, { x: x + w, y: y + h, p: .5 }, { x, y: y + h, p: .5 }, { x: x + w / 2, y, p: .5 }];
  },
  star(cx, cy, spikes = 5, outer = 100, inner = 45, rot = -PI / 2) {
    const out = []; const step = PI / spikes; let a = rot;
    for (let i = 0; i < spikes; i++) {
      out.push({ x: cx + Math.cos(a) * outer, y: cy + Math.sin(a) * outer, p: .7 }); a += step;
      out.push({ x: cx + Math.cos(a) * inner, y: cy + Math.sin(a) * inner, p: .4 }); a += step;
    }
    out.push({ x: cx + Math.cos(rot) * outer, y: cy + Math.sin(rot) * outer, p: .7 });
    return out;
  },
  heart(cx, cy, size, seg = 120) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * TAU;
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      out.push({ x: cx + x * (size / 17), y: cy - y * (size / 17), p: 0.6 });
    }
    return out;
  },
  arrow(x1, y1, x2, y2, head = 18, wing = 0.45) {
    const a = angleTo(x1, y1, x2, y2);
    const bx = x2 - Math.cos(a) * head, by = y2 - Math.sin(a) * head;
    return [
      { x: x1, y: y1, p: .5 }, { x: bx, y: by, p: .5 }, { x: x2, y: y2, p: .7 },
      { x: bx, y: by, p: .5 },
      { x: bx + Math.cos(a + wing) * head, y: by + Math.sin(a + wing) * head, p: .5 },
      { x: bx, y: by, p: .5 },
      { x: bx + Math.cos(a - wing) * head, y: by + Math.sin(a - wing) * head, p: .5 }
    ];
  },
  curvedArrow(x1, y1, x2, y2, bow = 0.25, seg = 48) {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const cx = mx - dy * bow, cy = my + dx * bow;
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, u = 1 - t;
      out.push({ x: u * u * x1 + 2 * u * t * cx + t * t * x2, y: u * u * y1 + 2 * u * t * cy + t * t * y2, p: .55 });
    }
    const tailA = angleTo(out[out.length - 3].x, out[out.length - 3].y, x2, y2);
    const h = 16;
    out.push({ x: x2 - Math.cos(tailA - 0.4) * h, y: y2 - Math.sin(tailA - 0.4) * h, p: .5 });
    out.push({ x: x2, y: y2, p: .7 });
    out.push({ x: x2 - Math.cos(tailA + 0.4) * h, y: y2 - Math.sin(tailA + 0.4) * h, p: .5 });
    return out;
  },

  /* ----------------------------------------------------------- CURVES ---- */
  bezier(p0, c1, c2, p1, seg = 60) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, u = 1 - t;
      out.push({
        x: u ** 3 * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t ** 3 * p1.x,
        y: u ** 3 * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t ** 3 * p1.y,
        p: 0.5
      });
    }
    return out;
  },
  catmullRom(points, seg = 16, tension = 0.5) {
    if (points.length < 2) return points.slice();
    const out = [];
    const pts = [points[0], ...points, points[points.length - 1]];
    for (let i = 1; i < pts.length - 2; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
      for (let s = 0; s < seg; s++) {
        const t = s / seg, t2 = t * t, t3 = t2 * t;
        out.push({
          x: tension * ((-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3 + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + p2.x) * t + 2 * p1.x),
          y: tension * ((-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3 + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + p2.y) * t + 2 * p1.y),
          p: .5
        });
      }
    }
    out.push({ ...points[points.length - 1] });
    return out;
  },

  /* ---------------------------------------------------------- SPIRALS ---- */
  archimedeanSpiral(cx, cy, a, b, turns = 4, seg = 400) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg, th = t * TAU * turns, r = a + b * th; out.push({ x: cx + Math.cos(th) * r, y: cy + Math.sin(th) * r, p: .5 }); }
    return out;
  },
  goldenSpiral(cx, cy, a = 4, b = 0.3063, turns = 3, seg = 320) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg, th = t * TAU * turns, r = a * Math.exp(b * th); out.push({ x: cx + Math.cos(th) * r, y: cy + Math.sin(th) * r, p: .45 + t * .2 }); }
    return out;
  },
  logarithmicSpiral(cx, cy, a, k, turns = 4, seg = 360) { return Geometry.goldenSpiral(cx, cy, a, k, turns, seg); },

  /* ----------------------------------------------------------- WAVES ----- */
  sineWave(x0, y0, length, amp, freq, seg = 160, phase = 0) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg; out.push({ x: x0 + t * length, y: y0 + Math.sin(t * TAU * freq + phase) * amp, p: .5 }); }
    return out;
  },
  sawWave(x0, y0, length, amp, freq, seg = 200) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg; const v = ((t * freq) % 1) * 2 - 1; out.push({ x: x0 + t * length, y: y0 + v * amp, p: .5 }); }
    return out;
  },
  squareWave(x0, y0, length, amp, freq, seg = 400) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg; const v = Math.sin(t * TAU * freq) >= 0 ? 1 : -1; out.push({ x: x0 + t * length, y: y0 + v * amp, p: .5 }); }
    return out;
  },
  lissajous(cx, cy, rx, ry, a, b, delta = PI / 2, seg = 400) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = (i / seg) * TAU; out.push({ x: cx + rx * Math.sin(a * t + delta), y: cy + ry * Math.sin(b * t), p: .5 }); }
    return out;
  },
  rose(cx, cy, r, k, seg = 500) {
    const out = [];
    const turns = Number.isInteger(k) ? (k % 2 === 0 ? 2 : 1) : 2;
    for (let i = 0; i <= seg; i++) { const t = (i / seg) * TAU * turns, rr = r * Math.cos(k * t); out.push({ x: cx + rr * Math.cos(t), y: cy + rr * Math.sin(t), p: .5 }); }
    return out;
  },
  butterfly(cx, cy, s, seg = 600) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * TAU * 6;
      const r = Math.exp(Math.sin(t)) - 2 * Math.cos(4 * t) + Math.sin((2 * t - PI) / 24) ** 5;
      out.push({ x: cx + Math.cos(t) * r * s, y: cy - Math.sin(t) * r * s, p: .5 });
    }
    return out;
  },
  cycloid(cx, cy, r, ratio = 1, turns = 3, seg = 400) {
    const out = [];
    for (let i = 0; i <= seg; i++) { const t = (i / seg) * TAU * turns; out.push({ x: cx + r * (t - Math.sin(t)), y: cy - r * (1 - Math.cos(t)) * ratio, p: .5 }); }
    return out;
  },
  hypotrochoid(cx, cy, R, r, d, seg = 700) {
    const out = [];
    const turns = Math.ceil(r / gcd(Math.round(R), Math.round(r)) || 1) * (r | 0 || 1);
    const maxT = TAU * clamp(turns, 1, 40);
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * maxT;
      out.push({
        x: cx + (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t),
        y: cy + (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t), p: .5
      });
    }
    return out;
  },
  epitrochoid(cx, cy, R, r, d, seg = 700) {
    const out = [];
    const maxT = TAU * clamp(Math.round(r) || 6, 1, 40);
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * maxT;
      out.push({ x: cx + (R + r) * Math.cos(t) - d * Math.cos(((R + r) / r) * t), y: cy + (R + r) * Math.sin(t) - d * Math.sin(((R + r) / r) * t), p: .5 });
    }
    return out;
  },

  /* ----------------------------------------------------------- ORBIT ----- */
  orbit(cx, cy, a, b, phase = 0, ecc = 0, seg = 120) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * TAU;
      const rr = a / (1 + ecc * Math.cos(t));
      out.push({ x: cx + Math.cos(t + phase) * rr, y: cy + Math.sin(t + phase) * rr * (b / a), p: .5 });
    }
    return out;
  },
  pendulum(px, py, length, maxA = 0.9, cycles = 2, damp = 0.85, seg = 200) {
    const out = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const a = Math.sin(t * TAU * cycles) * maxA * Math.pow(damp, t * cycles);
      out.push({ x: px + Math.sin(a) * length, y: py + Math.cos(a) * length, p: .5 });
    }
    return out;
  },
  springPath(x0, y0, x1, y1, coils = 8, radius = 18, seg = 300) {
    const out = []; const a = angleTo(x0, y0, x1, y1); const len = distXY(x0, y0, x1, y1);
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const along = t * len;
      const off = Math.sin(t * TAU * coils) * radius * Math.sin(PI * t);
      out.push({ x: x0 + Math.cos(a) * along - Math.sin(a) * off, y: y0 + Math.sin(a) * along + Math.cos(a) * off, p: .5 });
    }
    return out;
  },
  randomWalk(x0, y0, steps = 120, step = 12, seed = 1, drift = 0) {
    const r = new RNG(seed); const out = [{ x: x0, y: y0, p: .5 }]; let x = x0, y = y0, a = r.range(0, TAU);
    for (let i = 0; i < steps; i++) { a += r.gauss(0, 0.5) + drift; x += Math.cos(a) * step; y += Math.sin(a) * step; out.push({ x, y, p: .5 }); }
    return out;
  },

  /* ---------------------------------------------------------- FRACTALS --- */
  /* (koch snowflake lives below as Geometry.koch — cleaner recursion) */
  sierpinski(cx, cy, r, depth = 3) {
    const out = [];
    const tri = (ax, ay, bx, by, ccx, ccy, d) => {
      if (d === 0) {
        out.push({ x: ax, y: ay, p: .5 }, { x: bx, y: by, p: .5 }, { x: ccx, y: ccy, p: .5 }, { x: ax, y: ay, p: .2 });
        return;
      }
      const abx = (ax + bx) / 2, aby = (ay + by) / 2;
      const bcx = (bx + ccx) / 2, bcy = (by + ccy) / 2;
      const cax = (ccx + ax) / 2, cay = (ccy + ay) / 2;
      tri(ax, ay, abx, aby, cax, cay, d - 1);
      tri(abx, aby, bx, by, bcx, bcy, d - 1);
      tri(cax, cay, bcx, bcy, ccx, ccy, d - 1);
    };
    const a = -PI / 2;
    tri(cx + Math.cos(a) * r, cy + Math.sin(a) * r, cx + Math.cos(a + TAU / 3) * r, cy + Math.sin(a + TAU / 3) * r, cx + Math.cos(a + 2 * TAU / 3) * r, cy + Math.sin(a + 2 * TAU / 3) * r, depth);
    return out;
  },
  fractalTree(x, y, len, angle = -PI / 2, depth = 7, spread = 0.42, shrink = 0.74, seed = 7) {
    const r = new RNG(seed); const out = [{ x, y, p: .5 }];
    const branch = (px, py, l, a, d) => {
      if (d <= 0 || l < 2) return;
      const nx = px + Math.cos(a) * l, ny = py + Math.sin(a) * l;
      out.push({ x: px, y: py, p: .3 + d * .08 }, { x: nx, y: ny, p: .3 + d * .08 }, { x: px, y: py, p: .05 });
      const jitter = r.gauss(0, 0.08);
      branch(nx, ny, l * shrink, a - spread + jitter, d - 1);
      branch(nx, ny, l * shrink, a + spread + jitter, d - 1);
      if (d > 4 && r.chance(0.25)) branch(nx, ny, l * shrink * 0.8, a + jitter * 3, d - 1);
    };
    branch(x, y, len, angle, depth);
    return out;
  },
  hilbert(x, y, size, order = 3) {
    const pts = []; const n = 2 ** order;
    for (let i = 0; i < n * n; i++) {
      let rx, ry, tx = 0, ty = 0, t = i, s = 1;
      const d = t;
      for (let ss = 1; ss < n; ss *= 2) {
        rx = 1 & (d / ss); ry = 1 & ((d / ss) ^ rx);
        if (ry === 0) { if (rx === 1) { tx = ss - 1 - tx; ty = ss - 1 - ty; } const tmp = tx; tx = ty; ty = tmp; }
        tx += ss * rx; ty += ss * ry;
      }
      pts.push({ x: x + (tx + 0.5) * (size / n), y: y + (ty + 0.5) * (size / n), p: .5 });
    }
    return pts;
  },

  /* -------------------------------------------------------- DIAGRAMS ----- */
  flowchartNode(kind, cx, cy, w, h) {
    switch (kind) {
      case 'terminator': return Geometry.roundedRect(cx - w / 2, cy - h / 2, w, h, h / 2);
      case 'decision': return [{ x: cx, y: cy - h / 2, p: .5 }, { x: cx + w / 2, y: cy, p: .5 }, { x: cx, y: cy + h / 2, p: .5 }, { x: cx - w / 2, y: cy, p: .5 }, { x: cx, y: cy - h / 2, p: .5 }];
      case 'data': {
        const s = h * 0.28;
        return [{ x: cx - w / 2 + s, y: cy - h / 2, p: .5 }, { x: cx + w / 2, y: cy - h / 2, p: .5 }, { x: cx + w / 2 - s, y: cy + h / 2, p: .5 }, { x: cx - w / 2, y: cy + h / 2, p: .5 }, { x: cx - w / 2 + s, y: cy - h / 2, p: .5 }];
      }
      case 'document': {
        const top = cy - h / 2, bot = cy + h / 2;
        const outp = [];
        for (let i = 0; i <= 24; i++) { const t = i / 24; outp.push({ x: lerp(cx - w / 2, cx + w / 2, t), y: top, p: .5 }); }
        outp.push({ x: cx + w / 2, y: bot - h * 0.12, p: .5 });
        for (let i = 0; i <= 24; i++) { const t = i / 24; outp.push({ x: lerp(cx + w / 2, cx - w / 2, t), y: bot - h * 0.12 + Math.sin(t * PI * 2) * h * 0.12, p: .5 }); }
        outp.push({ x: cx - w / 2, y: top, p: .5 });
        return outp;
      }
      default: return Geometry.rect(cx - w / 2, cy - h / 2, w, h);
    }
  },
  speechBubble(cx, cy, w, h, tail = 'bl') {
    const r = Math.min(w, h) * 0.18;
    const pts = Geometry.roundedRect(cx - w / 2, cy - h / 2, w, h, r, 6);
    const tx = tail === 'br' ? cx + w * 0.25 : cx - w * 0.25;
    const ty = cy + h / 2;
    const idx = pts.findIndex(p => Math.abs(p.y - ty) < 1 && p.x > cx - w / 2 + r);
    if (idx > 0) pts.splice(idx + 1, 0, { x: tx + 12, y: ty, p: .5 }, { x: tx, y: ty + h * 0.28, p: .5 }, { x: tx - 14, y: ty, p: .5 });
    return pts;
  },
  cloud(cx, cy, w, h, seed = 3) {
    const r = new RNG(seed); const out = [];
    const bumps = 9;
    for (let i = 0; i <= bumps * 8; i++) {
      const t = (i / (bumps * 8)) * TAU;
      const wob = 1 + 0.22 * Math.sin(t * bumps + r.range(-0.2, 0.2));
      out.push({ x: cx + Math.cos(t) * (w / 2) * wob, y: cy + Math.sin(t) * (h / 2) * wob * 0.72, p: .5 });
    }
    return out;
  },
  lightningBolt(x1, y1, x2, y2, jag = 26, seed = 5, branches = 2) {
    const r = new RNG(seed); const out = [];
    const n = 14; const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const bx = lerp(x1, x2, t), by = lerp(y1, y2, t);
      const off = (i === 0 || i === n) ? 0 : r.gauss(0, jag);
      const a = angleTo(x1, y1, x2, y2) + PI / 2;
      pts.push({ x: bx + Math.cos(a) * off, y: by + Math.sin(a) * off, p: .8 });
    }
    out.push(...pts);
    for (let b = 0; b < branches; b++) {
      const at = pts[3 + b * 4] || pts[pts.length >> 1];
      const dir = angleTo(x1, y1, x2, y2) + (b % 2 ? 0.8 : -0.8);
      const len = distXY(x1, y1, x2, y2) * 0.35;
      out.push({ x: at.x, y: at.y, p: .2 });
      let cx2 = at.x, cy2 = at.y, ca = dir;
      for (let i = 0; i < 5; i++) { ca += r.gauss(0, 0.35); cx2 += Math.cos(ca) * (len / 5); cy2 += Math.sin(ca) * (len / 5); out.push({ x: cx2, y: cy2, p: .5 }); }
      out.push({ x: at.x, y: at.y, p: .1 });
    }
    return out;
  },
  dnaHelix(cx, cy, h, amp, turns = 4, seg = 300, withRungs = true) {
    const out = [];
    const strand = (ph) => {
      const o = [];
      for (let i = 0; i <= seg; i++) { const t = i / seg; o.push({ x: cx + Math.sin(t * TAU * turns + ph) * amp, y: cy - h / 2 + t * h, p: .5 }); }
      return o;
    };
    out.push(...strand(0));
    out.push({ x: cx, y: cy, p: 0 });
    out.push(...strand(PI));
    if (withRungs) {
      for (let i = 0; i < turns * 2; i++) {
        const t = (i + 0.5) / (turns * 2);
        const y = cy - h / 2 + t * h;
        const x1 = cx + Math.sin(t * TAU * turns) * amp, x2 = cx + Math.sin(t * TAU * turns + PI) * amp;
        out.push({ x: x1, y, p: .1 }, { x: x2, y, p: .35 });
      }
    }
    return out;
  },
  atom(cx, cy, r, orbits = 3, seg = 120) {
    const out = [];
    out.push(...Geometry.circle(cx, cy, r * 0.14, 40));
    for (let i = 0; i < orbits; i++) {
      out.push({ x: cx, y: cy, p: 0 });
      out.push(...Geometry.ellipse(cx, cy, r, r * 0.36, seg, (i / orbits) * PI));
    }
    return out;
  },
  gear(cx, cy, r, teeth = 10, toothH = 0.18) {
    const out = []; const steps = teeth * 4;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps; const a = t * TAU;
      const phase = (i % 4);
      const rr = r * (phase === 1 || phase === 2 ? 1 + toothH : 1);
      out.push({ x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr, p: .5 });
    }
    return out;
  },
  molecule(cx, cy, count = 5, bond = 60, seed = 11) {
    const r = new RNG(seed); const out = []; const nodes = [{ x: cx, y: cy, main: true }];
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + r.gauss(0, 0.2);
      const d = bond * r.range(0.8, 1.25);
      nodes.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d });
    }
    for (let i = 1; i < nodes.length; i++) out.push(...Geometry.line(nodes[0].x, nodes[0].y, nodes[i].x, nodes[i].y, 6));
    return { path: out, nodes };
  },
  /* ------------------------------------------------------- 3D / ISO ------ */
  isoProject(x, y, z, ox = 0, oy = 0, scale = 1) {
    const ax = (x - y) * Math.cos(PI / 6) * scale;
    const ay = (x + y) * Math.sin(PI / 6) * scale - z * scale;
    return { x: ax + ox, y: ay + oy };
  },
  cube3D(cx, cy, size, opts = {}) {
    const s = size / 2;
    const v = [[-s, -s, -s], [s, -s, -s], [s, s, -s], [-s, s, -s], [-s, -s, s], [s, -s, s], [s, s, s], [-s, s, s]];
    const proj = v.map(p => {
      const q = opts.perspective ? perspectiveProject(p[0], p[1], p[2], opts.dist || 500) : p;
      return Geometry.isoProject(q[0], q[1], q[2], cx, cy, 1);
    });
    const edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
    const out = [];

  gridIso(cx, cy, cols, rows, cell = 40) {
    const out = [];
    for (let i = 0; i <= cols; i++) {
      const a = Geometry.isoProject(i * cell, 0, 0, cx, cy);
      const b = Geometry.isoProject(i * cell, rows * cell, 0, cx, cy);
      out.push({ x: a.x, y: a.y, p: .15 }, { x: b.x, y: b.y, p: .3 });
    }
    for (let j = 0; j <= rows; j++) {
      const a = Geometry.isoProject(0, j * cell, 0, cx, cy);
      const b = Geometry.isoProject(cols * cell, j * cell, 0, cx, cy);

  worldMapDots(cx, cy, w, h, density = 2200, seed = 17) {

    const masks = [
      { x: .18, y: .30, rx: .09, ry: .13 }, { x: .25, y: .62, rx: .06, ry: .16 },
      { x: .48, y: .30, rx: .10, ry: .10 }, { x: .52, y: .60, rx: .07, ry: .14 },
      { x: .62, y: .33, rx: .16, ry: .12 }, { x: .80, y: .68, rx: .07, ry: .07 },

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
function perspectiveProject(x, y, z, d) { const f = d / (d - z); return [x * f, y * f, z]; }

/* Koch snowflake needs a cleaner builder — dedicated implementation. */
Geometry.koch = function (cx, cy, r, depth = 3) {
  const a0 = -PI / 2;
  const tri = [0, 1, 2].map(i => ({ x: cx + Math.cos(a0 + (i / 3) * TAU) * r, y: cy + Math.sin(a0 + (i / 3) * TAU) * r }));
  const subdivide = (a, b, d) => {
    if (d === 0) return [a];
    const dx = (b.x - a.x) / 3, dy = (b.y - a.y) / 3;
    const p1 = { x: a.x + dx, y: a.y + dy };
    const p2 = { x: a.x + 2 * dx, y: a.y + 2 * dy };
    const ang = Math.atan2(dy, dx) - PI / 3, len = Math.hypot(dx, dy);
    const peak = { x: p1.x + Math.cos(ang) * len, y: p1.y + Math.sin(ang) * len };
    return [
      ...subdivide(a, p1, d - 1), ...subdivide(p1, peak, d - 1),
      ...subdivide(peak, p2, d - 1), ...subdivide(p2, b, d - 1)
    ];
  };
  const out = [];
  for (let i = 0; i < 3; i++) for (const q of subdivide(tri[i], tri[(i + 1) % 3], depth)) out.push({ x: q.x, y: q.y, p: .5 });
  out.push({ x: tri[0].x, y: tri[0].y, p: .5 });
  return out;
};

'use strict';

/* ------------------------------------------------------------ LAYER ------ */
class Layer {

      if (!drawLine) continue;
      let x;
      const wLine = ctx.measureText(drawLine).width + this.style.tracking * Math.max(0, drawLine.length - 1);
      if (this.style.align === 'center') x = this.p('x') - wLine / 2;
      else if (this.style.align === 'right') x = this.p('x') + m.w / 2 - wLine;
      else x = this.p('x') - m.w / 2;
      ctx.textAlign = 'left';
      if (this.style.tracking) {
        let cx2 = x;
        for (const ch of drawLine) {
          if (this.style.outline) ctx.strokeText(ch, cx2, y);
          ctx.fillText(ch, cx2, y);
          cx2 += ctx.measureText(ch).width + this.style.tracking;
        }
      } else {
        if (this.style.outline) ctx.strokeText(drawLine, x, y);
        ctx.fillText(drawLine, x, y);
      }
      // caret for typewriter feel
      if (mode !== 'none' && r < 1 && (mode === 'char' || mode === 'word' || mode === 'handwrite') && li === Math.min(m.lines.length, shownLines) - 1) {
        const cx3 = ctx.textAlign === 'left' ? x + wLine + 4 : this.p('x');
        ctx.fillRect(cx3, y - this.style.size * 0.45, Math.max(2, this.style.size * 0.06), this.style.size * 0.9);
      }
    }
    ctx.restore();
  }
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ------------------------------------------------------------ BOARD ------ */
/** Background surface: plain, grid, notebook, blackboard, blueprint, gradient. */
class BoardEl extends Element {
  constructor(opts = {}) {
    super({ type: 'board', ...opts });
    this.style = Object.assign({ kind: 'dark', color1: '#0b1020', color2: '#141a2e', grid: 64, dot: false, vignette: true }, opts.style || {});
    // NB: keep the full DEFAULT_PROPS — dropping `rot` left p('rot') undefined and
    // produced NaN anywhere rotation was read (caught by the QC finite check).
  }
  computeBounds() { const s = this.data.size || { w: 1920, h: 1080 }; return { x: 0, y: 0, w: s.w, h: s.h }; }
  applyTransform() {}
  draw(ctx, t, app) {
    const S = this.data.size || { w: 1920, h: 1080 };
    const s = this.style;
    ctx.save();
    ctx.globalAlpha = clamp01(this.p('opacity'));
    if (s.kind === 'gradient' || s.kind === 'dark') {
      const g = ctx.createLinearGradient(0, 0, S.w, S.h);
      g.addColorStop(0, s.color1); g.addColorStop(1, s.color2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.w, S.h);
    } else if (s.kind === 'radial') {
      const g = ctx.createRadialGradient(S.w / 2, S.h / 2, 0, S.w / 2, S.h / 2, Math.max(S.w, S.h) * 0.7);
      g.addColorStop(0, s.color1); g.addColorStop(1, s.color2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.w, S.h);
    } else {
      ctx.fillStyle = s.color1; ctx.fillRect(0, 0, S.w, S.h);
    }
    if (s.kind === 'grid' || s.kind === 'blueprint' || s.kind === 'notebook') {
      const step = s.grid;
      ctx.lineWidth = s.kind === 'blueprint' ? 1 : 1.1;
      ctx.strokeStyle = s.kind === 'notebook' ? 'rgba(120,160,220,.30)' : (s.gridColor || 'rgba(255,255,255,.07)');
      ctx.beginPath();
      for (let x = 0; x <= S.w; x += step) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, S.h); }
      for (let y = 0; y <= S.h; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(S.w, y + .5); }
      ctx.stroke();
      if (s.kind === 'notebook') {
        ctx.strokeStyle = 'rgba(230,90,90,.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(90, 0); ctx.lineTo(90, S.h); ctx.stroke();
      }
    }
    if (s.kind === 'blackboard' || s.kind === 'chalkboard') {
      ctx.fillStyle = '#12211c'; ctx.fillRect(0, 0, S.w, S.h);
      // chalk dust texture
      ctx.globalAlpha *= 0.5;
      for (let i = 0; i < 900; i++) {
        const x = (noise.perlin2(i * 0.31, 3.3) * 0.5 + 0.5) * S.w;
        const y = (noise.perlin2(7.7, i * 0.27) * 0.5 + 0.5) * S.h;
        ctx.fillStyle = 'rgba(255,255,255,.05)';
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = clamp01(this.p('opacity'));
    }
    if (s.dot) {
      ctx.fillStyle = s.dotColor || 'rgba(255,255,255,.14)';
      for (let x = s.grid; x < S.w; x += s.grid) for (let y = s.grid; y < S.h; y += s.grid) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); }
    }
    if (s.vignette) {
      const g = ctx.createRadialGradient(S.w / 2, S.h / 2, Math.min(S.w, S.h) * 0.35, S.w / 2, S.h / 2, Math.max(S.w, S.h) * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, s.vignetteColor || 'rgba(0,0,0,.55)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.w, S.h);
    }
    ctx.restore();
  }
}

/* ------------------------------------------------------------ CODE ------- */
const CODE_TOKENS = [
  [/^(\s*)(#+.*)$/, 'comment'], [/^(\s*)(\/\/.*)$/, 'comment'], [/^(\s*)(\/\*[\s\S]*?\*\/)$/, 'comment'],
  [/\b(function|return|const|let|var|class|new|if|else|for|while|import|from|export|def|async|await|try|catch|print|lambda|this|null|true|false|None|True|False)\b/, 'kw'],
  [/\b(\d+(\.\d+)?)\b/, 'num'], [/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)/, 'str'],
  [/([{}()\[\];,.])/, 'punct'], [/\b([A-Za-z_]\w*)(?=\s*\()/, 'fn']
];
const CODE_COLORS = { kw: '#ff7edb', str: '#a5f3a5', num: '#ffd166', comment: '#6b7280', fn: '#67e8f9', punct: '#cbd5e1', def: '#e2e8f0' };
function highlightLine(line) {
  const out = []; let rest = line;
  while (rest.length) {
    let best = null;
    for (const [re, cls] of CODE_TOKENS) {
      const m = rest.match(re);
      if (m && m.index === 0) { best = { text: m[0], cls }; break; }
      if (m && (!best || m.index < best.index)) best = { text: m[0], cls, index: m.index };
    }
    if (!best) { out.push({ text: rest, cls: 'def' }); break; }
    const idx = best.index || 0;
    if (idx > 0) out.push({ text: rest.slice(0, idx), cls: 'def' });
    out.push({ text: best.text, cls: best.cls });
    rest = rest.slice(idx + best.text.length);
  }
  return out;
}

class CodeEl extends Element {
  constructor(opts = {}) {
    super({ type: 'code', ...opts });
    this.style = Object.assign({ size: 24, family: 'mono', bg: 'rgba(8,12,20,.92)', pad: 22, radius: 14, border: 'rgba(255,255,255,.10)', title: '', revealMode: 'line' }, opts.style || {});
    this.data = Object.assign({ code: '', lang: 'js' }, opts.data || {});
    this.positioned = true;
  }
  reviveData(d) { Object.assign(this.data, d); }
  lines() { return String(this.data.code || '').replace(/\t/g, '  ').split('\n'); }
  computeBounds() {
    const ls = this.lines();
    const w = Math.max(240, ...ls.map(l => l.length)) * this.style.size * 0.6 + this.style.pad * 2;
    const h = ls.length * this.style.size * 1.5 + this.style.pad * 2 + (this.style.title ? 26 : 0);
    return { x: this.p('x') - w * this.p('ax'), y: this.p('y') - h * this.p('ay'), w, h };
  }
  draw(ctx, t, app) {
    const b = this.bounds();
    const r = clamp01(this.p('reveal'));
    const ls = this.lines();
    const showN = Math.max(0, Math.ceil(ls.length * r));
    ctx.save();
    ctx.globalAlpha = clamp01(this.p('opacity'));
    ctx.fillStyle = this.style.bg;
    roundRectPath(ctx, b.x, b.y, b.w, b.h, this.style.radius);
    ctx.fill();
    ctx.strokeStyle = this.style.border; ctx.lineWidth = 1.5; ctx.stroke();
    // window dots
    const dotY = b.y + 16;
    ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(b.x + 18 + i * 18, dotY, 5, 0, TAU); ctx.fill(); });
    if (this.style.title) {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.font = `500 ${this.style.size * 0.62}px ${FONT_STACKS.mono}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.style.title, b.x + b.w / 2, dotY);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = `${this.style.size}px ${FONT_STACKS[this.style.family] || FONT_STACKS.mono}`;
    const lh = this.style.size * 1.5;
    for (let i = 0; i < showN; i++) {
      const y = b.y + this.style.pad + (this.style.title ? 22 : 0) + i * lh + lh / 2;
      let x = b.x + this.style.pad;
      for (const tk of highlightLine(ls[i])) {
        ctx.fillStyle = CODE_COLORS[tk.cls] || CODE_COLORS.def;
        ctx.fillText(tk.text, x, y);
        x += ctx.measureText(tk.text).width;
      }
    }
    ctx.restore();
  }
}

/* ----------------------------------------------------------- CHARTS ------ */
class ChartEl extends Element {
  constructor(opts = {}) {
    super({ type: 'chart', ...opts });
    this.style = Object.assign({
      colors: ['#3f6ad8', '#00f5d4', '#ff7e5f', '#ffd166', '#a78bfa'], size: 4,
      axisColor: 'rgba(255,255,255,.35)', labelSize: 24, labelColor: 'rgba(255,255,255,.85)',
      gridColor: 'rgba(255,255,255,.09)', valueLabels: true, thickness: 5
    }, opts.style || {});
    this.data = Object.assign({ kind: 'bar', labels: [], values: [], title: '', unit: '' }, opts.data || {});
    this.positioned = true;
  }
  reviveData(d) { Object.assign(this.data, d); }
  computeBounds() {
    const w = this.data.w || 760, h = this.data.h || 440;
    return { x: this.p('x') - w * this.p('ax'), y: this.p('y') - h * this.p('ay'), w, h };
  }
  draw(ctx, t, app) {
    const b = this.bounds();
    const r = clamp01(this.p('reveal'));
    const d = this.data;
    const pad = { l: 68, r: 24, t: d.title ? 58 : 28, b: 56 };
    const gw = b.w - pad.l - pad.r, gh = b.h - pad.t - pad.b;
    const vals = d.values || [];
    const max = Math.max(1, ...vals.map(v => Math.abs(v)));
    ctx.save();
    ctx.globalAlpha = clamp01(this.p('opacity'));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (d.title) {
      ctx.fillStyle = this.style.labelColor;
      ctx.font = `700 ${this.style.labelSize * 1.15}px ${FONT_STACKS.sans}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(d.title, b.x + 6, b.y + 30);
    }
    if (d.kind === 'pie' || d.kind === 'donut') {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const R = Math.min(gw, gh) / 2 - 8;
      const total = Math.max(1e-6, sum(vals));
      let a0 = -PI / 2;
      const shownTotal = total * r;
      let acc = 0;
      vals.forEach((v, i) => {
        if (acc >= shownTotal) return;
        const sweep = Math.min(v, shownTotal - acc) / total * TAU;
        acc += v;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, a0, a0 + sweep);
        ctx.closePath();
        ctx.fillStyle = this.style.colors[i % this.style.colors.length];
        ctx.fill();
        const mid = a0 + sweep / 2;
        if (sweep > 0.16 && this.style.valueLabels) {
          ctx.fillStyle = Color.readableOn(this.style.colors[i % this.style.colors.length]);
          ctx.font = `700 ${this.style.labelSize}px ${FONT_STACKS.sans}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(`${Math.round(v / total * 100)}%`, cx + Math.cos(mid) * R * 0.62, cy + Math.sin(mid) * R * 0.62);
        }
        a0 += sweep;
      });
      if (d.kind === 'donut') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.52, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      // legend
      ctx.textAlign = 'left'; ctx.font = `600 ${this.style.labelSize * 0.8}px ${FONT_STACKS.sans}`;
      (d.labels || []).forEach((lb, i) => {
        const lx = b.x + 10, ly = b.y + b.h - 26 - ((d.labels.length - 1 - i) * 26);
        ctx.fillStyle = this.style.colors[i % this.style.colors.length];
        ctx.fillRect(lx, ly - 8, 14, 14);
        ctx.fillStyle = this.style.labelColor;
        ctx.fillText(lb, lx + 22, ly);
      });
      ctx.restore(); return;
    }

    // axes + grid
    ctx.strokeStyle = this.style.gridColor; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) { const y = b.y + pad.t + (gh / 4) * i; ctx.moveTo(b.x + pad.l, y); ctx.lineTo(b.x + pad.l + gw, y); }
    ctx.stroke();
    ctx.strokeStyle = this.style.axisColor; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x + pad.l, b.y + pad.t);
    ctx.lineTo(b.x + pad.l, b.y + pad.t + gh);
    ctx.lineTo(b.x + pad.l + gw, b.y + pad.t + gh);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = `500 ${this.style.labelSize * 0.62}px ${FONT_STACKS.sans}`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const y = b.y + pad.t + gh - (gh / 4) * i;
      ctx.fillText(String(Math.round((max / 4) * i)) + (d.unit || ''), b.x + pad.l - 10, y);
    }

    const n = Math.max(1, vals.length);
    const slot = gw / n;
    if (d.kind === 'bar') {
      vals.forEach((v, i) => {
        const localR = clamp01((r * n) - i);
        if (localR <= 0) return;
        const bh = (Math.abs(v) / max) * gh * Ease.outCubic(localR);
        const x = b.x + pad.l + slot * i + slot * 0.18;
        const w = slot * 0.64;
        const y = b.y + pad.t + gh - bh;
        const c = this.style.colors[i % this.style.colors.length];
        const g = ctx.createLinearGradient(0, y, 0, y + bh);
        g.addColorStop(0, c); g.addColorStop(1, Color.shade(c, -0.18));
        ctx.fillStyle = g;
        roundRectPath(ctx, x, y, w, bh, Math.min(10, w / 3));
        ctx.fill();
        if (this.style.valueLabels && localR > 0.85) {
          ctx.fillStyle = this.style.labelColor;
          ctx.font = `700 ${this.style.labelSize * 0.75}px ${FONT_STACKS.sans}`;
          ctx.textAlign = 'center';
          ctx.fillText(String(v) + (d.unit || ''), x + w / 2, y - 16);
        }
      });
    } else { // line / area
      const pts = vals.map((v, i) => ({ x: b.x + pad.l + slot * (i + 0.5), y: b.y + pad.t + gh - (Math.abs(v) / max) * gh, p: .5 }));
      const shown = Math.max(2, Math.ceil(pts.length * r));
      const sub = pts.slice(0, shown);
      if (d.kind === 'area' && sub.length > 1) {
        ctx.beginPath();
        ctx.moveTo(sub[0].x, b.y + pad.t + gh);
        sub.forEach(q => ctx.lineTo(q.x, q.y));
        ctx.lineTo(sub[sub.length - 1].x, b.y + pad.t + gh);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, b.y + pad.t, 0, b.y + pad.t + gh);
        g.addColorStop(0, Color.alpha(this.style.colors[0], 0.45));
        g.addColorStop(1, Color.alpha(this.style.colors[0], 0.02));
        ctx.fillStyle = g; ctx.fill();
      }
      ctx.strokeStyle = this.style.colors[0]; ctx.lineWidth = this.style.thickness;
      ctx.beginPath();
      sub.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
      ctx.stroke();
      sub.forEach((q, i) => {
        ctx.fillStyle = this.style.colors[(i) % this.style.colors.length];
        ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#0b1020'; ctx.beginPath(); ctx.arc(q.x, q.y, 2.6, 0, TAU); ctx.fill();
      });
    }
    // x labels
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = `600 ${this.style.labelSize * 0.68}px ${FONT_STACKS.sans}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    (d.labels || []).forEach((lb, i) => {
      if (i >= n) return;
      ctx.fillText(Util.truncate(String(lb), 12), b.x + pad.l + slot * (i + 0.5), b.y + pad.t + gh + 12);
    });
    ctx.restore();
  }
}

/* ---------------------------------------------------------- DIAGRAM ------ */
/** Node/edge graph: flowcharts, mind-maps, cycles, neural nets. */
class DiagramEl extends Element {
  constructor(opts = {}) {
    super({ type: 'diagram', ...opts });
    this.style = Object.assign({
      nodeFill: 'rgba(63,106,216,.22)', nodeStroke: '#7cc4ff', edge: 'rgba(255,255,255,.55)',
      labelColor: '#eaf2ff', labelSize: 22, nodeW: 190, nodeH: 74, thickness: 3.5,
      shape: 'roundRect', flow: true
    }, opts.style || {});
    // data.nodes [{id,label,x,y,shape,color}], data.edges [{from,to,label,curve}]
    this.data = Object.assign({ nodes: [], edges: [] }, opts.data || {});
  }
  reviveData(d) { Object.assign(this.data, d); }
  computeBounds() {
    const ns = this.data.nodes || [];
    if (!ns.length) return { x: this.base.x - 100, y: this.base.y - 60, w: 200, h: 120 };
    const hw = this.style.nodeW / 2 + 10, hh = this.style.nodeH / 2 + 10;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of ns) { x0 = Math.min(x0, n.x - hw); y0 = Math.min(y0, n.y - hh); x1 = Math.max(x1, n.x + hw); y1 = Math.max(y1, n.y + hh); }
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  nodeById(id) { return (this.data.nodes || []).find(n => n.id === id); }
  draw(ctx, t, app) {
    const r = clamp01(this.p('reveal'));
    const nodes = this.data.nodes || [], edges = this.data.edges || [];
    const n = Math.max(1, nodes.length);
    const shownNodes = Math.ceil(n * r);
    ctx.save();
    ctx.globalAlpha = clamp01(this.p('opacity'));
    ctx.lineCap = 'round';
    // edges first
    edges.forEach((e, i) => {
      const a = this.nodeById(e.from), b = this.nodeById(e.to);
      if (!a || !b) return;
      const fromIdx = nodes.indexOf(a), toIdx = nodes.indexOf(b);
      const edgeR = clamp01((r * (n + edges.length)) - Math.max(fromIdx, toIdx) - 1);
      if (edgeR <= 0 || toIdx >= shownNodes) return;
      const p1 = edgePoint(a, b, this.style.nodeW, this.style.nodeH);
      const p2 = edgePoint(b, a, this.style.nodeW, this.style.nodeH);
      const curve = e.curve || 0;
      const mx = (p1.x + p2.x) / 2 - (p2.y - p1.y) * curve;
      const my = (p1.y + p2.y) / 2 + (p2.x - p1.x) * curve;
      ctx.strokeStyle = e.color || this.style.edge;
      ctx.lineWidth = this.style.thickness;
      ctx.setLineDash(e.dash || []);
      const full = [{ x: p1.x, y: p1.y, p: .5 }, { x: mx, y: my, p: .5 }, { x: p2.x, y: p2.y, p: .5 }];
      const bez = Geometry.bezier(full[0], { x: lerp(p1.x, mx, .66), y: lerp(p1.y, my, .66) }, { x: lerp(p2.x, mx, .66), y: lerp(p2.y, my, .66) }, full[2], 40);
      const sub = PathUtil.sliceByRatio(bez, edgeR);
      ctx.beginPath();
      sub.forEach((q, k) => k ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
      ctx.stroke();
      ctx.setLineDash([]);
      if (edgeR > 0.9) {
        const ang = angleTo(sub[Math.max(0, sub.length - 3)].x, sub[Math.max(0, sub.length - 3)].y, p2.x, p2.y);
        const hs = 13;
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x - Math.cos(ang - .42) * hs, p2.y - Math.sin(ang - .42) * hs);
        ctx.lineTo(p2.x - Math.cos(ang + .42) * hs, p2.y - Math.sin(ang + .42) * hs);
        ctx.closePath();
        ctx.fillStyle = e.color || this.style.edge; ctx.fill();
      }
      if (e.label && edgeR > 0.6) {
        ctx.fillStyle = this.style.labelColor;
        ctx.font = `600 ${this.style.labelSize * 0.78}px ${FONT_STACKS.sans}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.label, mx, my - 14);
      }
      // travelling pulse
      if (this.style.flow && sub.length > 2) {
        const pt = PathUtil.pointAt(sub, ((t * 0.5 + i * 0.17) % 1));
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 5.5, 0, TAU);
        ctx.fillStyle = e.pulseColor || '#00f5d4'; ctx.fill();
      }
    });
    // nodes
    nodes.forEach((nd, i) => {
      if (i >= shownNodes) return;
      const localR = clamp01((r * n) - i);
      const w = nd.w || this.style.nodeW, h = nd.h || this.style.nodeH;
      const sc = Ease.outBack(localR);
      ctx.save();
      ctx.translate(nd.x, nd.y); ctx.scale(sc || 0.001, sc || 0.001);
      const shape = nd.shape || this.style.shape;

  sorted() {
    const order = {};
    this.layers.forEach((l, i) => order[l.id] = i);
    return this.elements.slice().sort((a, b) => {
      const oa = order[a.layerId] ?? 999, ob = order[b.layerId] ?? 999;
      return oa - ob || a.z - b.z;
    });
  }
  addTrack(tr) { this.tracks.push(tr); return tr; }
  toJSON() {
    return {
      v: 1, name: this.name, format: this.format, duration: this.duration, seed: this.seed,
      palette: this.palette, mode: this.mode, layers: this.layers.map(l => l.toJSON()),
      elements: this.elements.map(e => e.toJSON()),
      tracks: this.tracks.map(t => t.toJSON ? t.toJSON() : t),
      cameraKeys: this.cameraKeys, captions: this.captions, audioCues: this.audioCues,
      meta: this.meta, createdAt: this.createdAt, updatedAt: Date.now()
    };
  }
  static fromJSON(o) {
    const s = new Scene({
      name: o.name, format: o.format, duration: o.duration, seed: o.seed,
      palette: o.palette, mode: o.mode, cameraKeys: o.cameraKeys || [],
      captions: o.captions || [], audioCues: o.audioCues || [], meta: o.meta || {}
    });
    s.layers = (o.layers || []).map(l => Layer.from(l));
    s.elements = (o.elements || []).map(e => Element.revive(e));
    s.tracks = (o.tracks || []).map(t => (typeof Track !== 'undefined' && Track.fromJSON) ? Track.fromJSON(t) : t);
    for (const el of s.elements) { if (!el.layerId && s.layers[0]) el.layerId = s.layers[0].id; }
    return s;
  }
  stats() {
    let pts = 0, strokes = 0, texts = 0;
    for (const e of this.elements) {
      if (e.type === 'stroke') { strokes++; pts += (e.data.pts || []).length; }
      if (e.type === 'text') texts++;
    }
    return { elements: this.elements.length, layers: this.layers.length, tracks: this.tracks.length, strokes, pts, texts, captions: this.captions.length, duration: this.duration };
  }
}

const ELEMENT_TYPES = {
  stroke: StrokeEl, shape: ShapeEl, text: TextEl, board: BoardEl, chart: ChartEl,
  diagram: DiagramEl, table: TableEl, image: ImageEl, particles: ParticleEl,
  code: CodeEl, icon: IconEl, generic: Element
};

Object.assign(KALAM, {
  Layer, Element, StrokeEl, ShapeEl, TextEl, BoardEl, CodeEl, ChartEl, DiagramEl,
  TableEl, ImageEl, ParticleEl, IconEl, Scene, ELEMENT_TYPES, ICONS, highlightLine, roundRectPath
});
