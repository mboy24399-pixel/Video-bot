    ctx.strokeStyle = '#9fb4cc'; ctx.lineWidth = 6 * s;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26 * s, 0); ctx.stroke();
    ctx.fillStyle = '#00f5d4';
    ctx.beginPath(); ctx.arc(26 * s, 0, 4.5 * s, 0, TAU); ctx.fill();
    ctx.restore();
    // shoulder hub
    ctx.fillStyle = '#253449';
    ctx.beginPath(); ctx.arc(shX, shY, 16 * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#00f5d4'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.arc(shX, shY, 16 * s, 0, TAU); ctx.stroke();
  }
  humanHand(ctx, s, angle, t, pressure) {
    ctx.save();
    ctx.rotate(-0.5 + Math.sin(t * 1.6) * 0.03);
    ctx.translate(10 * s, -70 * s);
    const skin = '#e8b48c', shade = '#c98f68';
    // palm
    ctx.fillStyle = skin;
    roundRectPath(ctx, -16 * s, -30 * s, 46 * s, 56 * s, 16 * s); ctx.fill();
    ctx.strokeStyle = shade; ctx.lineWidth = 1.6 * s; ctx.stroke();
    // fingers curled, index extended toward the nib
    const fingers = [[-10, 1], [-2, 1.1], [6, 1.0], [14, 0.85]];
    fingers.forEach(([fx, len], i) => {
      ctx.save();
      ctx.translate(fx * s, 24 * s);
      ctx.rotate((i - 1.5) * 0.12);
      ctx.fillStyle = i === 0 ? skin : shade;
      roundRectPath(ctx, -5 * s, 0, 11 * s, 30 * s * len, 5 * s); ctx.fill();
      ctx.restore();
    });
    // thumb
    ctx.save(); ctx.translate(-18 * s, -6 * s); ctx.rotate(-0.7);
    ctx.fillStyle = shade; roundRectPath(ctx, -5 * s, 0, 11 * s, 26 * s, 5 * s); ctx.fill();
    ctx.restore();
    ctx.restore();
    // pen held by the hand
    ctx.save();
    ctx.rotate(angle + PI * 0.72);
    ctx.fillStyle = '#f4d35e';
    roundRectPath(ctx, -6 * s, -6 * s, 78 * s, 12 * s, 4 * s); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.moveTo(-6 * s, -6 * s); ctx.lineTo(-22 * s, 0); ctx.lineTo(-6 * s, 6 * s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  pencil(ctx, s, angle) {
    ctx.save(); ctx.rotate(angle + PI * 0.72);
    ctx.fillStyle = '#f4d35e';
    roundRectPath(ctx, -8 * s, -7 * s, 92 * s, 14 * s, 3 * s); ctx.fill();
    ctx.fillStyle = '#e0b93f'; ctx.fillRect(-8 * s, -7 * s, 92 * s, 4 * s);
    ctx.fillStyle = '#e8c39e';
    ctx.beginPath(); ctx.moveTo(-8 * s, -7 * s); ctx.lineTo(-26 * s, 0); ctx.lineTo(-8 * s, 7 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.moveTo(-19 * s, -3 * s); ctx.lineTo(-27 * s, 0); ctx.lineTo(-19 * s, 3 * s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ef476f'; roundRectPath(ctx, 78 * s, -7 * s, 16 * s, 14 * s, 3 * s); ctx.fill();
    ctx.restore();
  }
  brushTip(ctx, s, angle, tool) {
    ctx.save(); ctx.rotate(angle + PI * 0.7);
    ctx.fillStyle = '#8b5e34';
    roundRectPath(ctx, 6 * s, -6 * s, 84 * s, 12 * s, 4 * s); ctx.fill();
    ctx.fillStyle = '#c9ced6';
    roundRectPath(ctx, -12 * s, -7 * s, 22 * s, 14 * s, 3 * s); ctx.fill();
    const col = (BrushLib.meta(tool) || {}).color || '#3f6ad8';
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-12 * s, -6 * s); ctx.lineTo(-34 * s, 0); ctx.lineTo(-12 * s, 6 * s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  laser(ctx, s, t) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,42,109,.75)'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-260 * s, -320 * s); ctx.stroke();
    ctx.fillStyle = '#ff2a6d';
    ctx.beginPath(); ctx.arc(0, 0, (4 + Math.sin(t * 9) * 1.4) * s, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,42,109,.6)'; ctx.lineWidth = 1.5 * s;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, (12 + i * 9) * s, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }
  cursor(ctx, s) {
    ctx.save();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, 24 * s); ctx.lineTo(6 * s, 18 * s); ctx.lineTo(11 * s, 28 * s);
    ctx.lineTo(15 * s, 26 * s); ctx.lineTo(10 * s, 16 * s); ctx.lineTo(18 * s, 15 * s);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

Object.assign(KALAM, { Director, BotHand });


/* ──────────────────────────────────────────────────────────────────────
   90-export.js
   ────────────────────────────────────────────────────────────────────── */
/* ==========================================================================
   MODULE 90 · EXPORT  —  video · frames · SVG · subtitles · project · metadata
   ========================================================================== */
'use strict';

const QUALITY_PRESETS = {
  ultra: { label: 'ULTRA 4K', scale: 2, fps: 60, bitrate: 60_000_000, note: '3840×2160 · 60fps · ~60 Mbps' },
  high: { label: 'HIGH 1080p', scale: 1, fps: 60, bitrate: 24_000_000, note: '1920×1080 · 60fps · ~24 Mbps' },
  medium: { label: 'MEDIUM 720p', scale: 1080 / 1280, fps: 30, bitrate: 10_000_000, note: '1280×720 · 30fps · ~10 Mbps' },
  low: { label: 'LOW 480p', scale: 480 / 854, fps: 24, bitrate: 4_000_000, note: '854×480 · 24fps · ~4 Mbps' },
  mobile: { label: 'MOBILE 360p', scale: 360 / 640, fps: 24, bitrate: 2_000_000, note: '640×360 · 24fps · ~2 Mbps' }
};

const Exporter = {
  busy: false, progress: 0, cancelled: false,

  /* ------------------------------------------------------- VIDEO --------- */
  supportedMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    const list = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/x-matroska;codecs=vp9'
    ];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
    return '';
  },
  extFor(mime) {
    if (!mime) return 'webm';
    if (mime.includes('mp4')) return 'mp4';
    if (mime.includes('matroska')) return 'mkv';
    return 'webm';
  },

  /** Real-time capture: plays the timeline and records the canvas + audio. */
  async recordVideo(app, opts = {}) {
    if (Exporter.busy) throw new Error('A recording is already running');
    if (!QC.canRecord()) throw new Error('This browser cannot record canvas video');
    const preset = QUALITY_PRESETS[opts.quality || 'high'];
    const scene = app.director.scene;
    if (!scene) throw new Error('Nothing to record');

    Exporter.busy = true; Exporter.progress = 0; Exporter.cancelled = false;
    const mime = Exporter.supportedMime();
    const fps = Math.min(preset.fps, scene.format.fps || 60);

    // Render into an export-sized canvas so quality presets really change output
    const out = document.createElement('canvas');
    out.width = Math.round(scene.format.w * preset.scale);
    out.height = Math.round(scene.format.h * preset.scale);
    const octx = out.getContext('2d', { alpha: false });

    const stream = out.captureStream(fps);
    const audioStream = app.settings.recordAudio ? app.audio.captureStream() : null;
    if (audioStream) for (const tr of audioStream.getAudioTracks()) stream.addTrack(tr);

    const rec = new MediaRecorder(stream, {
      mimeType: mime || undefined,
      videoBitsPerSecond: preset.bitrate,
      audioBitsPerSecond: 128_000
    });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => { rec.onstop = res; });

    Exporter.recorder = rec;
    rec.start(500);
    Log.info('export', `recording ${out.width}x${out.height} @${fps}fps ${mime}`);
    EventBus.global.emit('export:start', { width: out.width, height: out.height, fps });

    // Deterministic frame stepping (not wall-clock) → no dropped frames in the file
    const total = scene.duration;
    const step = 1 / fps;
    app.director.pause();
    if (app.settings.recordAudio) {
      app.audio.stopMusic();
      const musicCue = (scene.audioCues || []).find(c => c.type === 'music');
      if (musicCue) app.audio.playMusic({ mood: musicCue.mood, bars: Math.max(4, Math.ceil(total / 2)), seed: scene.seed });
      else app.audio.playMusic({ mood: scene.meta.mood || 'calm', bars: Math.max(4, Math.ceil(total / 2)), seed: scene.seed });
    }
    for (let t = 0; t <= total + 0.0001; t += step) {
      if (Exporter.cancelled) break;
      app.director.renderAt(t, app.renderer);
      octx.drawImage(app.renderer.world, 0, 0, out.width, out.height);
      Exporter.progress = clamp01(t / total);
      EventBus.global.emit('export:progress', Exporter.progress);
      // yield to the compositor so captureStream actually sees each frame
      await new Promise(r => setTimeout(r, Math.max(4, 1000 / fps / 2)));
    }
    await new Promise(r => setTimeout(r, 220));
    if (rec.state !== 'inactive') rec.stop();
    await stopped;
    app.audio.stopMusic();
    app.audio.releaseCapture();
    Exporter.busy = false;
    EventBus.global.emit('export:done');

    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const name = `${slug(scene.name)}-${out.width}x${out.height}.${Exporter.extFor(mime)}`;
    Log.info('export', `video ready: ${Util.formatBytes(blob.size)}`);
    if (opts.download !== false) Util.download(blob, name);
    return { blob, name, mime, width: out.width, height: out.height, fps, seconds: total };
  },
  cancel() { Exporter.cancelled = true; try { Exporter.recorder && Exporter.recorder.stop(); } catch (e) {} },

  /* ------------------------------------------------------- STILL --------- */
  async exportFrame(app, t, scale = 1) {
    const scene = app.director.scene;
    app.director.renderAt(t === undefined ? app.director.time : t, app.renderer);
    const blob = await app.renderer.pngBlob(scale);
    Util.download(blob, `${slug(scene.name)}-${roundTo(t, 2)}s.png`);
    return blob;
  },

  /** PNG sequence. Browsers cannot zip without a library, so frames are
      downloaded one after another with a short gap between them. */
  async exportSequence(app, opts = {}) {
    const scene = app.director.scene;
    const fps = opts.fps || 12;
    const step = 1 / fps;
    const maxFrames = opts.maxFrames || 240;
    Exporter.busy = true; Exporter.progress = 0; Exporter.cancelled = false;
    let n = 0;
    for (let t = 0; t <= scene.duration && n < maxFrames; t += step, n++) {
      if (Exporter.cancelled) break;
      app.director.renderAt(t, app.renderer);
      const blob = await app.renderer.pngBlob(opts.scale || 1);
      Util.download(blob, `${slug(scene.name)}_${String(n).padStart(4, '0')}.png`);
      Exporter.progress = clamp01(t / scene.duration);
      EventBus.global.emit('export:progress', Exporter.progress);
      await new Promise(r => setTimeout(r, 260));
    }
    Exporter.busy = false;
    EventBus.global.emit('export:done', { frames: n });
    return n;
  },

  /* --------------------------------------------------------- SVG --------- */
  exportSVG(app, opts = {}) {
    const scene = app.director.scene;
    // Export the *finished* drawing by default: evaluating at t=0 (the old
    // behaviour) returned every stroke at reveal 0 and produced an empty SVG.
    const t = opts.t !== undefined ? opts.t
      : (app.director.time > 0.05 ? app.director.time : Math.max(0, scene.duration - 0.001));
    app.director.evaluate(t);
    const W = scene.format.w, H = scene.format.h;
    const parts = [`<?xml version="1.0" encoding="UTF-8"?>`,
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`,
      `<title>${esc(scene.name)}</title>`,
      `<rect width="${W}" height="${H}" fill="${(PALETTES[scene.palette] || ['#0b1020'])[0]}"/>`];
    let paths = 0, texts = 0;
    for (const el of scene.sorted()) {
      if (!el.isActive(t)) continue;
      const op = clamp01(el.p('opacity'));
      if (op <= 0.01) continue;
      if (el.type === 'stroke' || el.type === 'shape') {
        const pts = el.revealedPts ? el.revealedPts(t) : (el.path ? PathUtil.sliceByRatio(el.path(), el.p('reveal')) : null);
        if (!pts || pts.length < 2) continue;
        const d = pts.map((p, i) => `${i ? 'L' : 'M'}${roundTo(p.x, 2)} ${roundTo(p.y, 2)}`).join(' ');
        const col = el.style.color || el.style.stroke || '#fff';
        const fill = el.style.fill || 'none';
        paths++;
        parts.push(`<path d="${d}" fill="${fill}" stroke="${col}" stroke-width="${roundTo(el.style.size || 3, 2)}" stroke-linecap="round" stroke-linejoin="round" opacity="${roundTo(op, 3)}"/>`);
      } else if (el.type === 'text') {
        const full = String(el.data.text || '');
        const txt = full.slice(0, Math.ceil(full.length * clamp01(el.p('reveal'))));
        if (!txt) continue;
        texts++;
        parts.push(`<text x="${roundTo(el.p('x'), 2)}" y="${roundTo(el.p('y'), 2)}" font-family="${el.style.family || 'sans-serif'}" font-size="${el.style.size}" font-weight="${el.style.weight}" fill="${el.style.color}" text-anchor="${el.style.align === 'center' ? 'middle' : el.style.align === 'right' ? 'end' : 'start'}" opacity="${roundTo(op, 3)}">${esc(txt)}</text>`);
      } else if (el.type === 'chart' || el.type === 'diagram' || el.type === 'table') {
        parts.push(`<!-- ${el.type}: ${esc(el.name)} (rasterised element — redraw to PNG for fidelity) -->`);
      }
    }
    parts.push('</svg>');
    const svg = parts.join('\n');
    Util.download(new Blob([svg], { type: 'image/svg+xml' }), `${slug(scene.name)}.svg`);
    Log.info('export', `SVG @${roundTo(t, 2)}s → ${paths} paths, ${texts} text nodes`);
    return svg;
  },

  /* ---------------------------------------------------- SUBTITLES -------- */
  exportSRT(app) {
    const scene = app.director.scene;
    const ts = (s) => {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60), ms = Math.round((s % 1) * 1000);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
    };
    const lines = scene.captions.map((c, i) => `${i + 1}\n${ts(c.t)} --> ${ts(c.t + c.dur)}\n${c.text}\n`);
    const srt = lines.join('\n');
    Util.download(new Blob([srt], { type: 'text/plain' }), `${slug(scene.name)}.srt`);
    return srt;
  },

  /* ------------------------------------------------------ PROJECT -------- */
  exportProject(app) {
    const json = JSON.stringify(app.director.scene.toJSON(), null, 1);
    Util.download(new Blob([json], { type: 'application/json' }), `${slug(app.director.scene.name)}.kalam.json`);
    return json;
  },
  async importProject(app, file) {
    const text = await file.text();
    const data = JSON.parse(text);
    const scene = Scene.fromJSON(data);
    const rep = QC.repair(scene);
    return rep.scene;
  },
  saveLocal(app, key) {
    const s = app.director.scene;
    const k = key || `project.${Date.now().toString(36)}`;
    const ok = Storage.set(k, { key: k, name: s.name, at: Date.now(), thumb: app.renderer.thumbnail(220), data: s.toJSON() });
    EventBus.global.emit('project:saved', k);
    return ok ? k : null;
  },
  listLocal() {
    return Storage.keys('project.').map(k => {
      const v = Storage.get(k);
      return v ? { key: k, name: v.name, at: v.at, thumb: v.thumb } : null;
    }).filter(Boolean).sort((a, b) => b.at - a.at);
  },
  loadLocal(app, key) {
    const v = Storage.get(key);
    if (!v) return null;
    const scene = Scene.fromJSON(v.data);
    return QC.repair(scene).scene;
  },
  deleteLocal(key) { Storage.del(key); EventBus.global.emit('project:deleted', key); },

  /* ---------------------------------------------- PLATFORM METADATA ------ */
  /** Generates real, scene-derived upload metadata. */
  metadata(app, platform = 'youtube') {
    const s = app.director.scene;
    const a = (s.meta && s.meta.analysis) || {};
    const topic = s.name;
    const caps = s.captions.map(c => c.text);
    const chapters = s.captions.slice(0, 12).map((c, i) => {
      const m = Math.floor(c.t / 60), sec = Math.floor(c.t % 60);
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')} ${Util.truncate(c.text.replace(/[.!?]$/, ''), 46)}`;
    });
    const keywords = Array.from(new Set([
      topic.toLowerCase(), a.intent, a.domain, a.style, a.mode,
      ...Util.words(caps.join(' ')).filter(w => w.length > 4 && DICTIONARY.has(w))
    ].filter(Boolean))).slice(0, 22);

    const base = {
      title: {
        youtube: `${topic} — Explained Visually`,
        instagram: `${topic} ✏️`,
        facebook: `${topic} | Visual Explainer`,
        tiktok: `${topic} #shorts`,
        linkedin: `${topic}: a 60-second visual breakdown`,
        x: `${topic} — drawn live by KALAM`
      }[platform] || topic,
      description: [
        `${topic} — drawn and animated automatically by KALAM Studio.`,
        '',
        caps.slice(0, 6).map(c => `• ${c}`).join('\n'),
        '',
        chapters.length ? 'Chapters:\n' + chapters.join('\n') : '',
        '',
        `Made with KALAM ${KALAM.version} · single-file browser studio · no plugins`
      ].filter(Boolean).join('\n'),
      tags: keywords,
      hashtags: keywords.slice(0, 8).map(k => '#' + k.replace(/\s+/g, '')).join(' '),
      chapters,
      duration: roundTo(s.duration, 1),
      resolution: `${s.format.w}×${s.format.h}`,
      aspect: s.format.key,
      fps: s.format.fps,
      thumbnailPrompt: `A clean ${a.style || 'minimal'} style still of "${topic}" at the most detailed moment`
    };
    return base;
  },

  async share(app, platform) {
    const meta = Exporter.metadata(app, platform);
    if (navigator.share) {
      try { await navigator.share({ title: meta.title, text: meta.description }); return true; } catch (e) { return false; }
    }
    try {
      await navigator.clipboard.writeText(`${meta.title}\n\n${meta.description}\n\n${meta.hashtags}`);
      EventBus.global.emit('toast', 'Upload metadata copied to clipboard');
      return true;
    } catch (e) { return false; }
  }
};

function slug(s) { return String(s || 'kalam').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'kalam'; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

Object.assign(KALAM, { Exporter, QUALITY_PRESETS, slug, esc });


/* ──────────────────────────────────────────────────────────────────────

/* ==========================================================================
   MODULE 95 · UI  —  panels, dock, timeline, HUD, gestures, shortcuts
   ========================================================================== */
'use strict';

class UI {
  constructor(app) {
    this.app = app;
    this.$ = (s) => document.querySelector(s);
    this.sheetOpen = null;
    this.dockTool = 'prompt';
    this.manualTool = null;
    this.manualColor = '#00f5d4';
    this.manualSize = 8;
    this.tl = this.$('#tlCanvas');
    this.tlx = this.tl.getContext('2d');
    this.hudEl = this.$('#hud');
    this._hudTick = 0;
    this._lastHud = '';
  }

  /* ---------------------------------------------------------- BOOT UI ---- */
  init() {
    this.buildDock();
    this.buildChips();
    this.buildSide();
    this.bindTop();
    this.bindTransport();
    this.bindDrawbar();
    this.bindSheet();
    this.bindStage();
    this.bindKeys();
    EventBus.global.on('toast', (msg, kind) => this.toast(msg, kind));
    EventBus.global.on('export:progress', (p) => this.progress(p));
    EventBus.global.on('director:caption', (c) => this.setCaption(c));
    EventBus.global.on('director:play', () => this.$('#tPlay').textContent = '❚❚');
    EventBus.global.on('director:pause', () => this.$('#tPlay').textContent = '▶');
    EventBus.global.on('export:start', () => { this.$('#recDot').classList.add('show'); this._recT0 = performance.now(); });
    EventBus.global.on('export:done', () => { this.$('#recDot').classList.remove('show'); this.progress(null); });
    EventBus.global.on('project:saved', () => this.toast('Project saved to this device', 'ok'));
    this.app.applySettings();
  }

  buildDock() {
    const items = [
      { id: 'prompt', ico: '✨', label: 'AI Draw', sheet: null },
      { id: 'tools', ico: '🖌️', label: 'Tools', sheet: 'tools' },
      { id: 'layers', ico: '🗂️', label: 'Layers', sheet: 'layers' },
      { id: 'templates', ico: '📚', label: 'Templates', sheet: 'templates' },
      { id: 'anim', ico: '🎞️', label: 'Animate', sheet: 'anim' },
      { id: 'camera', ico: '🎥', label: 'Camera', sheet: 'camera' },
      { id: 'fx', ico: '🪄', label: 'Effects', sheet: 'fx' },
      { id: 'audio', ico: '🔊', label: 'Audio', sheet: 'audio' },
      { id: 'script', ico: '📜', label: 'Script', sheet: 'script' },
      { id: 'record', ico: '⏺', label: 'Record', sheet: 'record' },
      { id: 'assets', ico: '💾', label: 'Projects', sheet: 'assets' },
      { id: 'cinema', ico: '🎦', label: 'Cinema', sheet: null },
      { id: 'settings', ico: '⚙️', label: 'Settings', sheet: 'settings' }
    ];
    const dock = this.$('#dock');
    dock.innerHTML = '';
    for (const it of items) {
      const b = Util.el('button', { class: 'dbtn' + (it.id === 'prompt' ? ' on' : ''), 'data-id': it.id });
      b.appendChild(Util.el('span', { class: 'ico', text: it.ico }));
      b.appendChild(Util.el('span', { text: it.label }));
      b.addEventListener('click', () => {
        Util.haptic(6);
        this.app.audio.init(); this.app.audio.sfx('tap');
        if (it.id === 'prompt') { this.$('#prompt').focus(); this.highlightDock('prompt'); return; }
        if (it.id === 'cinema') { this.app.setCinema(!this.app.cinema); this.highlightDock('cinema'); return; }
        this.open(it.sheet);
        this.highlightDock(it.id);
      });
      dock.appendChild(b);
    }
  }
  highlightDock(id) {

    });

  bindTransport() {
    const d = this.app.director;
    this.$('#tPlay').addEventListener('click', () => { this.app.audio.init(); this.app.audio.sfx('click'); d.toggle(); });
    const tl = this.$('#tlWrap');
    const scrub = (clientX) => {
      const r = tl.getBoundingClientRect();
      const p = clamp01((clientX - r.left) / r.width);
      d.seek(p * (d.scene ? d.scene.duration : 0));
    };
    let dragging = false;
    tl.addEventListener('pointerdown', (e) => { dragging = true; tl.setPointerCapture(e.pointerId); scrub(e.clientX); });
    tl.addEventListener('pointermove', (e) => { if (dragging) scrub(e.clientX); });
    tl.addEventListener('pointerup', (e) => { dragging = false; try { tl.releasePointerCapture(e.pointerId); } catch (x) {} });
    this.$('#speedSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      this.$('#speedSeg').querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); d.setSpeed(parseFloat(b.dataset.s));
    });
    const loopBtn = this.$('#btnLoop');
    loopBtn.classList.toggle('on', d.loop);
    loopBtn.addEventListener('click', () => { d.loop = !d.loop; loopBtn.classList.toggle('on', d.loop); this.toast('Loop ' + (d.loop ? 'on' : 'off')); });
  }

      camera: 'Camera', fx: 'Visual Effects', audio: 'Audio & Narration', script: 'Script Editor',

      export: 'Export', about: 'About KALAM', setup: 'One-time Setup'

  /* --------------------------------------------------------- CONTROLS ---- */
  slider(value, min, max, step, onInput, fmt) {
    const wrap = Util.el('div', { style: { flex: '1 1 auto', display: 'flex', alignItems: 'center', gap: '9px' } });
    const s = Util.el('input', { type: 'range', min: String(min), max: String(max), step: String(step) });
    s.value = String(value);
    const v = Util.el('div', { class: 'val', text: fmt ? fmt(value) : value });
    s.addEventListener('input', () => { const n = parseFloat(s.value); v.textContent = fmt ? fmt(n) : n; onInput(n); });
    wrap.appendChild(s); wrap.appendChild(v);
    return wrap;
  }
  toggle(on, onChange) {
    const b = Util.el('button', { class: 'mini' + (on ? ' on' : ''), text: on ? '✓' : '○', style: { width: '44px', height: '28px' } });
    b.addEventListener('click', () => {
      const now = !b.classList.contains('on');
      b.classList.toggle('on', now); b.textContent = now ? '✓' : '○';
      this.app.audio.sfx('tap'); onChange(now);
    });
    return b;
  }

  /* ------------------------------------------------------------ STAGE ---- */
  bindStage() {
    const stage = this.$('#stage'), view = this.$('#view');
    const app = this.app;
    const pointers = new Map();
    let gesture = null, stroke = null;

    const toWorld = (e) => {
      const r = view.getBoundingClientRect();
      const sx = (e.clientX - r.left) / r.width * view.clientWidth;
      const sy = (e.clientY - r.top) / r.height * view.clientHeight;
      return app.renderer.screenToWorld(app.director.camera || { x: 0, y: 0, zoom: 1 }, view.clientWidth, view.clientHeight, sx, sy);
    };

    view.addEventListener('pointerdown', (e) => {
      app.audio.init();
      view.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        gesture = { d: distXY(a.x, a.y, b.x, b.y), zoom: app.userCam.zoom, rot: app.userCam.rot || 0, ang: Math.atan2(b.y - a.y, b.x - a.x), moved: false };
        if (stroke) { this.finishStroke(stroke); stroke = null; }
        return;
      }
      if (this.manualTool && app.director.scene) {
        const w = toWorld(e);
        const el = new StrokeEl({
          layerId: app.director.scene.layer('Art').id, name: 'hand stroke',
          base: { opacity: 1, reveal: 1 },
          style: { color: this.manualColor, size: this.manualSize, brush: this.manualTool },
          data: { pts: [{ x: w.x, y: w.y, p: 0.5 }] }, z: 9999, inT: 0
        });
        app.director.scene.add(el);
        app.renderer.invalidate();
        stroke = el;
        app.audio.sfx('draw');
      } else {
        gesture = { pan: true, sx: e.clientX, sy: e.clientY, camx: app.userCam.x, camy: app.userCam.y, moved: false };
      }
    });
    view.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && gesture && gesture.d) {
        const [a, b] = Array.from(pointers.values());
        const d = distXY(a.x, a.y, b.x, b.y);
        app.userCam.zoom = clamp(gesture.zoom * (d / gesture.d), 0.3, 6);
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        app.userCam.rot = gesture.rot + (ang - gesture.ang);
        gesture.moved = true;
        return;
      }
      if (stroke) {
        const w = toWorld(e);
        const last = stroke.data.pts[stroke.data.pts.length - 1];
        if (distXY(last.x, last.y, w.x, w.y) > 1.5) {
          const v = distXY(last.x, last.y, w.x, w.y);
          stroke.data.pts.push({ x: w.x, y: w.y, p: clamp01(1 - v / 60) });
          stroke.invalidate();
        }
      } else if (gesture && gesture.pan) {
        const fit = Math.min(view.clientWidth / app.renderer.w, view.clientHeight / app.renderer.h) * (app.director.camera ? app.director.camera.zoom : 1);
        app.userCam.x = gesture.camx - (e.clientX - gesture.sx) / fit;
        app.userCam.y = gesture.camy - (e.clientY - gesture.sy) / fit;
        gesture.moved = true;
      }
    });
    const up = (e) => {
      if (gesture && !gesture.moved && app.cinema) app.cinemaPeek();   // tap = peek at controls
      pointers.delete(e.pointerId);
      if (stroke) {
        stroke.data.pts = PathUtil.simplify(stroke.data.pts, 1.2);
        stroke.invalidate();
        app.renderer.invalidate();
        this.finishStroke(stroke);
        stroke = null;
      }
      if (pointers.size < 2) gesture = null;
    };
    view.addEventListener('pointerup', up);
    view.addEventListener('pointercancel', up);
    view.addEventListener('pointerleave', up);
    view.addEventListener('wheel', (e) => {
      e.preventDefault();
      app.userCam.zoom = clamp(app.userCam.zoom * (e.deltaY < 0 ? 1.08 : 0.925), 0.3, 6);
    }, { passive: false });
    view.addEventListener('dblclick', () => { app.userCam = { x: 0, y: 0, zoom: 1, rot: 0 }; this.toast('Camera reset'); });
    view.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  finishStroke(el) {
    const app = this.app;
    if (!app.director.scene) return;
    // give the hand-drawn stroke a reveal track so scrubbing replays it
    app.director.scene.addTrack(new Track({
      targetId: el.id, prop: 'reveal',
      keys: [{ t: app.director.time, v: 0 }, { t: app.director.time + clamp(PathUtil.length(el.data.pts) / 900, 0.4, 3), v: 1 }],
      ease: 'linear', label: 'hand stroke'
    }));
    app.director.buildHandPlan();
    this.toast('Stroke added to the timeline', 'ok');
  }

  bindKeys() {
    window.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      const d = this.app.director;
      switch (e.key) {
        case ' ': e.preventDefault(); this.app.audio.init(); d.toggle(); break;
        case 'ArrowLeft': e.preventDefault(); d.step(e.shiftKey ? -10 : -1); break;
        case 'ArrowRight': e.preventDefault(); d.step(e.shiftKey ? 10 : 1); break;
        case 'j': case 'J': d.setSpeed(Math.max(0.1, d.speed / 2)); break;
        case 'l': case 'L': d.setSpeed(Math.min(10, d.speed * 2)); break;
        case 'k': case 'K': d.toggle(); break;
        case 'g': case 'G': this.app.renderer.showGrid = !this.app.renderer.showGrid; this.toast('Grid ' + (this.app.renderer.showGrid ? 'on' : 'off')); break;
        case 's': case 'S': if (!e.ctrlKey && !e.metaKey) { this.app.renderer.showSafe = !this.app.renderer.showSafe; this.toast('Safe areas ' + (this.app.renderer.showSafe ? 'on' : 'off')); } break;
        case 'h': case 'H': document.body.classList.toggle('hideHud'); break;
        case 'r': case 'R': this.app.recordVideo(); break;
        case 'e': case 'E': this.open('export'); break;
        case 'n': case 'N': this.$('#prompt').focus(); break;
        case 'Escape': this.close(); break;
        default:
          if (/^[1-5]$/.test(e.key)) {
            const k = Object.keys(MASTER_MODES)[parseInt(e.key) - 1];
            if (k) { this.app.settings.mode = k; this.app.saveSettings(); this.buildSide(); this.toast(MASTER_MODES[k].name); }
          }
      }
    });
  }

  /* ------------------------------------------------------------ FEEDBACK - */
  toast(msg, kind = '') {
    const wrap = this.$('#toasts');
    const t = Util.el('div', { class: 'toast ' + kind, text: msg });
    wrap.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 320); }, 3200);
    let guard = 0;
    while (wrap.children.length > 4 && guard++ < 64) wrap.removeChild(wrap.children[0]);
  }
  progress(p) {
    const w = this.$('#progressWrap');
    if (p === null || p === undefined) { w.classList.remove('show'); return; }
    w.classList.add('show');
    this.$('#progBar').style.width = (p * 100).toFixed(1) + '%';
    this.$('#progPct').textContent = Math.round(p * 100) + '%';
    this.$('#progLabel').textContent = Exporter.busy ? 'Rendering frames…' : 'Working…';
  }
  setCaption(c) {
    const el = this.$('#caption');
    if (!c || !c.text) { el.classList.remove('show'); return; }
    el.textContent = c.text;
    el.classList.add('show');
  }

  /* --------------------------------------------------------------- HUD --- */
  updateHUD(app) {
    if (document.body.classList.contains('hideHud')) return;
    if (++this._hudTick % 6 !== 0) return;
    const r = app.renderer.stats, p = app.perf, s = app.director.scene;
    const st = s ? s.stats() : { elements: 0, pts: 0, tracks: 0 };
    const html = [
      `<span class="k">fps</span> <b>${p.fps.toFixed(0)}</b> · <span class="k">frame</span> <b>${p.frameMs.toFixed(1)}ms</b>`,
      `<span class="k">render</span> <b>${r.ms.toFixed(1)}ms</b> · <span class="k">eval</span> <b>${app.director.stats.evaluateMs.toFixed(1)}ms</b>`,
      `<span class="k">drawn</span> <b>${r.drawn}</b> · <span class="k">culled</span> <b>${r.culled}</b> · <span class="k">baked</span> <b>${r.baked}</b>`,
      `<span class="k">elements</span> <b>${st.elements}</b> · <span class="k">pts</span> <b>${st.pts.toLocaleString()}</b> · <span class="k">tracks</span> <b>${st.tracks}</b>`,
      `<span class="k">quality</span> <b>${(app.renderer.quality * 100) | 0}%</b> · <span class="k">tier</span> <b>${p.tier}</b>${p.memoryMB() ? ` · <span class="k">heap</span> <b>${p.memoryMB().toFixed(0)}MB</b>` : ''}`,
      `<span class="k">hand</span> <b>${app.director.stats.handTarget ? '✏ ' + Util.truncate(app.director.stats.handTarget, 14) : 'idle'}</b> · <span class="k">mode</span> <b>${s ? s.mode : '—'}</b>`
    ].join('<br>');
    if (html !== this._lastHud) { this.hudEl.innerHTML = html; this._lastHud = html; }
    const pill = this.$('#fpsPill');
    pill.innerHTML = `<b>${p.fps.toFixed(0)}</b> fps`;
    pill.className = p.fps < 30 ? 'bad' : p.fps < 50 ? 'warn' : '';
    const side = this.$('#sideStats');
    if (side && ++this._sideTick % 3 === 0) {
      side.innerHTML = '<h4>Telemetry</h4>' + [
        ['FPS', p.fps.toFixed(0)], ['Frame', p.frameMs.toFixed(1) + 'ms'],
        ['Render', r.ms.toFixed(1) + 'ms'], ['Elements', st.elements],
        ['Points', st.pts.toLocaleString()], ['Tracks', st.tracks],
        ['Baked', r.baked], ['Quality', Math.round(app.renderer.quality * 100) + '%']
      ].map(([a, b]) => `<div class="kv"><span>${a}</span><span>${b}</span></div>`).join('');
    }
  }
  _sideTick = 0;

  /* ---------------------------------------------------------- TIMELINE --- */
  drawTimeline(app) {
    const c = this.tl, x = this.tlx;
    const w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    const dpr = app.dpr;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    const s = app.director.scene;
    if (!s) return;
    const dur = Math.max(0.001, s.duration);
    const px = (t) => (t / dur) * w;
    // background
    x.fillStyle = 'rgba(255,255,255,.02)'; x.fillRect(0, 0, w, h);
    // seconds
    x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1;
    const stepSec = dur > 120 ? 30 : dur > 40 ? 10 : dur > 15 ? 5 : 1;
    x.beginPath();
    for (let t = 0; t <= dur; t += stepSec) { const X = Math.round(px(t)) + .5; x.moveTo(X, 0); x.lineTo(X, h); }
    x.stroke();
    x.fillStyle = 'rgba(255,255,255,.28)'; x.font = '9px ui-monospace,monospace'; x.textBaseline = 'top';
    for (let t = 0; t <= dur; t += stepSec) x.fillText(t + 's', px(t) + 3, 2);
    // element tracks grouped into 4 bands
    const bands = [[], [], [], []];
    s.elements.forEach((e, i) => { if (e.type !== 'board') bands[i % 4].push(e); });
    const bh = (h - 16) / 4;
    const colors = ['#00f5d4', '#3a86ff', '#ff2a6d', '#ffd166'];
    bands.forEach((list, bi) => {
      for (const e of list) {
        const t0 = e.inT, t1 = e.outT === Infinity ? dur : Math.min(e.outT, dur);
        const X = px(t0), W = Math.max(1.5, px(t1) - px(t0));
        x.fillStyle = colors[bi] + '55';
        x.fillRect(X, 14 + bi * bh, W, bh - 2);
      }
    });
    // captions
    x.fillStyle = 'rgba(255,255,255,.5)';
    for (const c2 of s.captions) x.fillRect(px(c2.t), h - 4, Math.max(1.5, px(c2.dur) - px(0)), 3);
    // playhead
    const X = px(app.director.time);
    x.strokeStyle = '#00f5d4'; x.lineWidth = 1.6;
    x.beginPath(); x.moveTo(X, 0); x.lineTo(X, h); x.stroke();
    x.fillStyle = '#00f5d4';
    x.beginPath(); x.moveTo(X - 5, 0); x.lineTo(X + 5, 0); x.lineTo(X, 7); x.closePath(); x.fill();
    // transport readout
    const cur = Util.formatTime(app.director.time), tot = Util.formatTime(dur);
    const tt = this.$('#tTime'); if (tt) tt.textContent = `${cur} / ${tot.split('.')[0]}`;
    const bar = this.$('#tProg i'); if (bar) bar.style.width = (app.director.progress() * 100).toFixed(2) + '%';
    const rec = this.$('#recTime');
    if (rec && this._recT0) { const s2 = (performance.now() - this._recT0) / 1000; rec.textContent = `REC ${String(Math.floor(s2 / 60)).padStart(2, '0')}:${String(Math.floor(s2 % 60)).padStart(2, '0')}`; }
  }
}

/* ==========================================================================
   MODULE 99 · APP  —  bootstrap, main loop, persistence, PWA
   ========================================================================== */
'use strict';

const DEFAULT_SETTINGS = {
  mode: 'explainer', style: 'minimal', format: '16:9', quality: 'high',
  autoQuality: true, fpsCap: 60, showHand: true, autoTool: true, humanize: 1.2,
  narration: false, recordAudio: true, burnCaptions: false, autoRepair: true,
  cinema: true, lang: 'en', lastBrush: 'pen', lastPrompt: ''
};

class App {
  constructor() {
    this.settings = Object.assign({}, DEFAULT_SETTINGS, Storage.get('settings', {}));
    this.audio = new AudioEngine();
    this.renderer = new Renderer(this);
    this.director = new Director(this);
    this.hand = new BotHand();
    this.perf = new PerfMonitor();
    this.userCam = { x: 0, y: 0, zoom: 1, rot: 0 };
    // On weak phones a 2.5× backing store murders the GPU — cap DPR by tier.
    this.tier = Util.deviceTier();
    const dprCap = this.tier === 'low' ? 1.5 : this.tier === 'medium' ? 2 : 2.5;
    this.dpr = Math.min(window.devicePixelRatio || 1, this.settings.maxDpr || dprCap);
    this.running = false;
    this.lastFrame = 0;
    this.frameBudget = 1000 / 60;
    this.busy = false;
    this.lastScript = null;
    this.cinema = false;
    this._cinemaPeekT = 0;
  }

  /* ------------------------------------------------------------- BOOT ---- */
  async boot() {
    const bar = document.getElementById('bootBar');
    const st = document.getElementById('bootStatus');
    const step = async (pct, label, fn) => {
      bar.style.width = pct + '%'; st.textContent = label;
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 16)));
      if (fn) await fn();
    };
    try {
      await step(8, 'installing crash guard…', () => installCrashGuard());
      await step(18, 'attaching render surfaces…', () => this.attachCanvases());
      await step(24, "probing this device's graphics…", () => {
        // real-device capability probe; downshift before the first frame is drawn
        const probe = this.renderer.selfTest();
        this.renderHealth = probe;
        if (!probe.pixels) { this.settings.autoQuality = true; this.renderer.setQuality(0.5); }
        if (this.tier !== 'high') this.renderer.setQuality(this.tier === 'low' ? 0.66 : 0.85);
        if (!this.settings.qualityTouched) this.settings.quality = this.tier === 'low' ? 'mobile' : this.tier === 'medium' ? 'medium' : 'high';
        Log.info('app', 'graphics probe', Object.assign({ tier: this.tier, dpr: roundTo(this.dpr, 2) }, probe));
        EventBus.global.on('quality', (q) => this.renderer.setQuality(q));
      });
      await step(30, 'warming brush engines…', () => { for (const d of BrushLib.defs) BrushLib.get(d.id); });
      await step(44, 'building template library…', () => { void TEMPLATES.length; });
      await step(56, 'starting UI…', () => {
        this.ui = new UI(this); this.ui.init();
        EventBus.global.on('director:play', () => this.toggleCinemaFromPlay(true));
        EventBus.global.on('director:pause', () => this.toggleCinemaFromPlay(false));
        EventBus.global.on('sheet:open', () => { if (this.cinema) this.setCinema(false); });
      });
      await step(70, 'loading last project…', () => this.restore());
      await step(84, 'planning first scene…', async () => {
        const prompt = this.settings.lastPrompt || 'Explain the water cycle';
        const inp = document.getElementById('prompt');
        if (inp) inp.value = prompt;
        // awaited: the boot bar must not reach 100% before the board is drawn
        const first = await this.runPrompt(prompt, { silent: true });
        if (!first) Log.warn('app', 'first scene build failed');
      });
      await step(96, 'starting render loop…', () => this.start());
      await step(100, 'ready');
      Log.info('app', `KALAM ${KALAM.version} booted`, {
        brushes: BrushLib.defs.length, generators: Object.keys(Generators).length,
        templates: TEMPLATES.length, geometry: GEOMETRY_TYPES.length, fx: FX.ids().length
      });
      setTimeout(() => {
        document.getElementById('boot').classList.add('gone');
        setTimeout(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, 500);
      }, 220);
      this.registerPWA();
      // God-level Studio: home dashboard + bot-agent wizard flow
      this.studio = new Studio(this);
      // one-time setup on a fresh device; never nag afterwards
      if (!Storage.get('setup.done')) setTimeout(() => this.ui.open('setup'), 500);
      else setTimeout(() => this.studio.showHome(), 400);
    } catch (e) {
      st.textContent = 'boot failed: ' + e.message;
      st.style.color = '#ff4d6d';
      Log.error('app', 'boot failed', e.stack || e.message);
      try { showCrashOverlay(e.message); } catch (x) { /* overlay is best-effort */ }
      this.bootError = e;
      // rethrow: a silently half-booted studio is worse than a visible failure
      throw e;
    }
  }

  attachCanvases() {
    this.view = document.getElementById('view');
    this.uiCanvas = document.getElementById('uiCanvas');
    this.uictx = this.uiCanvas.getContext('2d');
    this.renderer.attach(this.view);
    const resize = () => {
      const r = this.view.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      this.dpr = Math.min(window.devicePixelRatio || 1, Util.isMobile() ? 2 : 2.5);
      this.view.width = Math.round(w * this.dpr); this.view.height = Math.round(h * this.dpr);
      this.view.style.width = w + 'px'; this.view.style.height = h + 'px';
      this.uiCanvas.width = this.view.width; this.uiCanvas.height = this.view.height;
      this.uiCanvas.style.width = w + 'px'; this.uiCanvas.style.height = h + 'px';
      this.viewW = w; this.viewH = h;
      this.renderer.invalidate();
    };
    this._resize = resize;
    resize();
    window.addEventListener('resize', Util.debounce(resize, 120));
    window.addEventListener('orientationchange', () => setTimeout(resize, 260));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', Util.debounce(resize, 150));
  }

  restore() {
    const list = Exporter.listLocal();
    if (list.length) {
      const s = Exporter.loadLocal(this, list[0].key);
      if (s) { this.loadScene(s); return; }
    }
  }

  /* ------------------------------------------------------------ SCENE ---- */
  /** Build a scene from a prompt. Resolves with the Scene (or null on failure). */
  runPrompt(prompt, opts = {}) {
    if (!prompt || !prompt.trim()) return Promise.resolve(null);
    this.busy = true;
    const btn = document.getElementById('goBtn');
    if (btn) btn.classList.add('busy');
    this.settings.lastPrompt = prompt;
    this.saveSettings();
    // let the browser paint the "busy" state before the heavy build
    return new Promise((resolve) => {
      requestAnimationFrame(() => {
        setTimeout(() => {
        try {
          this.audio.init();
          this.audio.sfx('whoosh');
          let scene = Planner.build(prompt, {
            mode: this.settings.mode, style: this.settings.style,
            format: this.settings.format, fps: this.settings.fpsCap
          });
          if (this.settings.humanize > 0) this.humanizeScene(scene, this.settings.humanize);
          if (this.settings.autoRepair) {
            const rep = QC.repair(scene);
            scene = rep.scene;
            if (rep.repairs.length) Log.info('app', 'auto-repair: ' + rep.repairs.join(', '));
          }
          this.loadScene(scene);
          if (!opts.silent) {
            const s = scene.stats();
            this.ui.toast(`Built ${s.elements} elements · ${s.tracks} tracks · ${roundTo(scene.duration, 1)}s in ${scene.meta.buildMs}ms`, 'ok');
          }
          this.director.play();
          resolve(scene);
        } catch (e) {
          Log.error('app', 'runPrompt failed', e.stack || e.message);
          if (this.ui) this.ui.toast('Generation failed: ' + e.message, 'err');
          resolve(null);
        } finally {
          this.busy = false;
          if (btn) btn.classList.remove('busy');
        }
        }, 30);
      });
    });
  }

  /** Adds organic wobble to perfectly geometric strokes — the hand-made feel. */
  humanizeScene(scene, amount) {
    const r = new RNG(scene.seed ^ 0x9e37);
    for (const el of scene.elements) {
      if (el.type !== 'stroke' || !el.data.pts || el.data.pts.length < 4) continue;
      if (el.style.brush === 'technical' || el.style.brush === 'pixel') continue;
      el.data.pts = PathUtil.humanize(el.data.pts, amount * (0.6 + r.next() * 0.8), r.int(1, 99999));
      el.invalidate();
    }
  }

  loadScene(scene) {
    if (!scene) return;
    // Weak phones choke on per-pixel FX (grain/scanlines/ripple). Drop the heavy
    // ones on low/medium tier — the scene still reads, it just runs at 60fps.
    if (this.tier !== 'high' && scene.meta && Array.isArray(scene.meta.fx)) {
      const heavy = new Set(['grain', 'scanlines', 'ripple', 'wave', 'oilpaint', 'watercolor', 'kaleidoscope', 'convolve', 'thermal']);
      const before = scene.meta.fx.length;
      scene.meta.fx = scene.meta.fx.filter(f => !heavy.has(f.id || f));
      if (scene.meta.fx.length !== before) Log.info('app', `tier ${this.tier}: dropped ${before - scene.meta.fx.length} heavy FX for speed`);
    }
    this.director.load(scene);
    this.renderer.setWorldSize(scene.format.w, scene.format.h);
    this.renderer.invalidate();
    const nameEl = document.getElementById('projName');
    if (nameEl) nameEl.value = scene.name;
    EventBus.global.emit('scene:loaded', scene);
  }

  setFormat(key) {
    this.settings.format = key; this.saveSettings();
    const s = this.director.scene;
    if (s) {
      const f = FORMATS[key];
      // rescale every element so the composition survives the aspect change
      const sx = f.w / s.format.w, sy = f.h / s.format.h;
      s.format = { key, ...f, fps: s.format.fps };
      for (const el of s.elements) {
        if (el.type === 'board') { el.data.size = { w: f.w, h: f.h }; }
        if (el.positioned) { el.base.x *= sx; el.base.y *= sy; }
        else {
          if (el.data.pts) el.data.pts = el.data.pts.map(p => ({ ...p, x: p.x * sx, y: p.y * sy }));
          if (el.data.params) for (const k in el.data.params) {
            if (typeof el.data.params[k] !== 'number') continue;
            if (/^(x|w|rx|r|size)$/.test(k)) el.data.params[k] *= sx;
            else if (/^(y|h|ry)$/.test(k)) el.data.params[k] *= sy;
          }
          el._path = null;
        }
        if (el.data.area) { el.data.area.x *= sx; el.data.area.y *= sy; el.data.area.w *= sx; el.data.area.h *= sy; }
        if (el.data.at) { el.data.at.x *= sx; el.data.at.y *= sy; }
        el.invalidate();
      }
      for (const tr of s.tracks) for (const k of tr.keys) if (Array.isArray(k.v)) { k.v = [k.v[0] * sx, k.v[1] * sy]; }
      for (const k of s.cameraKeys) { k.x *= sx; k.y *= sy; }
      this.renderer.invalidate();
      this.director.rig = CameraRig.fromKeys(s.cameraKeys);
      this.director.seek(this.director.time);
    }
    this.ui.toast('Format → ' + key, 'ok');
  }

  applySettings() {
    this.perf.autoAdjust = this.settings.autoQuality;
    this.renderer.setQuality(this.settings.autoQuality ? this.renderer.quality : 1);
    this.frameBudget = 1000 / clamp(this.settings.fpsCap, 24, 120);
    this.hand.style = this.settings.handStyle || 'robot';
  }
  saveSettings() { Storage.set('settings', this.settings); }

  /* ------------------------------------------------------------- LOOP ---- */
  start() {
    if (this.running) return;
    this.running = true;
    const loop = (now) => {
      this.raf = requestAnimationFrame(loop);
      try {
        const dt = now - (this.lastFrame || now);
        this.lastFrame = now;
        if (dt < this.frameBudget - 1.2) return;   // honour the FPS cap
        this.perf.tick(now);
        this.director.tick(dt);
        // merge user camera with the keyframed camera
        const cam = this.director.camera || { x: 0, y: 0, zoom: 1, rot: 0 };
        const merged = {
          x: cam.x + this.userCam.x, y: cam.y + this.userCam.y,
          zoom: cam.zoom * this.userCam.zoom, rot: (cam.rot || 0) + (this.userCam.rot || 0)
        };
        this.renderer.render(this.director.scene, this.director.time, merged);
        this.drawOverlay(merged, now);
        this.ui.updateHUD(this);
        this.ui.drawTimeline(this);
      } catch (e) {
        Log.error('app', 'frame error (loop continues)', e.message);
        this.frameErrors = (this.frameErrors || 0) + 1;
        if (this.frameErrors === 5) showCrashOverlay('Repeated render error — ' + e.message);
      }
    };
    this.raf = requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.director.playing) { this.director.pause(); this._resumeOnVisible = true; }
      else if (!document.hidden && this._resumeOnVisible) { this.director.play(); this._resumeOnVisible = false; }
    });
  }

  drawOverlay(cam, now) {
    const c = this.uictx;
    const dpr = this.dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, this.viewW, this.viewH);
    const d = this.director;
    // captions burned into the frame when recording with that option on
    if (this.settings.burnCaptions && Exporter.busy && d.caption) {
      const pad = 18, size = Math.max(16, this.viewH * 0.036);
      c.font = `700 ${size}px ${FONT_STACKS.sans}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const lines = Util.wrapText(c, d.caption.text, this.viewW * 0.86);
      const lh = size * 1.25;
      const totalH = lines.length * lh;
      const y0 = this.viewH - 40 - totalH;
      c.fillStyle = 'rgba(4,8,14,.72)';
      roundRectPath(c, this.viewW * 0.05, y0 - pad * 0.6, this.viewW * 0.9, totalH + pad * 1.2, 12);
      c.fill();
      c.fillStyle = '#fff';
      lines.forEach((ln, i) => c.fillText(ln, this.viewW / 2, y0 + i * lh + lh / 2));
    }
    // the bot hand
    if (this.settings.showHand && d.hand.visible) {
      const scr = this.renderer.worldToScreen(cam, this.viewW, this.viewH, d.hand.x, d.hand.y);
      const scale = (this.viewW / this.renderer.w) * (cam.zoom || 1) * 1.35;
      this.hand.draw(c, { ...d.hand, x: scr.x, y: scr.y }, clamp(scale, 0.45, 2.2), now / 1000);
      const tag = document.getElementById('handTag');
      if (tag) {
        tag.classList.add('show');
        tag.textContent = `✏ ${d.stats.handTarget || ''} · ${(BrushLib.meta(d.hand.tool) || {}).name || ''} · ${(d.hand.pressure * 100) | 0}% pressure`;
      }
    } else {
      const tag = document.getElementById('handTag');
      if (tag) tag.classList.remove('show');
    }
    // audio meter
    if (this.audio.ready && !this.audio.muted) {
      const lv = this.audio.levels();
      if (lv.rms > 0.004) {
        const w = 74, h = 4, x = this.viewW - w - 12, y = 12;
        c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(x, y, w, h);
        c.fillStyle = '#00f5d4'; c.fillRect(x, y, w * clamp01(lv.rms * 3), h);
      }
    }
  }

  /* ---------------------------------------------------------- RECORD ---- */
  async recordVideo() {
    if (!this.director.scene) return this.ui.toast('Nothing to record yet', 'warn');
    if (Exporter.busy) return this.ui.toast('Already recording', 'warn');
    try {
      this.ui.toast('Recording… keep the tab in focus', 'ok');
      const res = await Exporter.recordVideo(this, { quality: this.settings.quality });
      this.ui.toast(`Video saved to your device · ${Util.formatBytes(res.blob.size)} · ${res.width}×${res.height} .${Exporter.extFor(res.mime)}`, 'ok');
      this.audio.sfx('success');
      // hand it to the OS share sheet (gallery / drive / whatsapp) when available
      await this.shareRecording(res);
    } catch (e) {
      Log.error('app', 'record failed', e.message);
      this.ui.toast('Recording failed: ' + e.message, 'err');
    }
  }

  /** Offer the finished recording to the OS share sheet; the download already
      put it in the phone's storage, sharing is the one-tap extra. */
  async shareRecording(res) {
    try {
      if (typeof File === 'undefined' || !navigator.canShare || !navigator.share) return;
      const name = `${(this.director.scene && this.director.scene.name) || 'kalam'}.${Exporter.extFor(res.mime)}`;
      const file = new File([res.blob], name, { type: res.mime || 'video/webm' });
      if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'KALAM video' });
    } catch (e) { /* user cancelled or unsupported — the download already succeeded */ }
  }

  /* ------------------------------------------------------- CINEMA MODE --- */
  /** Full-screen "bot has the wheel" mode: chrome disappears, drawing is the UI. */
  setCinema(on) {
    if (this.cinema === on) return;
    this.cinema = on;
    document.body.classList.toggle('cinema', on);
    document.body.classList.remove('cinemaPeek');
    const el = document.documentElement;
    try {
      if (on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
      else if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (e) { /* fullscreen is a bonus, not a requirement */ }
    EventBus.global.emit('cinema', on);
    if (on) this.ui.toast('Cinema mode — tap the screen for controls', 'ok');
  }
  /** Temporary reveal of the chrome while in cinema mode. */
  cinemaPeek() {
    if (!this.cinema) return;
    document.body.classList.add('cinemaPeek');
    clearTimeout(this._cinemaPeekT);
    this._cinemaPeekT = setTimeout(() => document.body.classList.remove('cinemaPeek'), 3500);
  }
  toggleCinemaFromPlay(playing) {
    if (!this.settings.cinema) return;
    if (playing) { clearTimeout(this._cinemaT); this._cinemaT = setTimeout(() => this.setCinema(true), 900); }
    else clearTimeout(this._cinemaT);
  }

  /* ------------------------------------------------------------- PWA ---- */
  registerPWA() {
    try {
      const manifest = {
        name: 'KALAM — Autonomous Drawing Intelligence',
        short_name: 'KALAM',
        description: 'Autonomous drawing and animation studio. Single file, works offline.',
        start_url: '.', display: 'standalone', orientation: 'any',
        background_color: '#05070c', theme_color: '#05070c',
        icons: [{
          src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#05070c"/><path d="M144 368 L320 144 M240 264 L352 368" stroke="#00f5d4" stroke-width="40" stroke-linecap="round" fill="none"/><circle cx="368" cy="128" r="32" fill="#ff2a6d"/></svg>`),
          sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
        }]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this._installEvt = e; });
    } catch (e) { Log.warn('app', 'manifest injection failed', e.message); }
  }
}

/* -------------------------------------------------------------- START ---- */
window.addEventListener('load', () => {
  const app = new App();
  window.KALAM_APP = app;
  KALAM.app = app;
  app.boot();
});

Object.assign(KALAM, { App, DEFAULT_SETTINGS });

</script>
