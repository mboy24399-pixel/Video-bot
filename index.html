  sb.camera(4, -W * 0.24, -H * 0.1, 1.25, 'inOutCubic');
  sb.camera(9, W * 0.18, -H * 0.18, 1.3);
  sb.camera(13, 0, H * 0.1, 1.15);
  sb.camera(17, 0, 0, 1);
  sb.at(20);
  return sb.finish(1.5);
};

/* ====================================================== PHOTOSYNTHESIS === */
Generators.photosynthesis = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('gradient', { color1: '#0b2417', color2: '#04120b' });
  sb.title('Photosynthesis', { y: H * 0.12 });
  sb.subtitle('How a leaf turns sunlight into food');
  sb.say('Plants are the only machines that can eat sunlight. Here is exactly how.');

  // leaf outline
  const leaf = [];
  for (let i = 0; i <= 90; i++) {
    const t = i / 90, ang = t * TAU;
    const r = H * 0.2 * Math.abs(Math.sin(ang)) ** 0.6;
    leaf.push({ x: W * 0.5 + Math.cos(ang) * r * 1.5, y: H * 0.55 + Math.sin(ang) * r, p: .5 });
  }
  sb.strokePts(leaf, { name: 'leaf', style: { size: 5, color: '#7fb069', brush: 'brush' } });
  // midrib + veins
  sb.strokePts(Geometry.line(W * 0.28, H * 0.55, W * 0.72, H * 0.55, 20), { style: { size: 4, color: '#5b8f4a', brush: 'ink' } });
  for (let i = -4; i <= 4; i++) {
    if (!i) continue;
    const x = W * 0.5 + i * W * 0.045;
    sb.strokePts(Geometry.line(x, H * 0.55, x + i * W * 0.03, H * 0.55 - Math.abs(i) * 0 + (i > 0 ? -1 : 1) * H * 0.09, 10), { style: { size: 2.4, color: Color.alpha('#7fb069', .8), brush: 'pen' } });
    sb.strokePts(Geometry.line(x, H * 0.55, x + i * W * 0.03, H * 0.55 + (i > 0 ? 1 : -1) * H * 0.09, 10), { style: { size: 2.4, color: Color.alpha('#7fb069', .8), brush: 'pen' } });
  }
  // chloroplasts
  for (let i = 0; i < 6; i++) {
    const el = sb.shape('ellipse', { x: W * (0.36 + i * 0.055), y: H * (0.48 + (i % 2) * 0.14), rx: W * 0.022, ry: H * 0.016, rot: i }, {
      name: 'chloroplast', fill: Color.alpha('#22c55e', 0.6), style: { size: 2.5, color: '#22c55e', brush: 'glow' }
    });
    sb.anim(el, 'pulse', 3 + i * 0.2, 2.4);
  }
  sb.text('Chloroplast', W * 0.79, H * 0.42, { ax: 0, style: { size: H * 0.026, weight: 700, color: '#86efac', align: 'left' } });

  // inputs
  const sunIcon = sb.icon('sun', W * 0.13, H * 0.3, { size: H * 0.1, color: '#ffd166' });
  sb.text('Sunlight', W * 0.13, H * 0.39, { style: { size: H * 0.026, weight: 700, color: '#ffd166' } });
  const co2 = sb.text('CO₂', W * 0.13, H * 0.6, { style: { size: H * 0.04, weight: 800, color: '#93c5fd', bg: 'rgba(59,130,246,.2)', bgPad: 14, bgRadius: 12 } });
  const h2o = sb.text('H₂O', W * 0.13, H * 0.74, { style: { size: H * 0.04, weight: 800, color: '#7dd3fc', bg: 'rgba(56,189,248,.18)', bgPad: 14, bgRadius: 12 } });
  sb.shape('curvedArrow', { x1: W * 0.19, y1: H * 0.32, x2: W * 0.34, y2: H * 0.47, bow: 0.2 }, { style: { size: 4, color: '#ffd166' } });
  sb.shape('curvedArrow', { x1: W * 0.19, y1: H * 0.61, x2: W * 0.34, y2: H * 0.55, bow: -0.15 }, { style: { size: 4, color: '#93c5fd' } });
  sb.shape('curvedArrow', { x1: W * 0.19, y1: H * 0.75, x2: W * 0.34, y2: H * 0.63, bow: -0.2 }, { style: { size: 4, color: '#7dd3fc' } });
  sb.caption('Sunlight, carbon dioxide and water go in.', 5);

  // outputs
  const gluc = sb.text('C₆H₁₂O₆', W * 0.87, H * 0.6, { style: { size: H * 0.038, weight: 800, color: '#fde68a', bg: 'rgba(245,158,11,.22)', bgPad: 14, bgRadius: 12 } });
  const o2 = sb.text('O₂', W * 0.87, H * 0.74, { style: { size: H * 0.04, weight: 800, color: '#a7f3d0', bg: 'rgba(16,185,129,.2)', bgPad: 14, bgRadius: 12 } });
  sb.shape('curvedArrow', { x1: W * 0.66, y1: H * 0.55, x2: W * 0.81, y2: H * 0.61, bow: 0.15 }, { style: { size: 4, color: '#fde68a' }, inT: 9 });
  sb.shape('curvedArrow', { x1: W * 0.66, y1: H * 0.6, x2: W * 0.81, y2: H * 0.75, bow: 0.2 }, { style: { size: 4, color: '#a7f3d0' }, inT: 9.4 });
  sb.caption('Glucose and oxygen come out. That glucose is the plant\'s food — and our oxygen.', 9.5);

  // equation
  sb.code('6CO₂ + 6H₂O  --(light)-->  C₆H₁₂O₆ + 6O₂', { x: W * 0.5, y: H * 0.9, style: { size: H * 0.03, bg: 'rgba(0,0,0,.5)', title: 'the equation', pad: 18 }, inT: 13, dur: 1.6 });

  sb.camera(0, 0, 0, 1);
  sb.camera(6, -W * 0.22, 0, 1.2);
  sb.camera(11, W * 0.2, 0, 1.2);
  sb.camera(14.5, 0, 0, 1);
  sb.at(18);
  return sb.finish(1.5);
};

/* ============================================================= ATOM ====== */
Generators.atom = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('radial', { color1: '#0d1030', color2: '#02020a' });
  sb.title('Structure of an Atom');
  sb.subtitle('A tiny nucleus, and electrons that never sit still');
  sb.say('Almost everything you can touch is mostly empty space held together by an atom.');

  const cx = W * 0.5, cy = H * 0.52, R = H * 0.26;
  // orbits
  for (let i = 0; i < 3; i++) {
    const el = sb.shape('ellipse', { x: cx, y: cy, rx: R, ry: R * 0.34, rot: (i / 3) * PI }, {
      name: 'orbit', style: { size: 2.2, color: Color.alpha(sb.ink(3), 0.5), brush: 'neon' }
    });
  }
  // nucleus
  const nuc = sb.shape('circle', { x: cx, y: cy, r: R * 0.17 }, { name: 'nucleus', fill: '#ffd166', style: { brush: 'glow', color: '#ffd166', size: 6 } });
  sb.anim(nuc, 'pulse', 2, 2.2);
  sb.text('Nucleus\n(protons + neutrons)', cx, cy + R * 0.42, { style: { size: H * 0.026, weight: 700, color: '#ffd166' }, inT: 3 });
  sb.caption('At the centre sits the nucleus — protons and neutrons packed incredibly tight.', 3.5);

  // electrons on procedural orbits
  for (let i = 0; i < 6; i++) {
    const e = sb.shape('circle', { x: cx, y: cy, r: R * 0.045 }, {
      name: 'electron', fill: '#00f5d4', style: { brush: 'neon', color: '#00f5d4', size: 4 }, hidden: true, reveal: 1
    });
    e.base.opacity = 1;
    sb.scene.addTrack(new Track({
      targetId: e.id, prop: 'xy', behavior: 'orbit',
      params: { cx, cy, r: R, ecc: 0.34, freq: 0.22 + i * 0.05, phase: (i / 6) * TAU + (Math.floor(i / 2) / 3) * PI },
      delay: 5, repeat: -1
    }));
    e.base.opacity = 0;
    sb.scene.addTrack(new Track({ targetId: e.id, prop: 'opacity', keys: [{ t: 4.8 + i * 0.18, v: 0 }, { t: 5.1 + i * 0.18, v: 1 }], ease: 'linear' }));
  }
  sb.text('Electrons', cx + R * 1.15, cy - R * 0.2, { ax: 0, style: { size: H * 0.026, weight: 700, color: '#00f5d4', align: 'left' }, inT: 6 });
  sb.caption('Electrons whirl around it in shells. Their arrangement decides how the element behaves.', 7);

  // shell labels
  ['K shell · 2e⁻', 'L shell · 8e⁻', 'M shell · 8e⁻'].forEach((t, i) => {
    sb.text(t, W * 0.1, H * (0.3 + i * 0.07), { ax: 0, style: { size: H * 0.024, weight: 600, align: 'left', color: Color.alpha(sb.ink(3), 0.9) }, inT: 10 + i * 0.5 });
  });

  // scale comparison
  sb.text('If the nucleus were a marble, the atom would be a football stadium.', W * 0.5, H * 0.9, { style: { size: H * 0.03, weight: 600, color: sb.accent() }, inT: 13 });
  sb.camera(0, 0, 0, 1);
  sb.camera(5, 0, 0, 1.9, 'inOutCubic');
  sb.camera(9, 0, 0, 1);
  sb.camera(13, 0, 0, 1.05);
  sb.at(17);
  return sb.finish(1.5);
};

/* ============================================================== CELL ===== */
Generators.cell = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('radial', { color1: '#0d1b2a', color2: '#04070d' });
  sb.title('The Animal Cell', { y: H * 0.1 });
  sb.say('A cell is a factory. Every organelle has one job.');
  const cx = W * 0.5, cy = H * 0.55, R = H * 0.34;
  const memb = sb.shape('circle', { x: cx, y: cy, r: R }, { name: 'membrane', fill: Color.alpha('#38bdf8', 0.08), style: { size: 5, color: '#38bdf8', brush: 'brush' } });
  const nuc = sb.shape('circle', { x: cx - R * 0.15, y: cy, r: R * 0.34 }, { name: 'nucleus', fill: Color.alpha('#a78bfa', 0.35), style: { size: 4, color: '#a78bfa', brush: 'glow' } });
  sb.text('Nucleus', cx - R * 0.15, cy, { style: { size: H * 0.026, weight: 800, color: '#ddd6fe' }, inT: 4 });
  const parts = [
    { n: 'Mitochondria', d: 'makes ATP energy', c: '#f97316', a: -0.9, r: 0.62, shape: 'ellipse' },
    { n: 'Ribosome', d: 'builds proteins', c: '#fde047', a: 0.5, r: 0.72, shape: 'circle' },
    { n: 'Golgi body', d: 'packs & ships', c: '#22d3ee', a: 2.1, r: 0.6, shape: 'roundRect' },
    { n: 'ER', d: 'transport network', c: '#4ade80', a: 3.4, r: 0.75, shape: 'ellipse' },
    { n: 'Lysosome', d: 'cleans waste', c: '#fb7185', a: -2.2, r: 0.7, shape: 'circle' },
    { n: 'Cytoplasm', d: 'the jelly inside', c: '#94a3b8', a: 1.4, r: 0.35, shape: 'circle' }
  ];
  parts.forEach((p, i) => {
    const px = cx + Math.cos(p.a) * R * p.r, py = cy + Math.sin(p.a) * R * p.r * 0.9;
    const t = 5 + i * 1.5;
    let el;
    if (p.shape === 'ellipse') el = sb.shape('ellipse', { x: px, y: py, rx: R * 0.13, ry: R * 0.08, rot: p.a }, { name: p.n, fill: Color.alpha(p.c, 0.45), style: { size: 3, color: p.c, brush: 'glow' }, inT: t });
    else if (p.shape === 'roundRect') el = sb.shape('roundRect', { x: px - R * 0.12, y: py - R * 0.07, w: R * 0.24, h: R * 0.14, r: 8 }, { name: p.n, fill: Color.alpha(p.c, 0.4), style: { size: 3, color: p.c, brush: 'pen' }, inT: t });
    else el = sb.shape('circle', { x: px, y: py, r: R * 0.07 }, { name: p.n, fill: Color.alpha(p.c, 0.5), style: { size: 3, color: p.c, brush: 'glow' }, inT: t });
    const lx = cx + Math.cos(p.a) * R * 1.28, ly = cy + Math.sin(p.a) * R * 1.05;
    sb.text(p.n, lx, ly, { style: { size: H * 0.026, weight: 800, color: p.c }, inT: t + 0.4 });
    sb.text(p.d, lx, ly + H * 0.035, { style: { size: H * 0.021, weight: 500, color: Color.alpha(p.c, 0.8) }, inT: t + 0.6 });
    sb.strokePts(Geometry.line(px + Math.cos(p.a) * R * 0.12, py + Math.sin(p.a) * R * 0.1, lx - Math.cos(p.a) * R * 0.14, ly - H * 0.02, 8), { style: { size: 1.8, color: Color.alpha(p.c, 0.55), brush: 'pen' }, inT: t + 0.2 });
    sb.caption(`${p.n} — ${p.d}.`, t + 0.5);
    sb.camera(t + 0.2, (px - cx) * 0.35, (py - cy) * 0.35, 1.18);
  });
  sb.camera(0, 0, 0, 1);
  sb.at(5 + parts.length * 1.5 + 2);
  sb.camera(sb.t - 1.5, 0, 0, 1);
  return sb.finish(1.5);
};

/* ======================================================= SOLAR SYSTEM === */
Generators.solarSystem = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('radial', { color1: '#0a0a1f', color2: '#000005' });
  // starfield
  const stars = [];
  const r = new RNG(sb.scene.seed);
  for (let i = 0; i < 220; i++) stars.push({ x: r.range(0, W), y: r.range(0, H), p: r.range(0.2, 1) });
  sb.strokePts(stars, { name: 'starfield', style: { size: 2, color: '#ffffff', brush: 'pixel' }, reveal: 1, hidden: true });
  sb.title('Our Solar System', { y: H * 0.1 });
  sb.say('Eight planets, one star, and a lot of empty space.');
  const cx = W * 0.5, cy = H * 0.56;
  const sun = sb.shape('circle', { x: cx, y: cy, r: H * 0.07 }, { name: 'Sun', fill: '#ffd166', style: { brush: 'glow', color: '#ff9f1c', size: 10 } });
  sb.anim(sun, 'pulse', 1, 4);
  sb.particles('fire', { at: { x: cx, y: cy }, dir: -PI / 2, spread: TAU, speed: 40, life: 1.2, size: 5, jitter: H * 0.06, gravity: 0, colors: ['#ffd166', '#ff9f1c', '#ff5714'] }, { style: { kind: 'fire', rate: 90, blend: 'lighter', max: 260 }, dur: 20 });
  const planets = [
    { n: 'Mercury', r: 0.16, s: 0.014, c: '#a8a29e', T: 0.5 },
    { n: 'Venus', r: 0.24, s: 0.02, c: '#fcd34d', T: 0.7 },
    { n: 'Earth', r: 0.33, s: 0.021, c: '#38bdf8', T: 0.9 },
    { n: 'Mars', r: 0.42, s: 0.017, c: '#f87171', T: 1.1 },
    { n: 'Jupiter', r: 0.56, s: 0.042, c: '#fdba74', T: 1.5 },
    { n: 'Saturn', r: 0.7, s: 0.036, c: '#fde68a', T: 1.9 },
    { n: 'Uranus', r: 0.82, s: 0.026, c: '#7dd3fc', T: 2.3 },
    { n: 'Neptune', r: 0.93, s: 0.025, c: '#60a5fa', T: 2.7 }
  ];
  planets.forEach((p, i) => {
    const R = H * p.r * 1.05;
    sb.shape('ellipse', { x: cx, y: cy, rx: R, ry: R * 0.36, rot: 0 }, { name: 'orbit', style: { size: 1.4, color: 'rgba(255,255,255,.16)', brush: 'pen' } });
    const el = sb.shape('circle', { x: cx, y: cy, r: H * p.s }, { name: p.n, fill: p.c, style: { brush: 'glow', color: p.c, size: 4 }, hidden: true, reveal: 1 });
    el.base.opacity = 0;
    sb.scene.addTrack(new Track({ targetId: el.id, prop: 'opacity', keys: [{ t: 2 + i * 0.35, v: 0 }, { t: 2.4 + i * 0.35, v: 1 }], ease: 'linear' }));
    sb.scene.addTrack(new Track({ targetId: el.id, prop: 'xy', behavior: 'orbit', params: { cx, cy, r: R, ecc: 0.36, freq: 1 / (p.T * 6), phase: i * 0.8 }, delay: 2, repeat: -1 }));
    if (p.n === 'Saturn') {
      const ring = sb.shape('ellipse', { x: cx, y: cy, rx: H * p.s * 2.1, ry: H * p.s * 0.7 }, { name: 'rings', style: { size: 2, color: Color.alpha(p.c, .7), brush: 'pen' }, hidden: true, reveal: 1 });
      ring.base.opacity = 0;
      sb.scene.addTrack(new Track({ targetId: ring.id, prop: 'opacity', keys: [{ t: 2 + i * 0.35, v: 0 }, { t: 2.4 + i * 0.35, v: 1 }], ease: 'linear' }));
      sb.scene.addTrack(new Track({ targetId: ring.id, prop: 'xy', behavior: 'orbit', params: { cx, cy, r: R, ecc: 0.36, freq: 1 / (p.T * 6), phase: i * 0.8 }, delay: 2, repeat: -1 }));
    }
    sb.caption(`${p.n} — ${roundTo(p.r * 100)} units out from the Sun.`, 2.6 + i * 0.9);
  });
  sb.camera(0, 0, 0, 1);
  sb.camera(6, 0, 0, 1.0);
  sb.at(18);
  sb.text('One star holds 99.8% of all the mass here.', W * 0.5, H * 0.94, { style: { size: H * 0.03, weight: 700, color: '#ffd166' }, inT: 16 });
  return sb.finish(2);
};

/* ============================================================ CIRCUIT === */
Generators.circuit = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('blueprint');
  sb.title('How a Simple Circuit Works', { y: H * 0.12 });
  sb.say('Current only flows when the loop is complete.');
  const y = H * 0.55, x1 = W * 0.18, x2 = W * 0.82;
  // wires
  const wireTop = sb.strokePts(Geometry.line(x1, y - H * 0.2, x2, y - H * 0.2, 30), { style: { size: 4, color: '#93c5fd', brush: 'technical' } });
  const wireL = sb.strokePts(Geometry.line(x1, y - H * 0.2, x1, y, 14), { style: { size: 4, color: '#93c5fd', brush: 'technical' } });
  const wireR = sb.strokePts(Geometry.line(x2, y - H * 0.2, x2, y, 14), { style: { size: 4, color: '#93c5fd', brush: 'technical' } });
  const wireB = sb.strokePts(Geometry.line(x1, y, x2, y, 30), { style: { size: 4, color: '#93c5fd', brush: 'technical' } });
  // battery symbol
  const bx = W * 0.5;
  sb.strokePts(Geometry.line(bx - 22, y - H * 0.05, bx - 22, y + H * 0.05, 4), { style: { size: 5, color: '#fde047', brush: 'technical' } });
  sb.strokePts(Geometry.line(bx - 8, y - H * 0.028, bx - 8, y + H * 0.028, 4), { style: { size: 5, color: '#fde047', brush: 'technical' } });
  sb.strokePts(Geometry.line(bx + 6, y - H * 0.05, bx + 6, y + H * 0.05, 4), { style: { size: 5, color: '#fde047', brush: 'technical' } });
  sb.strokePts(Geometry.line(bx + 20, y - H * 0.028, bx + 20, y + H * 0.028, 4), { style: { size: 5, color: '#fde047', brush: 'technical' } });
  sb.text('Battery  9V', bx, y + H * 0.1, { style: { size: H * 0.026, weight: 700, color: '#fde047' } });
  // resistor zigzag
  const zx = W * 0.5, zy = y - H * 0.2, zig = [];
  zig.push({ x: zx - 70, y: zy, p: .5 });
  for (let i = 0; i < 8; i++) zig.push({ x: zx - 70 + (i + 0.5) * 18, y: zy + (i % 2 ? 18 : -18), p: .5 });
  zig.push({ x: zx + 74, y: zy, p: .5 });
  sb.strokePts(zig, { style: { size: 4, color: '#fb923c', brush: 'technical' } });
  sb.text('Resistor  220Ω', zx, zy - H * 0.06, { style: { size: H * 0.026, weight: 700, color: '#fb923c' } });
  // LED
  const lx = x2 - W * 0.02, ly = y - H * 0.1;
  const led = sb.shape('triangle', { x: lx - 22, y: ly - 20, w: 44, h: 40 }, { name: 'LED', fill: Color.alpha('#22c55e', .5), style: { size: 3.5, color: '#22c55e', brush: 'glow' } });
  sb.text('LED', lx + 50, ly, { style: { size: H * 0.026, weight: 700, color: '#22c55e' } });
  sb.caption('Battery pushes electrons. The resistor slows them. The LED turns that into light.', 6);
  // current flow particles along the loop
  const loop = [
    { x: x1, y: y, p: .5 }, { x: x2, y, p: .5 }, { x: x2, y: y - H * 0.2, p: .5 },
    { x: x1, y: y - H * 0.2, p: .5 }, { x: x1, y, p: .5 }
  ];
  for (let i = 0; i < 14; i++) {
    const dot = sb.shape('circle', { x: 0, y: 0, r: 6 }, { name: 'electron', fill: '#00f5d4', style: { brush: 'neon', color: '#00f5d4', size: 3 }, hidden: true, reveal: 1 });
    dot.base.opacity = 0;
    sb.scene.addTrack(new Track({ targetId: dot.id, prop: 'opacity', keys: [{ t: 9, v: 0 }, { t: 9.3, v: 1 }], ease: 'linear' }));
    sb.scene.addTrack(new Track({ targetId: dot.id, prop: 'xy', behavior: 'followPath', params: { points: loop, speed: (W * 1.4) / 4 }, delay: 9 - i * 0.28, repeat: -1 }));
  }
  sb.text('Current flows →', W * 0.5, y - H * 0.28, { style: { size: H * 0.024, weight: 600, color: '#00f5d4' }, inT: 9.5 });
  sb.caption('Break the loop anywhere and everything stops instantly.', 12);
  sb.camera(0, 0, 0, 1);
  sb.camera(6, W * 0.15, -H * 0.05, 1.2);
  sb.camera(9, 0, 0, 1);
  sb.at(16);
  return sb.finish(1.5);
};

Generators.math = (sb, a) => {

  sb.text('y', ox - 26, oy - gh - 16, { style: { size: H * 0.032, weight: 800, color: '#1b1f27', family: 'serif' } });
  // grid
  for (let i = 1; i <= 8; i++) {
    sb.strokePts(Geometry.line(ox + (gw / 8) * i, oy, ox + (gw / 8) * i, oy - gh, 4), { style: { size: 1, color: 'rgba(30,50,110,.14)', brush: 'pen' }, reveal: 1, hidden: true });

  }

  const plot = (fn, col, t0, label) => {
    const pts = [];

  };
  plot(x => Math.sin(x * TAU * 1.2) * 0.55 + 0.5, '#dc2626', 3, 'sin(x)');

  plot(x => Math.sqrt(x), '#059669', 9, '√x');

  const tx = W * 0.24, ty = H * 0.3, tw = W * 0.14, th = H * 0.16;
  const tri = sb.shape('triangle', { x: tx, y: ty, w: tw, h: th }, { name: 'triangle', fill: 'rgba(220,38,38,.15)', style: { size: 4, color: '#dc2626', brush: 'ink' }, inT: 12 });
  sb.text('a', tx + tw / 2, ty + th + 22, { style: { size: H * 0.028, weight: 800, color: '#dc2626' } });
  sb.text('b', tx - 22, ty + th / 2, { style: { size: H * 0.028, weight: 800, color: '#dc2626' } });
  sb.text('c', tx + tw / 2 + 16, ty + th / 2 - 12, { style: { size: H * 0.028, weight: 800, color: '#dc2626' } });
  sb.code('a² + b² = c²', { x: W * 0.32, y: H * 0.24, style: { size: H * 0.036, bg: 'rgba(27,31,39,.9)', title: 'Pythagoras' }, inT: 13.5, dur: 1.2 });
  sb.caption('And some rules, like a squared plus b squared equals c squared, never change.', 13);
  sb.camera(0, 0, 0, 1);
  sb.camera(12, -W * 0.24, -H * 0.16, 1.3);

  sb.text('The visible spectrum is a tiny slice of all electromagnetic waves.', W * 0.5, H * 0.66, { style: { size: H * 0.028, weight: 600 }, inT: 11 });

  });

  sb.text('red', W * 0.79, H * 0.8, { style: { size: H * 0.022, weight: 600, color: '#fca5a5' }, inT: 13.7 });
  sb.text('c = λ × f     (speed of light = 299,792,458 m/s)', W * 0.5, H * 0.89, { style: { size: H * 0.03, weight: 700, color: sb.accent() }, inT: 14.5 });
  sb.camera(0, 0, 0, 1);
  sb.camera(5, 0, -H * 0.05, 1.15);
  sb.camera(11.5, 0, H * 0.12, 1.1);

  ];

  sb.caption('Start at the top. At every diamond the flow splits.', 5);
  // travelling token through the flow
  const route = nodes.filter(n => ['start', 'input', 'check', 'proc', 'out', 'end'].includes(n.id)).map(n => ({ x: n.x, y: n.y, p: .5 }));
  const tok = sb.shape('circle', { x: 0, y: 0, r: 11 }, { name: 'token', fill: '#00f5d4', style: { brush: 'neon', color: '#00f5d4', size: 6 }, hidden: true, reveal: 1 });

  sb.text('Watch the flow', W * 0.5, H * 0.9, { style: { size: H * 0.026, weight: 600, color: '#00f5d4' }, inT: 9.4 });

    sb.text(label, W * 0.115, y, { ax: 0, style: { size: H * 0.022, weight: 600, color: '#cfe0ff' } });

  sb.text('A diamond always has two exits', dia.x + W * 0.2, dia.y - H * 0.115, { ax: 0, style: { size: H * 0.023, weight: 600, color: '#ffd166' } });

  sb.at(18);

/* =========================================================== MINDMAP ==== */
Generators.mindmap = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('minimal');
  const topic = subjectOf(a, 'Main Idea');
  sb.title('Mind Map', { y: H * 0.08 });
  sb.say(`Let us break ${topic} into its parts.`);
  const cx = W * 0.5, cy = H * 0.54;
  const branches = [
    { n: 'Definition', kids: ['What it is', 'Why it matters'] },
    { n: 'Parts', kids: ['Component A', 'Component B'] },
    { n: 'Examples', kids: ['Real world', 'Edge case'] },
    { n: 'Common mistakes', kids: ['Assumption', 'Skipping steps'] },
    { n: 'Next steps', kids: ['Practice', 'Revise'] }
  ];
  const nodes = [{ id: 'root', label: topic, x: cx, y: cy, shape: 'circle', w: W * 0.16, h: H * 0.16 }];
  const edges = [];
  branches.forEach((b, i) => {
    const ang = -PI / 2 + (i / branches.length) * TAU;
    const bx = cx + Math.cos(ang) * W * 0.26, by = cy + Math.sin(ang) * H * 0.3;
    const bid = 'b' + i;
    nodes.push({ id: bid, label: b.n, x: bx, y: by, shape: 'roundRect', w: W * 0.13, h: H * 0.07 });
    edges.push({ from: 'root', to: bid });
    b.kids.forEach((k, j) => {
      const ka = ang + (j - (b.kids.length - 1) / 2) * 0.45;
      const kx = bx + Math.cos(ka) * W * 0.13, ky = by + Math.sin(ka) * H * 0.15;
      const kid = bid + 'k' + j;
      nodes.push({ id: kid, label: k, x: kx, y: ky, shape: 'pill', w: W * 0.11, h: H * 0.055, labelSize: H * 0.019 });
      edges.push({ from: bid, to: kid });
    });
  });
  sb.at(1);
  sb.diagram(nodes, edges, { name: 'mindmap', dur: 8, style: { nodeW: W * 0.12, nodeH: H * 0.065, labelSize: H * 0.021, shape: 'roundRect' } });
  sb.caption('Start from the centre and expand outward.', 4);

  /* breathing halo behind the root node */
  const halo = sb.shape('circle', { x: cx, y: cy, r: W * 0.1 }, { name: 'root halo', style: { color: sb.accent(), brush: 'glow', size: Math.max(2, H * 0.0035), glow: 22, glowColor: sb.accent() }, reveal: 1 });
  halo.base.opacity = 0.35;
  sb.anim(halo, 'pulse', 1, 3.2, 'inOutSine');

  /* branch ribs drawn as real strokes so the hand traces them outward */
  sb.at(9);
  branches.forEach((b, i) => {
    const ang = -PI / 2 + (i / branches.length) * TAU;
    const bx = cx + Math.cos(ang) * W * 0.26, by = cy + Math.sin(ang) * H * 0.3;
    const ctrl = [{ x: cx, y: cy }, { x: (cx + bx) / 2, y: (cy + by) / 2 + H * 0.04 * (i % 2 ? 1 : -1) }, { x: bx, y: by }];
    sb.strokePts(Geometry.catmullRom(ctrl, 26), {
      name: 'rib ' + b.n, style: { color: sb.ink(2 + (i % 3)), brush: sb.a.style === 'sketch' ? 'pencil' : 'marker', size: Math.max(2, H * 0.003) }
    });
    sb.text(String(i + 1), bx + Math.cos(ang) * W * 0.075, by + Math.sin(ang) * H * 0.085, { style: { size: H * 0.02, weight: 800, color: sb.accent() } });
  });

  /* legend + reading order */
  sb.at(13);
  sb.text('READ OUTWARD', W * 0.075, H * 0.88, { ax: 0, style: { size: H * 0.02, weight: 800, color: sb.accent(), tracking: 2 } });
  sb.shape('arrow', { x1: W * 0.075, y1: H * 0.91, x2: W * 0.17, y2: H * 0.91, bow: 0 }, { name: 'read arrow', style: { color: sb.accent(), brush: 'neon', size: Math.max(2, H * 0.0035) } });
  sb.text(`${nodes.length} nodes · ${edges.length} links`, W * 0.925, H * 0.88, { ax: 1, style: { size: H * 0.021, weight: 600, color: '#9fb4d8' } });

  sb.camera(0, 0, 0, 1.15);
  sb.camera(5, 0, 0, 1);
  sb.at(17);
  return sb.finish(1.5);
};

/* ============================================================= CHART ==== */
Generators.chart = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('minimal');
  const topic = subjectOf(a, 'Data Overview');
  sb.title(topic, { y: H * 0.11 });
  sb.say('Numbers are easier to argue with when you can see them.');

  const labels = a.entities.items.length > 2 ? a.entities.items.slice(0, 6) : ['2021', '2022', '2023', '2024', '2025', '2026'];
  let values = nums.length >= 3 ? nums.slice(0, 6) : null;
  if (!values) {
    const r = new RNG(sb.scene.seed);
    let base = r.range(40, 90);
    values = labels.map(() => { base = Math.max(8, base * r.range(0.92, 1.22)); return Math.round(base); });
  }
  while (values.length < labels.length) values.push(values[values.length - 1] || 10);
  labels.length = Math.min(labels.length, values.length);
  const bar = sb.chart('bar', { labels, values, title: 'Growth over time', w: W * 0.44, h: H * 0.5 }, { x: W * 0.27, y: H * 0.52, dur: 3 });
  const line = sb.chart('line', { labels, values, title: 'Trend line', w: W * 0.4, h: H * 0.5 }, { x: W * 0.75, y: H * 0.52, inT: sb.t + 1.2, dur: 3 });

  sb.text(`Total: ${total}`, W * 0.27, H * 0.86, { style: { size: H * 0.034, weight: 800, color: sb.accent() }, inT: 8 });
  sb.text(`Peak: ${Math.max(...values)}`, W * 0.27, H * 0.92, { style: { size: H * 0.028, weight: 600, color: 'rgba(255,255,255,.8)' }, inT: 8.4 });

  sb.caption('Bars compare size. The line shows direction. The donut shows share.', 8);
  sb.camera(0, 0, 0, 1);
  sb.camera(7, -W * 0.14, 0, 1.12);
  sb.camera(10, W * 0.14, H * 0.1, 1.15);
  sb.camera(13, 0, 0, 1);
  sb.at(16);
  return sb.finish(1.5);
};

/* =========================================================== NETWORK ==== */
Generators.network = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('radial', { color1: '#071018', color2: '#01040a' });
  sb.title('How the Internet Actually Works', { y: H * 0.11 });
  sb.say('Your message is chopped into packets, each one finds its own way.');
  const cx = W * 0.5, cy = H * 0.55;
  const nodes = [{ id: 'you', label: 'You', x: W * 0.14, y: cy, shape: 'pill' }];
  const edges = [];
  const r = new RNG(sb.scene.seed);
  for (let ring = 0; ring < 2; ring++) {
    const count = ring === 0 ? 5 : 7;
    const rad = ring === 0 ? W * 0.19 : W * 0.31;
    for (let i = 0; i < count; i++) {
      const ang = (i / count) * TAU + ring * 0.3;
      const id = `n${ring}${i}`;
      nodes.push({ id, label: ring === 0 ? 'Router' : 'Node', x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad * 0.72, shape: 'circle', w: W * 0.06, h: W * 0.06, labelSize: H * 0.016 });
      if (ring === 0) edges.push({ from: i === 0 ? 'you' : `n0${i - 1}`, to: id });
      else edges.push({ from: `n0${i % 5}`, to: id, curve: 0.08 });
    }
  }
  nodes.push({ id: 'server', label: 'Server', x: W * 0.88, y: cy, shape: 'pill' });
  edges.push({ from: 'n04', to: 'server' });
  sb.diagram(nodes, edges, { name: 'network', dur: 7, style: { nodeW: W * 0.09, nodeH: H * 0.06, labelSize: H * 0.019, nodeStroke: '#22d3ee' } });
  // packets
  for (let i = 0; i < 10; i++) {
    const path = [{ x: W * 0.14, y: cy, p: .5 }, { x: cx + r.range(-W * 0.2, W * 0.2), y: cy + r.range(-H * 0.2, H * 0.2), p: .5 }, { x: cx + r.range(-W * 0.3, W * 0.3), y: cy + r.range(-H * 0.24, H * 0.24), p: .5 }, { x: W * 0.88, y: cy, p: .5 }];
    const p = sb.shape('roundRect', { x: -14, y: -8, w: 28, h: 16, r: 4 }, { name: 'packet', fill: '#fbbf24', style: { brush: 'glow', color: '#fbbf24', size: 3 }, hidden: true, reveal: 1 });
    p.base.opacity = 0;
    sb.scene.addTrack(new Track({ targetId: p.id, prop: 'opacity', keys: [{ t: 9, v: 0 }, { t: 9.2, v: 1 }], ease: 'linear' }));
    sb.scene.addTrack(new Track({ targetId: p.id, prop: 'xy', behavior: 'followPath', params: { points: path, speed: W * 0.3 }, delay: 9 - i * 0.55, repeat: -1 }));
  }
  sb.text('Each packet is routed independently — then reassembled.', W * 0.5, H * 0.9, { style: { size: H * 0.028, weight: 600, color: '#fbbf24' }, inT: 10 });
  sb.caption('That is why the internet keeps working even when parts of it break.', 11);
  sb.camera(0, 0, 0, 1);
  sb.at(16);
  return sb.finish(1.5);
};

/* ================================================================ ML ==== */
Generators.ml = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('radial', { color1: '#0a0620', color2: '#02010a' });
  sb.title('How a Neural Network Learns', { y: H * 0.11 });
  sb.say('A neural network is just a lot of small weighted guesses added together.');
  const layers = [4, 6, 6, 3];
  const cx0 = W * 0.22, gap = (W * 0.56) / (layers.length - 1);
  const nodes = [], edges = [];
  layers.forEach((n, li) => {
    for (let i = 0; i < n; i++) {
      const id = `l${li}n${i}`;
      const y = H * 0.55 + (i - (n - 1) / 2) * H * 0.1;
      nodes.push({ id, label: '', x: cx0 + li * gap, y, shape: 'circle', w: W * 0.028, h: W * 0.028 });
      if (li > 0) for (let j = 0; j < layers[li - 1]; j++) edges.push({ from: `l${li - 1}n${j}`, to: id, curve: 0 });
    }
  });
  const d = sb.diagram(nodes, edges, {
    name: 'neural net', dur: 5,
    style: { nodeW: W * 0.03, nodeH: W * 0.03, nodeStroke: '#a78bfa', edge: 'rgba(167,139,250,.25)', labelSize: 10, flow: true }
  });
  ['Input', 'Hidden', 'Hidden', 'Output'].forEach((t, i) => {
    sb.text(t, cx0 + i * gap, H * 0.86, { style: { size: H * 0.024, weight: 700, color: '#c4b5fd' }, inT: 5 + i * 0.4 });
  });
  sb.caption('Signals flow left to right. Every connection has a weight.', 6);
  // training pulse
  for (let i = 0; i < 12; i++) {
    const path = layers.map((n, li) => ({ x: cx0 + li * gap, y: H * 0.55 + ((i % n) - (n - 1) / 2) * H * 0.1, p: .5 }));
    const pulse = sb.shape('circle', { x: 0, y: 0, r: 7 }, { name: 'signal', fill: '#00f5d4', style: { brush: 'neon', color: '#00f5d4', size: 4 }, hidden: true, reveal: 1 });
    pulse.base.opacity = 0;
    sb.scene.addTrack(new Track({ targetId: pulse.id, prop: 'opacity', keys: [{ t: 9, v: 0 }, { t: 9.2, v: 1 }], ease: 'linear' }));
    sb.scene.addTrack(new Track({ targetId: pulse.id, prop: 'xy', behavior: 'followPath', params: { points: path, speed: W * 0.4 }, delay: 9 - i * 0.4, repeat: -1 }));
  }
  // loss curve
  const loss = [];
  for (let i = 0; i <= 100; i++) { const x = i / 100; loss.push({ x: W * 0.68 + x * W * 0.26, y: H * 0.3 + (1 - Math.exp(-x * 5)) * H * 0.16 + Math.sin(x * 40) * 4 * (1 - x), p: .5 }); }
  sb.strokePts(loss, { name: 'loss', style: { size: 4, color: '#f472b6', brush: 'neon' }, inT: 11 });
  sb.text('Loss ↓ as it learns', W * 0.81, H * 0.24, { style: { size: H * 0.024, weight: 700, color: '#f472b6' }, inT: 12.5 });
  sb.caption('Training just means nudging the weights until the error stops falling.', 12);
  sb.camera(0, 0, 0, 1);
  sb.camera(11, W * 0.2, -H * 0.12, 1.2);
  sb.camera(14, 0, 0, 1);
  sb.at(18);
  return sb.finish(1.5);
};

  for (let y = 0; y <= years; y++) {
    lump.push(Math.round(bal)); invested.push(Math.round(monthly * 12 * y));
    for (let m = 0; m < 12; m++) bal = (bal + monthly) * (1 + rate / 12);
  }
  const labels = []; for (let y = 0; y <= years; y += 4) labels.push('Y' + y);
  const picks = []; for (let y = 0; y <= years; y += 4) picks.push(y);
  sb.chart('area', { labels, values: picks.map(i => lump[i]), title: 'With compounding (₹)', w: W * 0.5, h: H * 0.5 }, { x: W * 0.3, y: H * 0.5, dur: 4 });
  sb.chart('line', { labels, values: picks.map(i => invested[i]), title: 'Money you put in', w: W * 0.5, h: H * 0.5 }, { x: W * 0.3, y: H * 0.5, inT: sb.t + 0.6, dur: 4, style: { colors: ['#94a3b8'] } });

  const freqs = [1, 1.5, 1.25, 1.333, 1.125, 1.6, 1.2, 2];
  freqs.forEach((f, i) => {
    const t = 2 + i * 0.85;
    const x = W * 0.16 + i * (W * 0.7 / freqs.length);
    const yv = y0 - (f - 1) * H * 0.28;
    const n = sb.shape('ellipse', { x, y: yv, rx: H * 0.026, ry: H * 0.02, rot: -0.3 }, { name: 'note', fill: sb.ink(3), style: { size: 2.5, color: sb.ink(3), brush: 'glow' }, inT: t });
    sb.strokePts(Geometry.line(x + H * 0.024, yv, x + H * 0.024, yv - H * 0.1, 6), { style: { size: 3, color: sb.ink(3), brush: 'pen' }, inT: t + 0.1 });
    sb.scene.addTrack(new Track({ targetId: n.id, prop: 'scale', keys: [{ t: t + 0.5, v: 1 }, { t: t + 0.8, v: 1.25 }, { t: t + 1.3, v: 1 }], ease: 'outElastic' }));
    sb.scene.audioCues.push({ t, type: 'note', freq: 261.63 * f, dur: 0.5 });
  });
  // waveform
  const wave = [];
  for (let i = 0; i <= 300; i++) { const x = i / 300; wave.push({ x: W * 0.12 + x * W * 0.76, y: H * 0.72 + Math.sin(x * TAU * 8) * H * 0.07 * Math.exp(-((x - 0.5) ** 2) * 6), p: .5 }); }
  sb.strokePts(wave, { name: 'waveform', style: { size: 4, color: '#f472b6', brush: 'neon' }, inT: 9 });
  sb.text('Frequency → pitch', W * 0.3, H * 0.63, { ax: 0, style: { size: H * 0.024, weight: 700, align: 'left', color: '#f9a8d4' }, inT: 9.5 });
  sb.text('Amplitude → loudness', W * 0.3, H * 0.84, { ax: 0, style: { size: H * 0.024, weight: 700, align: 'left', color: '#c4b5fd' }, inT: 10 });
  sb.text('Timbre → why a piano is not a flute', W * 0.3, H * 0.9, { ax: 0, style: { size: H * 0.024, weight: 700, align: 'left', color: '#93c5fd' }, inT: 10.5 });
  sb.camera(0, 0, 0, 1);
  sb.at(16);
  return sb.finish(1.5);
};

Generators.economics = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('minimal');
  sb.title('Supply & Demand', { y: H * 0.11 });
  sb.say('Price is not set by anyone. It is discovered where two curves cross.');
  const ox = W * 0.16, oy = H * 0.8, gw = W * 0.44, gh = H * 0.56;
  sb.strokePts(Geometry.line(ox, oy, ox + gw, oy, 20), { style: { size: 3.5, color: '#1b1f27', brush: 'ink' } });
  sb.strokePts(Geometry.line(ox, oy, ox, oy - gh, 20), { style: { size: 3.5, color: '#1b1f27', brush: 'ink' } });
  sb.text('Quantity →', ox + gw * 0.6, oy + 34, { style: { size: H * 0.026, weight: 700, color: '#1b1f27' } });
  sb.text('Price ↑', ox - 60, oy - gh * 0.7, { style: { size: H * 0.026, weight: 700, color: '#1b1f27' } });
  const supply = [], demand = [];
  for (let i = 0; i <= 60; i++) {
    const x = i / 60;
    supply.push({ x: ox + x * gw, y: oy - x * gh * 0.85, p: .5 });
    demand.push({ x: ox + x * gw, y: oy - (1 - x) * gh * 0.9, p: .5 });
  }
  sb.strokePts(supply, { name: 'supply', style: { size: 5, color: '#dc2626', brush: 'ink' } });
  sb.strokePts(demand, { name: 'demand', style: { size: 5, color: '#1d4ed8', brush: 'ink' }, inT: 4 });
  sb.text('Supply', ox + gw * 0.9, oy - gh * 0.8, { style: { size: H * 0.028, weight: 800, color: '#dc2626' }, inT: 3 });
  sb.text('Demand', ox + gw * 0.05, oy - gh * 0.86, { style: { size: H * 0.028, weight: 800, color: '#1d4ed8' }, inT: 5 });
  const eq = { x: ox + gw * 0.49, y: oy - gh * 0.44 };
  const dot = sb.shape('circle', { x: eq.x, y: eq.y, r: 12 }, { name: 'equilibrium', fill: '#059669', style: { brush: 'glow', color: '#059669', size: 8 }, inT: 7 });
  sb.scene.addTrack(new Track({ targetId: dot.id, prop: 'scale', keys: [{ t: 7, v: 1 }, { t: 7.4, v: 1.5 }, { t: 8, v: 1 }], ease: 'outElastic' }));
  sb.strokePts(Geometry.line(ox, eq.y, eq.x, eq.y, 10), { style: { size: 2, color: Color.alpha('#059669', .7), brush: 'pen' }, inT: 7.4 });
  sb.strokePts(Geometry.line(eq.x, oy, eq.x, eq.y, 10), { style: { size: 2, color: Color.alpha('#059669', .7), brush: 'pen' }, inT: 7.6 });
  sb.text('Equilibrium price', ox - 10, eq.y, { style: { size: H * 0.024, weight: 700, color: '#059669' }, inT: 8 });
  sb.caption('Where they cross, the market clears — no shortage, no surplus.', 8.5);
  const notes = [
    ['Demand rises', 'Price ↑, quantity ↑'],
    ['Supply rises', 'Price ↓, quantity ↑'],
    ['Both rise', 'Quantity ↑↑, price ?']
  ];
  notes.forEach((n, i) => {
    const t = 10 + i * 1.7;
    sb.text(n[0], W * 0.7, H * (0.34 + i * 0.12), { ax: 0, style: { size: H * 0.028, weight: 800, align: 'left', color: '#1b1f27' }, inT: t });
    sb.text('→  ' + n[1], W * 0.7, H * (0.34 + i * 0.12) + H * 0.045, { ax: 0, style: { size: H * 0.024, weight: 500, align: 'left', color: '#4b5563' }, inT: t + 0.3 });
  });
  sb.camera(0, 0, 0, 1);
  sb.camera(7, -W * 0.08, 0, 1.15);
  sb.camera(10.5, 0, 0, 1);
  sb.at(17);
  return sb.finish(1.5);

/* ==================================================== GENERIC EXPLAINER = */
Generators.generic = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background();
  const topic = subjectOf(a, 'Explained');
  const intentLabel = (a.intent || 'explain').replace(/([A-Z])/g, ' $1').toLowerCase();
  sb.title(topic, { y: H * 0.16 });
  sb.subtitle(`A visual ${intentLabel}`);
  sb.say(`Let us break ${topic.toLowerCase()} into pieces you can actually see.`);

  // hero diagram built from the topic's own words
  const words = a.tokens.filter(w => w.length > 2).slice(0, 6);
  const items = words.length >= 3 ? words.map(w => w[0].toUpperCase() + w.slice(1))
    : ['What it is', 'Why it matters', 'How it works', 'Where it is used', 'Common mistakes'];
  const cx = W * 0.5, cy = H * 0.55;
  const nodes = [{ id: 'c', label: topic, x: cx, y: cy, shape: 'circle', w: W * 0.15, h: H * 0.15 }];
  const edges = [];
  items.slice(0, 5).forEach((it, i) => {
    const ang = -PI / 2 + (i / Math.min(5, items.length)) * TAU;
    const id = 'n' + i;
    nodes.push({ id, label: it, x: cx + Math.cos(ang) * W * 0.27, y: cy + Math.sin(ang) * H * 0.3, shape: 'roundRect', w: W * 0.15, h: H * 0.075 });
    edges.push({ from: 'c', to: id });
  });
  sb.diagram(nodes, edges, { name: 'overview', dur: 5 });
  sb.caption(`Everything about ${topic.toLowerCase()} branches out from one central idea.`, 4);

  // steps
  sb.text('The short version', W * 0.5, H * 0.12, { style: { size: H * 0.04, weight: 800, color: sb.accent() }, inT: 8 });
  const steps = [
    'Start with the simplest case that still shows the idea.',
    'Add one complication at a time — never two at once.',
    'Label every part as it appears, so nothing is a mystery.',
    'Show the failure mode. That is what makes it stick.'
  ];
  sb.steps(steps, { y: H * 0.24, gap: H * 0.15 });
  // key stat / callout
  sb.shape('roundRect', { x: W * 0.62, y: H * 0.22, w: W * 0.3, h: H * 0.16, r: 14 }, { name: 'callout', fill: Color.alpha(sb.accent(), 0.18), style: { size: 3, color: sb.accent(), brush: 'pen' }, inT: 14 });
  sb.text('Key idea', W * 0.77, H * 0.27, { style: { size: H * 0.026, weight: 800, color: sb.accent() }, inT: 14.3 });
  sb.text('If you remember only one thing:\nthe mechanism beats the definition.', W * 0.77, H * 0.33, { style: { size: H * 0.024, weight: 600, maxWidth: W * 0.26 }, inT: 14.6 });
  sb.caption('Definitions fade. Mechanisms stay.', 15);
  sb.camera(0, 0, 0, 1);
  sb.camera(8, 0, H * 0.1, 1.05);
  sb.camera(14, W * 0.16, -H * 0.15, 1.2);
  sb.camera(16.5, 0, 0, 1);
  sb.at(20);
  return sb.finish(1.5);
};

/* ============================================ INTENT-DRIVEN VARIATIONS == */
Generators.compare = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background('minimal');
  const items = a.entities.items.length >= 2 ? a.entities.items.slice(0, 2) : ['Option A', 'Option B'];
  sb.title(`${items[0]} vs ${items[1]}`, { y: H * 0.13 });
  sb.say('Comparisons only help when the criteria are the same on both sides.');
  const left = { title: items[0].toUpperCase(), items: ['Faster to start', 'Lower cost', 'Smaller ecosystem', 'Steeper learning curve'] };
  const right = { title: items[1].toUpperCase(), items: ['More features', 'Higher cost', 'Huge ecosystem', 'Gentler learning curve'] };
  sb.compare(left, right);
  sb.text('vs', W * 0.5, H * 0.24, { style: { size: H * 0.05, weight: 900, color: sb.accent() } });
  sb.table(['Criteria', items[0], items[1]], [
    ['Cost', '₹ Low', '₹₹ High'], ['Speed', '★★★★☆', '★★★☆☆'],
    ['Support', '★★☆☆☆', '★★★★★'], ['Learning', 'Hard', 'Easy']
  ], { x: W * 0.5, y: H * 0.86, colW: W * 0.14, inT: 10, dur: 3 });
  sb.caption('Pick based on the row that actually hurts you, not the one that sounds impressive.', 12);
  sb.camera(0, 0, 0, 1);
  sb.camera(10, 0, H * 0.14, 1.08);
  sb.at(17);
  return sb.finish(1.5);
};

Generators.stepByStep = Generators.process = (sb, a) => {
  const W = sb.W, H = sb.H;
  sb.background();
  const topic = subjectOf(a, 'Step-by-Step');
  sb.title(topic, { y: H * 0.11 });
  sb.say('One step at a time. Skip one and the rest will not work.');
  const steps = a.entities.items.length >= 3 ? a.entities.items.slice(0, 6)
    : ['Define the goal clearly', 'Gather what you need', 'Do the first pass', 'Check the result', 'Fix what broke', 'Repeat until clean'];
  sb.steps(steps, { y: H * 0.26, gap: H * 0.105 });
  steps.forEach((s, i) => sb.caption(`Step ${i + 1}: ${s}.`, 2 + i * 1.9));
  // progress bar
  sb.shape('roundRect', { x: W * 0.72, y: H * 0.3, w: W * 0.18, h: H * 0.022, r: 8 }, { name: 'bar bg', fill: 'rgba(255,255,255,.12)', style: { size: 1, color: 'rgba(255,255,255,.2)', brush: 'pen' } });
  const fill = sb.shape('roundRect', { x: W * 0.72, y: H * 0.3, w: W * 0.18, h: H * 0.022, r: 8 }, { name: 'bar fill', fill: sb.accent(), style: { size: 1, color: sb.accent(), brush: 'pen' }, reveal: 1, hidden: true });
  fill.base.opacity = 0;
  sb.scene.addTrack(new Track({ targetId: fill.id, prop: 'opacity', keys: [{ t: 2, v: 0 }, { t: 2.2, v: 1 }], ease: 'linear' }));
  sb.scene.addTrack(new Track({ targetId: fill.id, prop: 'sx', keys: [{ t: 2, v: 0.02 }, { t: 2 + steps.length * 1.9, v: 1 }], ease: 'linear', label: 'progress' }));
  sb.text('Progress', W * 0.81, H * 0.26, { style: { size: H * 0.024, weight: 700, color: sb.accent() } });
  sb.camera(0, 0, 0, 1);
  sb.at(2 + steps.length * 1.9 + 2.5);

/* ==========================================================================
   MODULE 72 · PLANNER  —  prompt → finished Scene, plus the template library
   ========================================================================== */
'use strict';

const FORMATS = {
  '16:9': { w: 1920, h: 1080, label: 'YouTube / Landscape', icon: '▭' },
  '9:16': { w: 1080, h: 1920, label: 'Shorts / Reels / TikTok', icon: '▯' },
  '1:1': { w: 1080, h: 1080, label: 'Square / Feed', icon: '□' },
  '4:5': { w: 1080, h: 1350, label: 'Portrait post', icon: '▯' },
  '21:9': { w: 2560, h: 1080, label: 'Cinematic ultra-wide', icon: '▬' }
};

const STYLE_PALETTES = {
  minimal: ['midnight', 'paper', 'glacier', 'lab', 'mono'],
  neon: ['neon', 'cyberpunk', 'midnight'],
  sketch: ['paper', 'mono', 'earth'],
  chalkboard: ['chalkboard'],
  blueprint: ['blueprint'],
  notebook: ['paper', 'glacier'],
  cinematic: ['cinematic', 'midnight', 'rose'],
  comic: ['candy', 'pastel', 'paper'],
  watercolor: ['pastel', 'sunset', 'paper'],
  retro: ['cyberpunk', 'rose', 'sunset']
};
const MOOD_PALETTES = {
  epic: ['rose', 'fire', 'gold', 'midnight'],
  calm: ['glacier', 'ocean', 'forest', 'pastel'],
  tech: ['neon', 'cyberpunk', 'terminal', 'lab'],
  playful: ['candy', 'pastel', 'india'],
  serious: ['mono', 'lab', 'blueprint'],
  warm: ['earth', 'sunset', 'gold', 'fire']
};

const MASTER_MODES = {
  story: { name: 'Story Mode', icon: '🎬', desc: 'Characters + environments + cinematic camera', styles: ['cinematic', 'comic', 'watercolor'] },
  explainer: { name: 'Explainer Mode', icon: '🎨', desc: '2D diagrams + text + icons + motion', styles: ['minimal', 'neon', 'retro'] },
  sketch: { name: 'Sketch Mode', icon: '✏️', desc: 'Hand drawing + whiteboard + labels', styles: ['sketch', 'chalkboard', 'notebook'] },
  '3d': { name: '3D Mode', icon: '🧊', desc: 'Isometric objects + extrude + revolve', styles: ['blueprint', 'minimal'] },
  information: { name: 'Information Mode', icon: '📊', desc: 'Charts + maps + stats + typography', styles: ['minimal', 'blueprint', 'notebook'] }
};

const Planner = {
  lastAnalysis: null,
  lastScene: null,

  /** Build a complete scene from free text. Always returns a usable Scene. */
  build(prompt, opts = {}) {
    const t0 = performance.now();
    const a = Analyzer.analyze(prompt);
    Planner.lastAnalysis = a;

    const mode = opts.mode || a.mode;
    const style = opts.style || a.style;
    const mood = opts.mood || a.mood;
    const formatKey = opts.format || a.format;
    const format = FORMATS[formatKey] || FORMATS['16:9'];
    const seed = opts.seed || (hashString(prompt) & 0xffffff) || 12345;

    const r = new RNG(seed);
    const stylePals = STYLE_PALETTES[style] || STYLE_PALETTES.minimal;
    const moodPals = MOOD_PALETTES[mood] || MOOD_PALETTES.calm;
    const palette = opts.palette || (r.chance(0.5) ? r.pick(stylePals) : r.pick(moodPals));

    const scene = new Scene({
      name: opts.name || subjectOf(a, 'Untitled').slice(0, 42),
      format: { key: formatKey, ...format, fps: opts.fps || 60 },
      duration: a.duration || 24,
      seed, palette, mode,
      meta: {
        prompt, analysis: {
          intent: a.intent, domain: a.domain, mood, style, mode, format: formatKey,
          confidence: a.confidence, evidence: a.evidence
        },
        style, mood, fx: [], createdAt: Date.now()
      }
    });
    scene.layers = [
      new Layer({ name: 'Background', order: 0, parallax: 0.15 }),
      new Layer({ name: 'Art', order: 1 }),
      new Layer({ name: 'FX', order: 2, blend: 'source-over' }),
      new Layer({ name: 'Labels', order: 3 }),
      new Layer({ name: 'Overlay', order: 4 })
    ];

    const sb = new Storyboard(scene, { ...a, style, mood, mode });

    // pick generator: explicit domain wins, then intent, then generic
    const gen = Planner.pickGenerator(a, opts);
    const genKey = Planner.lastGeneratorKey || 'generic';
    let built = null, err = null;
    try {
      built = gen(sb, a);
    } catch (e) {
      err = e;
      Log.error('planner', `generator "${genKey}" threw — falling back to generic`, e.message);
    }
    let usedKey = genKey;
    if (!built || !scene.elements.length) {
      // hard fallback: wipe and run the generic explainer so the user never sees an empty board
      scene.elements.length = 0; scene.tracks.length = 0; scene.cameraKeys.length = 0;
      scene.captions.length = 0; sb.t = 0; sb._z = 1;
      usedKey = 'generic (fallback from ' + genKey + ')';
      try { Generators.generic(new Storyboard(scene, { ...a, style, mood, mode }), a); }
      catch (e2) { Log.error('planner', 'generic generator failed too', e2.message); }
    }
    scene.meta.generator = usedKey;

    // duration from analysis / options
    if (opts.duration) scene.duration = opts.duration;
    else if (a.duration) scene.duration = Math.max(scene.duration, Math.min(a.duration, 600));

    // mood-driven post FX
    scene.meta.fx = Planner.fxForMood(mood, style);

    // narration cues for every caption
    scene.audioCues = scene.audioCues.concat(scene.captions.map(c => ({ t: c.t, type: 'tts', text: c.text, dur: c.dur })));

    const ms = performance.now() - t0;
    scene.meta.buildMs = roundTo(ms, 1);
    Log.info('planner', `built "${scene.name}" in ${roundTo(ms, 1)}ms`, scene.stats());
    EventBus.global.emit('planner:built', scene);
    Planner.lastScene = scene;
    return scene;
  },

  /**
   * Resolve which generator handles this analysis. Records the KEY on
   * Planner.lastGeneratorKey — arrow functions assigned to a property do not
   * get an inferred .name, so the old `gen.name` telemetry was always blank.
   */
  pickGenerator(a, opts = {}) {
    const use = (k) => { Planner.lastGeneratorKey = k; return Generators[k]; };
    if (opts.generator && Generators[opts.generator]) return use(opts.generator);
    if (a.domain && Generators[a.domain]) return use(a.domain);
    // secondary domain
    for (const d of a.secondaryDomains || []) if (Generators[d]) return use(d);
    // intent-driven
    const byIntent = {
      compare: 'compare', stepByStep: 'stepByStep', process: 'process',
      causeEffect: 'causeEffect', beforeAfter: 'beforeAfter', cycle: 'cycle',
      timeline: 'history', zoomExplain: 'zoomExplain', quiz: 'quiz',
      summarize: 'summarize', separate: 'mindmap', disassemble: 'cell',
      trace: 'waterCycle', demonstrate: 'generic', teach: 'generic'
    };
    if (Generators[a.intent]) return use(a.intent);
    if (byIntent[a.intent] && Generators[byIntent[a.intent]]) return use(byIntent[a.intent]);
    return use('generic');
  },

  fxForMood(mood, style) {
    const map = {
      epic: [{ id: 'bloom', params: { amount: 0.5, threshold: 0.7 } }, { id: 'vignette', params: { amount: 0.55 } }, { id: 'contrast', params: { amount: 1.08 } }],
      calm: [{ id: 'vignette', params: { amount: 0.3 } }],
      tech: [{ id: 'bloom', params: { amount: 0.65 } }, { id: 'scanlines', params: { amount: 0.14 } }],
      playful: [{ id: 'saturate', params: { amount: 1.25 } }],
      serious: [{ id: 'contrast', params: { amount: 1.05 } }],
      warm: [{ id: 'temperature', params: { amount: 14 } }, { id: 'grain', params: { amount: 0.08 } }]
    };
    let fx = (map[mood] || []).slice();
    if (style === 'retro') fx = fx.concat([{ id: 'grain', params: { amount: 0.16 } }, { id: 'scanlines', params: { amount: 0.2 } }]);
    if (style === 'cinematic') fx = fx.concat([{ id: 'vignette', params: { amount: 0.6 } }]);
    if (style === 'sketch' || style === 'notebook') fx = [{ id: 'grain', params: { amount: 0.05 } }];
    // dedupe by id
    const seen = new Set();
    return fx.filter(f => (seen.has(f.id) ? false : (seen.add(f.id), true)));
  },

  /** Re-generate with a different seed — same brief, new look. */
  remix(scene, opts = {}) {
    const prompt = (scene.meta && scene.meta.prompt) || scene.name;
    return Planner.build(prompt, Object.assign({ seed: (Math.random() * 1e6) | 0 }, scene.meta || {}, opts));
  }
};

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

'use strict';

class ScriptParser {
  constructor() { this.errors = []; this.warnings = []; }

  parse(source, opts = {}) {
    this.errors = []; this.warnings = [];
    const a = opts.analysis || Analyzer.analyze(opts.prompt || source.slice(0, 200));
    const scene = new Scene({
      name: 'Script', format: { key: '16:9', ...FORMATS['16:9'], fps: 60 },
      duration: 24, seed: opts.seed || 4242, palette: 'midnight',
      mode: 'explainer', meta: { prompt: source, script: true, analysis: { intent: 'build', domain: null, mood: a.mood, style: a.style, mode: 'explainer', confidence: 1 } }
    });
    scene.layers = [
      new Layer({ name: 'Background', order: 0, parallax: 0.15 }), new Layer({ name: 'Art', order: 1 }),
      new Layer({ name: 'FX', order: 2 }), new Layer({ name: 'Labels', order: 3 }), new Layer({ name: 'Overlay', order: 4 })

      case 'palette': scene.palette = rest[0]; sb.pal = paletteByName(rest[0]); break;

/* deterministic mini-RNG so the composer is reproducible from a seed */
function studioRng(seed) {
  let s = (seed | 0) || 1;
  return () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 8) & 0xffff) / 0x10000; };
}
function studioHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

  /* ═══════════════ VOICE WRITER + DRAWING COMPOSER ═══════════════ */
  _autoVoice(T, o) {
    const N = this._chapterCount(o);
    const bank = (STUDIO_VOICE_BANKS[o.tone] || STUDIO_VOICE_BANKS.simple)[o.lang === 'hi' ? 'hi' : 'en'];
    const rnd = studioRng(this._seedNum());
    const pool = bank.slice();
    // deterministic shuffle
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const need = N * 2 + 2;
    const lines = [];
    for (let i = 0; i < need; i++) lines.push(pool[i % pool.length].replace('{T}', T));
    return lines;
  }
  _chapterCount(o) {
    let n = Number(o.chapters) || ({ 30: 3, 60: 5, 120: 7, 180: 8, 240: 9, 300: 10 }[Number(o.target)] || 6);
    // never let chapters get so tight that captions would collide
    const total = Math.max(24, Number(o.target) || 120);
    n = Math.min(n, Math.max(3, Math.floor((total - 16) / 8)));
    return n;
  }

  /** Compose a full zero-overlap KALAM drawing script from wizard options. */
  _composeScript(T, o) {
    T = String(T).replace(/["\\]/g, "'").trim() || 'KALAM video';
    const Tsafe = T.replace(/'/g, '');
    const rnd = studioRng(this._seedNum());
    const total = Math.max(24, Number(o.target) || 120);
    const intro = !!o.intro && total >= 45;
    const outro = !!o.outro && total >= 45;
    const introR = intro ? 10 : 1, outroR = outro ? 15 : 3;
    const N = Math.max(2, Math.min(this._chapterCount(o), Math.floor((total - introR - outroR) / 14)));
    const accent = o.accent || STUDIO_ACCENTS[Math.floor(rnd() * STUDIO_ACCENTS.length)];
    const accent2 = STUDIO_ACCENTS[(STUDIO_ACCENTS.indexOf(accent) + 3) % STUDIO_ACCENTS.length];
    const B = o.brush || 'pen';
    const visuals = (o.visuals && o.visuals.length) ? o.visuals.filter(v => STUDIO_VISF[v]) : ['atom', 'spiral', 'chartBar', 'diagram'];
    const LAY = STUDIO_LAYOUTS[o.format] || STUDIO_LAYOUTS['16:9'];
    const pool = visuals.length ? visuals : ['atom'];
    const L = [];
    L.push(`name "${T}"`, `title "${T}"`, `subtitle "A KALAM Bot Agent video"`,
      `format ${o.format || '16:9'}`, `style ${o.style || 'minimal'}`, `palette ${o.palette || 'midnight'}`,
      'board gradient', 'camera 0 0 0 1');
    if (o.music !== false) L.push(`music ${o.mood || 'calm'}`);
    if (o.vignette) L.push('fx vignette');

    // voice lines
    let lines = (o.voiceEdited && o.voiceText) ? o.voiceText.split('\n').map(s => s.trim()).filter(Boolean) : this._autoVoice(T, o);
    lines = lines.map(s => s.replace(/["\\]/g, "'"));
    const perCh = Math.max(1, Math.ceil(lines.length / N));
    let li = 0;

    const vStr = (n) => Array.from({ length: n }, (_, k) => 15 + Math.floor(rnd() * 20) + k * (10 + Math.floor(rnd() * 12))).join(',');
    let t = 1;
    if (intro) {
      L.push('at 1');
      L.push(`text "${T}" ${LAY.cx} ${r0(LAY.vy * 0.78)} size ${r0(56 * (LAY.s + 0.4))} color ${accent}`);
      L.push(`text "Bot Agent presents" ${LAY.cx} ${r0(LAY.vy * 0.78) + 90} size ${r0(26 * (LAY.s + 0.4))} color #8ea0bb`);
      L.push(`draw atom ${LAY.cx} ${r0(LAY.vy + 200 * LAY.s)} ${r0(150 * LAY.s)} 3 brush ${B} dur 2.5`);
      L.push('wait 6');
      t = 10;
    }
    const startT = t;
    const win = (total - startT - outroR) / N;
    const aspects = STUDIO_ASPECTS[o.lang === 'hi' ? 'hi' : 'en'];

    for (let i = 0; i < N; i++) {
      const anchor = Math.round(startT + i * win);
      L.push(`at ${anchor}`, 'clear');
      if (o.chapterTitles !== false) L.push(`text "Chapter ${i + 1} · ${aspects[i % aspects.length]}" ${LAY.cx} ${LAY.ty} size ${r0(38 * (LAY.s + 0.4))} color ${accent}`);
      const vk = pool[(i * 5 + Math.floor(rnd() * pool.length)) % pool.length];
      const VF = STUDIO_VISF[vk];
      let cmd;
      if (LAY.split && i % 3 === 1 && vk !== 'diagram' && vk !== 'worldMap') {
        cmd = VF(LAY.lx, LAY.vy, LAY.s * 0.85, B, accent, accent2, Tsafe, vStr) + '\n' + VF(LAY.rx, LAY.vy, LAY.s * 0.75, B, accent, accent2, Tsafe, vStr);
      } else {
        cmd = VF(LAY.cx, LAY.vy, LAY.s, B, accent, accent2, Tsafe, vStr);
      }
      L.push(cmd);
      // particles accent (thin top strip — never over center content)
      if (o.particles && i % 2 === 1) L.push(`particles ${o.particleKind || 'sparks'} area ${r0(LAY.cx - 700 * LAY.s)},${r0(LAY.ty * 0.9)},${r0(1400 * LAY.s)},90 rate 40 dur 5`);
      const chLines = lines.slice(li, li + perCh); li += perCh;
      const useLines = chLines.length ? chLines : [(o.lang === 'hi' ? 'आगे बढ़ते हैं।' : "Let's keep going.")];
      const budget = Math.max(useLines.length * 3, win - 6.2);
      const sayDur = clamp(budget / useLines.length, 3, 8);
      for (const line of useLines) L.push(`say "${line}" dur ${roundTo(sayDur, 1)}`);
    }
    if (outro) {
      L.push(`at ${Math.round(startT + N * win)}`, 'clear');
      L.push(`text "${o.lang === 'hi' ? 'देखने के लिए धन्यवाद' : 'Thank you for watching'}" ${LAY.cx} ${r0(LAY.vy - 300 * LAY.s)} size ${r0(50 * (LAY.s + 0.4))} color ${accent}`);
      L.push(`draw spiral ${LAY.cx} ${r0(LAY.vy + 120 * LAY.s)} ${r0(330 * LAY.s)} brush ${B} dur 3`);
      if (o.confetti !== false) L.push(`particles confetti area ${r0(LAY.cx - 700 * LAY.s)},${r0(LAY.ty * 0.95)},${r0(1400 * LAY.s)},110 rate 70 dur 8`);
      const last = lines.slice(li).join(' ') || (o.lang === 'hi' ? 'अब आप इस topic को समझ चुके हैं।' : 'Now you understand this topic inside out.');
      L.push(`say "${last.replace(/["\\]/g, "'")}" dur 7`);
      L.push('wait 4');
      L.push(`camera ${Math.round(startT + N * win + 9)} 0 0 1.04`);
    }
    return L.join('\n');
  }
  _fill(tpl, B, A, A2, T, vStr) {
    return tpl.replace(/%B/g, B).replace(/%A2/g, A2).replace(/%A/g, A).replace(/%V3/g, vStr(3)).replace(/%V/g, vStr(4)).replace(/%CODE/g, `print('${T}')`.slice(0, 60));
  }

  /* ═══════════════════════ START → COUNTDOWN → PIPELINE ═══════════════════════ */
  async startVideo() {
    const topic = (this.opts.topic || '').trim();
    if (!topic) { this.app.ui.toast('Pehle topic likho (section 1)', 'warn'); return; }
    if (this.running) { this.app.ui.toast('Bot already kaam kar raha hai', 'warn'); return; }
    this.closeWizard(); this.hideHome();
    const go = await this._countdown(5);
    if (!go) { this.showHome(); return; }
    await this._pipeline(topic);
  }

  _countdown(n) {
    return new Promise(resolve => {
      let cancelled = false;
      const ov = Util.el('div', { class: 'studio-count' });
      const num = Util.el('div', { class: 'num', text: String(n) });
      const hint = Util.el('div', { class: 'hint' });
      const cancel = Util.el('button', { class: 'cancel', text: '✕ Cancel' });
      cancel.addEventListener('click', () => { cancelled = true; });
      ov.appendChild(num); ov.appendChild(hint); ov.appendChild(cancel);
      document.body.appendChild(ov);
      const hints = ['🧠 Voice + drawing script compose…', '📋 Storyboard plan…', '🖌️ Brushes + palette ready…', '🎥 Recorder arm…', '🤖 Bot Agent launch!'];
      let i = n;
      const tick = () => {
        if (cancelled) { ov.remove(); resolve(false); return; }
        if (i > 0) {
          num.textContent = String(i);
          num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
          hint.textContent = hints[n - i] || '';
          i--; setTimeout(tick, 1000);
        } else {
          num.textContent = 'GO!'; hint.textContent = '';
          setTimeout(() => { ov.remove(); resolve(true); }, 450);
        }
      };
      tick();
    });
  }

  _openHUD() {
    if (this.hudEl) this.hudEl.remove();
    this.hudEl = Util.el('div', { class: 'studio-hud' });
    this.hudEl.appendChild(Util.el('b', { text: '🤖 BOT AGENT · live' }));
    document.body.appendChild(this.hudEl);
  }
  _hud(line, isErr) {
    if (!this.hudEl) return;
    this.hudEl.appendChild(Util.el('div', { class: isErr ? 'err' : '', text: line }));
    this.hudEl.scrollTop = this.hudEl.scrollHeight;
    Log.info('studio', line);
  }
  _closeHUD(delay = 3500) { setTimeout(() => { if (this.hudEl) { this.hudEl.remove(); this.hudEl = null; } }, delay); }

  async _pipeline(topic) {
    const app = this.app, o = this.opts;
    this.running = true;
    this._openHUD();
    const wait = ms => new Promise(r => setTimeout(r, ms));
    try {
      /* ── STAGE 1 · DIRECTOR — compose script (voice + drawing) ── */
      this._hud('🧠 DIRECTOR — voice + drawing script compose kar raha hoon…');
      await wait(60);
      const script = (o.scriptEdited && o.scriptText.trim()) ? o.scriptText : this._composeScript(topic, o);
      const parser = new ScriptParser();
      let scene = parser.parse(script, { seed: this._seedNum() });
      if (parser.errors.length) {
        // fallback to planner-built scene so the user still gets a video
        this._hud('   ⚠ script errors — planner fallback: ' + parser.errors.slice(0, 2).join(' | '), true);
        scene = Planner.build(topic, { mode: 'explainer', format: o.format || app.settings.format, seed: this._seedNum() });
      } else {
        this._hud(`   ✓ script ready — ${scene.stats().elements} elements · ${scene.captions.length} captions · ${roundTo(scene.duration, 1)}s`);
      }

      /* settings sync (all real, persisted) */
      app.settings.showHand = !!o.hand;
      app.settings.narration = !!o.narration;
      app.settings.lang = o.lang || 'en';
      app.settings.fpsCap = Number(o.fps) || 60;
      app.settings.autoRepair = !!o.repair;
      app.settings.humanize = Number(o.humanize) !== undefined && o.humanize !== null ? Number(o.humanize) : (o.speed === 'fast' ? 0.5 : o.speed === 'precise' ? 2.4 : 1.6);
      if (o.speed === 'fast') app.settings.humanize = Math.min(app.settings.humanize, 0.8);
      if (o.speed === 'precise') app.settings.humanize = Math.max(app.settings.humanize, 2.0);
      if (o.format) app.settings.format = o.format;
      if (o.perf === 'high') { app.settings.autoQuality = false; app.settings.quality = 'high'; }
      else if (o.perf === 'mobile') { app.settings.autoQuality = false; app.settings.quality = 'mobile'; }
      else if (o.perf === null) app.settings.autoQuality = true;
      app.saveSettings(); if (app.applySettings) app.applySettings();
      app.audio.init();

      /* ── STAGE 2 · CINEMATOGRAPHER ── */
      this._hud('🎥 CINEMATOGRAPHER — human hand, pacing, camera…');
      await wait(60);
      if (app.settings.humanize > 0 && app.humanizeScene) app.humanizeScene(scene, app.settings.humanize);
      this._retime(scene, Number(o.target) || 120);
      this._applyCamera(scene, o.camera || 'smooth');
      this._applyBoard(scene, o.board || 'auto');
      this._hud(`   ✓ length ${roundTo(scene.duration, 1)}s · camera ${o.camera} · humanize ${app.settings.humanize}`);

      /* ── STAGE 3 · RENDERER ── */
      this._hud('🖌️ RENDERER — effects layer…');
      await wait(60);
      this._applyExtras(scene, o);

      /* ── STAGE 4 · EDITOR ── */
      this._hud('✂️ EDITOR — captions + audio…');
      await wait(60);
      if (!o.captions) scene.captions = [];
      if (!o.music) scene.audioCues = (scene.audioCues || []).filter(c => c.type !== 'music');
      if (!o.sfx) scene.audioCues = (scene.audioCues || []).filter(c => c.type !== 'sfx');
      scene.format.fps = Number(o.fps) || 60;
      app.loadScene(scene);

      /* ── STAGE 5 · REVIEW GATE ── */
      this._hud('🔍 REVIEW GATE — quality check…');
      await wait(60);
      if (o.repair) {
        const rep = QC.repair(scene);
        scene = rep.scene;
        if (rep.repairs.length) { this._hud(`   🔧 auto-repair: ${rep.repairs.join(', ')}`); app.loadScene(scene); }
      }
      const qc = QC.run(scene, null, {});
      this._hud(`   ✓ QC score ${qc.score}% · ${qc.failed.length} errors`);

      /* ── STAGE 6 · DELIVERY ── */
      this._hud('📦 DELIVERY — record + save…');
      if (o.saveProject) { try { Exporter.saveLocal(app); this._hud('   ✓ project saved'); } catch (e) { this._hud('   project save skip: ' + e.message); } }
      if (o.record && QC.canRecord()) {
        const res = await Exporter.recordVideo(app, { quality: o.recQuality || app.settings.quality });
        this._hud(`   ✓ VIDEO SAVED → ${res.name} · ${Util.formatBytes(res.blob.size)} · ${res.width}×${res.height}`);
        try { await app.shareRecording(res); } catch (e) { /* optional */ }
      } else {
        this._hud('   recording unavailable — playback dekho');
      }
      app.director.play();
      this._hud('✅ DONE — video ban gaya aur save ho gaya 🎉');
      app.ui.toast('Bot Agent finished — video saved to your device', 'ok');
      this._closeHUD(5000);
    } catch (e) {
      Log.error('studio', 'pipeline failed', e.stack || e.message);
      this._hud('❌ ' + e.message, true);
      app.ui.toast('Bot failed: ' + e.message, 'err');
      this._closeHUD(8000);
    } finally {
      this.running = false;
    }
  }

  /* ── post-production tools ── */
  _retime(scene, target) {
    const cur = Math.max(1, scene.duration);
    const f = clamp(target / cur, 0.35, 3.2);
    if (Math.abs(f - 1) < 0.04) return;
    for (const el of scene.elements) {
      el.inT *= f;
      if (el.outT !== Infinity) el.outT *= f;
    }
    for (const tr of scene.tracks) {
      tr.delay = (tr.delay || 0) * f;
      for (const k of tr.keys) k.t *= f;
    }
    for (const c of scene.captions) { c.t *= f; c.dur *= f; }
    for (const c of scene.cameraKeys) c.t *= f;
    for (const c of scene.audioCues) c.t *= f;
    scene.duration *= f;
  }
  _applyCamera(scene, mode) {
    if (mode === 'static') scene.cameraKeys = [{ t: 0, x: 0, y: 0, zoom: 1, ease: 'linear' }];
    else if (mode === 'cinematic') {
      scene.cameraKeys = [
        { t: 0, x: 0, y: 0, zoom: 1.1, ease: 'inOutCubic' },
        { t: Math.max(0.1, scene.duration * 0.97), x: 0, y: 0, zoom: 1.0, ease: 'inOutCubic' }
      ];
    } else if (!scene.cameraKeys.length) scene.cameraKeys = [{ t: 0, x: 0, y: 0, zoom: 1, ease: 'linear' }];
  }
  _applyBoard(scene, kind) {
    if (kind === 'auto') return;
    const board = scene.elements.find(e => e.type === 'board');
    if (!board) return;
    const pal = (typeof paletteByName === 'function' && paletteByName(scene.palette)) || ['#05070c', '#0b1018', '#00f5d4'];
    const styles = {
      gradient: { kind: 'gradient', color1: pal[0], color2: Color.shade(pal[0], 0.06), vignette: true },
      radial: { kind: 'radial', color1: Color.shade(pal[0], 0.1), color2: '#02020a', vignette: true },
      notebook: { kind: 'notebook', color1: '#fbf7ef', grid: 56, gridColor: 'rgba(90,120,180,.16)', vignette: false },
      grid: { kind: 'grid', color1: pal[0], grid: 64, gridColor: 'rgba(255,255,255,.07)', vignette: true },
      blueprint: { kind: 'blueprint', color1: '#081a30', grid: 56, gridColor: 'rgba(120,180,255,.14)', vignette: true },
      blackboard: { kind: 'blackboard', color1: '#0e2a20', vignette: true }
    };
    if (styles[kind]) Object.assign(board.style, styles[kind]);
  }
  _applyExtras(scene, o) {
    if (!o.particles) {
      const ids = new Set(scene.elements.filter(e => e.type === 'particles').map(e => e.id));
      if (ids.size) {
        scene.elements = scene.elements.filter(e => !ids.has(e.id));
        scene.tracks = scene.tracks.filter(tr => !ids.has(tr.targetId));
      }
    }
    if (o.vignette) {
      const fx = (scene.meta.fx || []).map(f => f.id || f).filter(id => id !== 'vignette');
      fx.push('vignette');
      scene.meta.fx = fx.map(id => ({ id }));
    } else if (Array.isArray(scene.meta.fx)) {
      scene.meta.fx = scene.meta.fx.filter(f => (f.id || f) !== 'vignette');
    }
    if (o.confetti && !scene.elements.some(e => e.type === 'particles' && e.name === 'fx:confetti')) {
      const pal = (typeof paletteByName === 'function' && paletteByName(scene.palette)) || ['#05070c', '#00f5d4', '#ffd166', '#ff2a6d', '#a78bfa'];
      const inT = Math.max(0, scene.duration - 4.5);
      const conf = scene.add(new ParticleEl({
        layerId: scene.layer('FX').id, name: 'fx:confetti',
        base: { opacity: 1, reveal: 0 },
        style: { kind: 'confetti', max: 400, rate: 90 },
        data: { colors: pal.slice(1), scene: { w: scene.format.w, h: scene.format.h }, area: { x: 0, y: 0, w: scene.format.w, h: scene.format.h * 0.45 } },
        z: 999, inT, outT: Infinity
      }));
      scene.addTrack(new Track({
        targetId: conf.id, prop: 'reveal', ease: 'linear', holdEnd: true,
        keys: [{ t: inT, v: 0 }, { t: inT + 0.6, v: 1 }, { t: inT + 3.4, v: 1 }, { t: inT + 4.3, v: 0 }]
      }));
    }
  }
}

const QC = {
  /** Run every static check. Returns {passed, failed, warnings, score, checks[]}. */
  run(scene, renderer, opts = {}) {
    const checks = [];
    const add = (id, name, ok, severity, detail, fix) => checks.push({ id, name, ok: !!ok, severity: severity || 'error', detail: detail || '', fix: fix || null });

    /* 1 — structure */
    add('structure', 'Scene has elements', scene.elements.length > 0, 'error', `${scene.elements.length} elements`, 'planner:fallback');
    add('layers', 'All elements have a valid layer', scene.elements.every(e => !e.layerId || scene.layers.some(l => l.id === e.layerId)), 'error',
      `${scene.elements.filter(e => e.layerId && !scene.layers.some(l => l.id === e.layerId)).length} orphans`);

    /* 2 — unique ids */
    const ids = scene.elements.map(e => e.id);
    const dupes = ids.length - new Set(ids).size;
    add('ids', 'Element IDs unique', dupes === 0, 'error', `${dupes} duplicates`);

    /* 3 — tracks resolve */
    const orphanTracks = scene.tracks.filter(t => t.targetId && !scene.byId(t.targetId)).length;
    add('tracks', 'All animation tracks have a target', orphanTracks === 0, 'error', `${orphanTracks} orphan tracks`);

    /* 4 — finite numbers */
    let nanCount = 0;
    for (const e of scene.elements) {
      for (const k of ['x', 'y', 'rot', 'sx', 'sy', 'opacity', 'reveal']) if (!isFinite(e.base[k])) nanCount++;
      if (e.data && e.data.pts) for (const p of e.data.pts) if (!isFinite(p.x) || !isFinite(p.y)) nanCount++;
      if (e.data && e.data.params) for (const k in e.data.params) if (typeof e.data.params[k] === 'number' && !isFinite(e.data.params[k])) nanCount++;
    }
    add('finite', 'No NaN / Infinity in geometry', nanCount === 0, 'error', `${nanCount} bad numbers`);

    /* 5 — bounds */
    const W = scene.format.w, H = scene.format.h;
    const outside = [];
    for (const e of scene.elements) {
      if (e.type === 'board' || e.type === 'particles') continue;
      const b = e.worldBounds();
      if (b.w <= 0 || b.h <= 0) continue;
      if (b.x + b.w < -W * 0.05 || b.x > W * 1.05 || b.y + b.h < -H * 0.05 || b.y > H * 1.05) outside.push(e.name || e.type);
    }
    add('bounds', 'Nothing drawn outside the frame', outside.length === 0, 'warn', outside.slice(0, 5).join(', '));

    /* 6 — safe area (text) */
    const pad = 0.06;
    const unsafeText = [];
    for (const e of scene.elements) {
      if (e.type !== 'text') continue;
      const b = e.worldBounds();
      if (b.x < W * pad || b.y < H * pad || b.x + b.w > W * (1 - pad) || b.y + b.h > H * (1 - pad)) unsafeText.push(Util.truncate(e.data.text || '', 22));
    }
    add('safearea', 'Text inside the safe area', unsafeText.length === 0, 'warn', unsafeText.slice(0, 4).join(' | '), 'repair:safearea');

    /* 7 — caption overlaps */
    const caps = scene.captions.slice().sort((a, b) => a.t - b.t);
    let overlaps = 0;
    for (let i = 1; i < caps.length; i++) if (caps[i].t < caps[i - 1].t + caps[i - 1].dur - 0.05) overlaps++;
    add('captions', 'No overlapping captions', overlaps === 0, 'warn', `${overlaps} overlaps`, 'repair:captions');
    add('captionPresence', 'Scene has narration', caps.length > 0, 'info', `${caps.length} captions`);

    /* 8 — spelling */
    const misspelled = new Set();
    for (const c of caps) for (const w of Util.words(c.text)) if (w.length > 3 && !DICTIONARY.has(w) && !/^\d/.test(w)) misspelled.add(w);
    for (const e of scene.elements) if (e.type === 'text') for (const w of Util.words(e.data.text)) if (w.length > 3 && !DICTIONARY.has(w) && !/^\d/.test(w)) misspelled.add(w);
    add('spelling', 'No obvious spelling errors', misspelled.size === 0, 'warn', Array.from(misspelled).slice(0, 8).join(', '));

    /* 9 — duration */
    const span = new AnimationEngine().span(scene);
    add('duration', 'Duration is sane (3s – 600s)', scene.duration >= 3 && scene.duration <= 600, 'error', `${roundTo(scene.duration, 1)}s (content ends ~${roundTo(span, 1)}s)`, 'repair:duration');
    add('coverage', 'Content fills the timeline', span > scene.duration * 0.55, 'warn', `content ${roundTo(span, 1)}s of ${roundTo(scene.duration, 1)}s`);

    /* 10 — format */
    const f = FORMATS[scene.format.key] || FORMATS['16:9'];
    add('format', 'Resolution matches declared format', scene.format.w === f.w && scene.format.h === f.h, 'error', `${scene.format.w}x${scene.format.h} vs ${f.w}x${f.h}`, 'repair:format');
    add('resolution', 'Resolution ≥ 720p on the long edge', Math.max(scene.format.w, scene.format.h) >= 1280, 'warn', `${scene.format.w}x${scene.format.h}`);
    add('fps', 'Frame rate is 24–120', scene.format.fps >= 24 && scene.format.fps <= 120, 'warn', `${scene.format.fps} fps`);
