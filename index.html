   30-brushes.js
   ────────────────────────────────────────────────────────────────────── */
/* ==========================================================================
   MODULE 30 · BRUSHES  —  30 real rasterisation engines
   Every brush genuinely rasterises differently: scatter, ribbon geometry,
   wet-media layering, additive glow, nib angle, impasto, erase.
   ========================================================================== */
'use strict';

class Brush {
  constructor(meta) { Object.assign(this, meta); this.noise = new Noise(this.meta_seed || 7); }
  /** Iterate polyline → {p1,p2,w,v,i,t} giving each brush the same input. */
  *segments(pts, style, quality = 1) {
    const base = Math.max(0.4, style.size || 4);
    const pressure = style.pressure === undefined ? 0.5 : style.pressure;
    const minW = base * (style.taper === false ? 1 : 0.35);
    const maxW = base * (1 + pressure * 1.4);
    const n = Math.max(2, Math.floor(pts.length * quality));
    const res = pts.length > 64 ? PathUtil.resample(pts, n) : pts;
    for (let i = 1; i < res.length; i++) {
      const p1 = res[i - 1], p2 = res[i];
      const d = distXY(p1.x, p1.y, p2.x, p2.y);
      const v = d;                                   // px per sample
      const pr = p2.p === undefined ? pressure : p2.p;
      const w = lerp(minW, maxW, clamp01(pr));
      yield { p1, p2, w, v, i, t: i / (res.length - 1), d };
    }
  }
  setup(ctx, style) {
    ctx.lineCap = style.cap || 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = style.color || '#fff';
    ctx.fillStyle = style.color || '#fff';
  }
  render(ctx, pts, style, app) {
    if (!pts || pts.length < 2) return;
    this.setup(ctx, style);
    ctx.lineWidth = Math.max(0.4, style.size || 4);
    const path = PathUtil.toPath2D(pts);
    ctx.stroke(path);
  }
  /** Hand position used by the IK arm while the bot draws. */
  tip(pts, ratio) { return PathUtil.pointAt(pts, ratio); }
}

/* -------------------------------------------------------------- PEN ------ */
class PenBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const q = 1;
    let prev = null;
    for (const s of this.segments(pts, style, q)) {
      ctx.beginPath();
      ctx.moveTo(s.p1.x, s.p1.y);
      ctx.lineTo(s.p2.x, s.p2.y);
      ctx.lineWidth = s.w;
      ctx.stroke();
      prev = s;
    }
  }
}

/* ----------------------------------------------------------- PENCIL ------ */
class PencilBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const grain = 3;
    ctx.globalAlpha *= 0.32;
    for (let g = 0; g < grain; g++) {
      const off = (g - 1) * style.size * 0.18;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i < pts.length; i++) {
        const n = this.noise.perlin2(i * 0.22 + g * 11, g * 3.3) * (style.size * 0.28);
        const x = pts[i].x + n + off, y = pts[i].y + this.noise.perlin2(g * 5.1, i * 0.22) * (style.size * 0.28);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.lineWidth = Math.max(0.5, style.size * 0.42);
      ctx.stroke();
    }
    // graphite speckle
    ctx.globalAlpha *= 0.5;
    for (let i = 1; i < pts.length; i += 2) {
      const a = this.noise.perlin2(i * 0.5, 1.7) * 0.5 + 0.5;
      if (a > 0.55) {
        ctx.beginPath();
        ctx.arc(pts[i].x + this.noise.perlin2(i, 9) * style.size, pts[i].y + this.noise.perlin2(9, i) * style.size, style.size * 0.12, 0, TAU);
        ctx.fill();
      }
    }
  }
}

/* ------------------------------------------------------------ BRUSH ------ */
class SoftBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    // variable-width ribbon via offset outline (real brush geometry)
    const left = [], right = [];
    const segs = Array.from(this.segments(pts, style));
    for (const s of segs) {
      const a = angleTo(s.p1.x, s.p1.y, s.p2.x, s.p2.y) + PI / 2;
      const hw = s.w * 0.62;
      left.push({ x: s.p2.x + Math.cos(a) * hw, y: s.p2.y + Math.sin(a) * hw });
      right.push({ x: s.p2.x - Math.cos(a) * hw, y: s.p2.y - Math.sin(a) * hw });
    }
    ctx.beginPath();
    if (left.length) {
      ctx.moveTo(segs[0].p1.x, segs[0].p1.y);
      for (const q of left) ctx.lineTo(q.x, q.y);
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
      ctx.closePath();
    }
    ctx.globalAlpha *= 0.92;
    ctx.fill();
  }
}

/* ----------------------------------------------------------- MARKER ------ */
class MarkerBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prevOp = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = style.blend || 'multiply';
    ctx.lineCap = 'butt';
    ctx.globalAlpha *= 0.5;
    ctx.lineWidth = style.size * 2.4;
    ctx.strokeStyle = style.color;
    const path = PathUtil.toPath2D(pts);
    ctx.stroke(path);
    ctx.globalAlpha *= 0.45;
    ctx.lineWidth = style.size * 2.4;
    ctx.stroke(path);
    ctx.globalCompositeOperation = prevOp;
    ctx.lineCap = 'round';
  }
}

/* ------------------------------------------------------ CALLIGRAPHY ------ */
class CalligraphyBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const nib = (style.nib === undefined ? 45 : style.nib) * DEG2RAD;
    const nx = Math.cos(nib), ny = Math.sin(nib);
    ctx.beginPath();
    const segs = Array.from(this.segments(pts, style));
    const L = [], R = [];
    for (const s of segs) {
      const hw = s.w * 1.25;
      L.push({ x: s.p2.x + nx * hw, y: s.p2.y + ny * hw });
      R.push({ x: s.p2.x - nx * hw, y: s.p2.y - ny * hw });
    }
    if (!segs.length) return;
    ctx.moveTo(L[0].x, L[0].y);
    for (const q of L) ctx.lineTo(q.x, q.y);
    for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i].x, R[i].y);
    ctx.closePath();
    ctx.fill();
  }
}

/* --------------------------------------------------------- CHARCOAL ------ */
class CharcoalBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.globalAlpha *= 0.14;
    const density = 7;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const steps = Math.max(1, Math.floor(distXY(a.x, a.y, b.x, b.y) / 3));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t);
        for (let d = 0; d < density; d++) {
          const ang = this.noise.perlin2(i * 0.3 + d, d * 2.1) * TAU;
          const rad = Math.abs(this.noise.perlin2(i + d * 3, s)) * style.size * 1.7;
          ctx.fillStyle = style.color;
          ctx.fillRect(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad, 1.6, 1.6);
        }
      }
    }
  }
}

/* ----------------------------------------------------------- PASTEL ------ */
class PastelBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.globalAlpha *= 0.16;
    for (let pass = 0; pass < 5; pass++) {
      const off = (pass - 2) * style.size * 0.35;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const nx = this.noise.perlin2(i * 0.15 + pass, pass * 7) * style.size * 0.5;
        const x = pts[i].x + nx, y = pts[i].y + off + this.noise.perlin2(pass, i * 0.15) * style.size * 0.4;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.lineWidth = style.size * 1.5;
      ctx.strokeStyle = style.color;
      ctx.stroke();
    }
  }
}

/* -------------------------------------------------------- WATERCOLOR ----- */
class WatercolorBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'multiply';
    const passes = 6;
    for (let p = 0; p < passes; p++) {
      const seedOff = p * 13.7;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const n1 = this.noise.perlin2(i * 0.09 + seedOff, p * 2.3);
        const n2 = this.noise.perlin2(p * 2.3, i * 0.09 + seedOff);
        const spread = style.size * (1.1 + p * 0.35);
        const x = pts[i].x + n1 * spread, y = pts[i].y + n2 * spread;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.lineWidth = style.size * (1.6 + p * 0.5);
      ctx.globalAlpha = 0.055;
      ctx.strokeStyle = style.color;
      ctx.stroke();
    }
    // pigment pooling at the edges
    ctx.globalAlpha = 0.1;
    ctx.lineWidth = style.size * 0.7;
    const path = PathUtil.toPath2D(pts);
    ctx.stroke(path);
    ctx.globalCompositeOperation = prev;
  }
}

/* -------------------------------------------------------------- OIL ------ */
class OilBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const segs = Array.from(this.segments(pts, style));
    for (const s of segs) {
      const a = angleTo(s.p1.x, s.p1.y, s.p2.x, s.p2.y);
      const hw = s.w * 0.75;
      const nx = Math.cos(a + PI / 2), ny = Math.sin(a + PI / 2);
      const g = ctx.createLinearGradient(s.p2.x - nx * hw, s.p2.y - ny * hw, s.p2.x + nx * hw, s.p2.y + ny * hw);
      g.addColorStop(0, Color.shade(style.color, 0.16));
      g.addColorStop(0.5, style.color);
      g.addColorStop(1, Color.shade(style.color, -0.22));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s.p1.x - nx * hw, s.p1.y - ny * hw);
      ctx.lineTo(s.p2.x - nx * hw, s.p2.y - ny * hw);
      ctx.lineTo(s.p2.x + nx * hw, s.p2.y + ny * hw);
      ctx.lineTo(s.p1.x + nx * hw, s.p1.y + ny * hw);
      ctx.closePath();
      ctx.globalAlpha = 0.85;
      ctx.fill();
    }
  }
}

/* ------------------------------------------------------------ SPRAY ------ */
class SprayBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.fillStyle = style.color;
    const density = Math.max(3, Math.floor(style.size * 1.6));
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const steps = Math.max(1, Math.floor(distXY(a.x, a.y, b.x, b.y) / 4));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const cx = lerp(a.x, b.x, t), cy = lerp(a.y, b.y, t);
        for (let d = 0; d < density; d++) {
          const ang = this.noise.perlin2(i * 3 + d * 7, s + d) * TAU * 2;
          const rad = Math.abs(this.noise.perlin2(d * 1.7, i + s)) * style.size * 2.2;
          ctx.globalAlpha = 0.09 * (1 - rad / (style.size * 2.4));
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, 1.1, 0, TAU);
          ctx.fill();
        }
      }
    }
  }
}

/* ---------------------------------------------------------- AIRBRUSH ----- */
class AirbrushBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const R = style.size * 2.6;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const steps = Math.max(1, Math.floor(distXY(a.x, a.y, b.x, b.y) / (R * 0.3)));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t);
        const g = ctx.createRadialGradient(x, y, 0, x, y, R);
        g.addColorStop(0, Color.alpha(style.color, 0.13));
        g.addColorStop(0.6, Color.alpha(style.color, 0.05));
        g.addColorStop(1, Color.alpha(style.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
      }
    }
  }
}

/* ----------------------------------------------------------- GLITTER ----- */
class GlitterBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    const path = PathUtil.toPath2D(pts);
    ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, style.size * 0.5);
    ctx.strokeStyle = Color.alpha(style.color, 0.6);
    ctx.stroke(path);
    for (let i = 0; i < pts.length; i++) {
      const n = Math.abs(this.noise.perlin2(i * 0.7, 3));
      if (n < 0.28) continue;
      const x = pts[i].x + this.noise.perlin2(i, 1) * style.size * 1.4;
      const y = pts[i].y + this.noise.perlin2(1, i) * style.size * 1.4;
      const r = style.size * (0.25 + n * 0.6);
      ctx.globalAlpha = 0.25 + n * 0.7;
      ctx.fillStyle = n > 0.62 ? '#ffffff' : style.color;
      ctx.save(); ctx.translate(x, y); ctx.rotate(n * 3);
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const ang = (k / 8) * TAU, rad = k % 2 ? r * 0.3 : r * 1.6; ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalCompositeOperation = prev;
  }
}

/* ------------------------------------------------------------- NEON ------ */
class NeonBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    const path = PathUtil.toPath2D(pts);
    const c = style.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const passes = [
      { w: style.size * 4.2, col: Color.alpha(c, 0.10), blur: style.size * 3.2 },
      { w: style.size * 2.4, col: Color.alpha(c, 0.20), blur: style.size * 1.8 },
      { w: style.size * 1.2, col: Color.alpha(c, 0.55), blur: style.size * 0.7 },
      { w: Math.max(0.8, style.size * 0.45), col: '#ffffff', blur: 0 }
    ];
    for (const p of passes) {
      ctx.lineWidth = p.w; ctx.strokeStyle = p.col;
      ctx.shadowColor = c; ctx.shadowBlur = p.blur;
      ctx.stroke(path);
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = prev;
  }
}

/* ------------------------------------------------------------- GLOW ------ */
class GlowBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    const path = PathUtil.toPath2D(pts);
    ctx.shadowColor = style.color; ctx.shadowBlur = style.size * 2.4;
    ctx.globalAlpha = 0.55; ctx.lineWidth = style.size * 1.5; ctx.strokeStyle = style.color;
    ctx.stroke(path);
    ctx.shadowBlur = 0; ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(0.7, style.size * 0.5); ctx.strokeStyle = Color.shade(style.color, 0.3);
    ctx.stroke(path);
    ctx.globalCompositeOperation = prev;
  }
}

/* ---------------------------------------------------------- PATTERN ------ */
class PatternBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const motif = style.motif || 'dash';
    const cum = PathUtil.cumulative(pts);
    const total = cum[cum.length - 1];
    const step = Math.max(6, style.size * 2.6);
    for (let d = 0; d < total; d += step) {
      const pt = PathUtil.pointAt(pts, d / total);
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.a);
      ctx.fillStyle = style.color; ctx.strokeStyle = style.color;
      ctx.lineWidth = Math.max(1, style.size * 0.3);
      ctx.globalAlpha = 0.85;
      const r = style.size * 0.55;
      if (motif === 'dot') { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); }
      else if (motif === 'ring') { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
      else if (motif === 'cross') { ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r); ctx.moveTo(r, -r); ctx.lineTo(-r, r); ctx.stroke(); }
      else if (motif === 'leaf') { ctx.beginPath(); ctx.ellipse(0, 0, r * 1.7, r * 0.7, 0, 0, TAU); ctx.fill(); }
      else if (motif === 'star') {
        ctx.beginPath();
        for (let k = 0; k < 10; k++) { const ang = (k / 10) * TAU, rad = k % 2 ? r * 0.45 : r * 1.3; ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad); }
        ctx.closePath(); ctx.fill();
      } else if (motif === 'tri') { ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r, r); ctx.lineTo(-r, r); ctx.closePath(); ctx.fill(); }
      else { ctx.fillRect(-r, -r * 0.35, r * 2, r * 0.7); }
      ctx.restore();
    }
  }
}

/* ------------------------------------------------------------ STAMP ------ */
class StampBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const glyph = style.glyph || '✦';
    const size = style.size * 3;
    ctx.font = `${size}px ${FONT_STACKS.sans}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = style.color;
    const total = PathUtil.length(pts);
    const step = Math.max(size * 0.85, 12);
    for (let d = 0; d < total; d += step) {
      const pt = PathUtil.pointAt(pts, d / total);
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.a + (style.upright ? -pt.a : 0));
      ctx.globalAlpha = 0.9;
      ctx.fillText(glyph, 0, 0);
      ctx.restore();
    }
  }
}

/* --------------------------------------------------------- GRADIENT ------ */
class GradientBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const b = PathUtil.bounds(pts);
    const stops = style.gradient || [style.color, Color.shade(style.color, 0.28)];
    const g = style.gradientType === 'radial'
      ? ctx.createRadialGradient(b.x + b.w / 2, b.y + b.h / 2, 0, b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h) / 2)
      : ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
    stops.forEach((c, i) => g.addColorStop(i / Math.max(1, stops.length - 1), c));
    ctx.strokeStyle = g;
    let prev = null;
    for (const s of this.segments(pts, style)) {
      ctx.beginPath(); ctx.moveTo(s.p1.x, s.p1.y); ctx.lineTo(s.p2.x, s.p2.y);
      ctx.lineWidth = s.w; ctx.stroke();
      prev = s;
    }
  }
}

/* ------------------------------------------------------------- BLUR ------ */
class BlurBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const path = PathUtil.toPath2D(pts);
    ctx.shadowColor = style.color; ctx.shadowBlur = style.size * 3;
    ctx.globalAlpha = 0.35; ctx.lineWidth = style.size * 2; ctx.strokeStyle = style.color;
    ctx.stroke(path); ctx.stroke(path);
    ctx.shadowBlur = 0;
  }
}

/* ----------------------------------------------------------- SMUDGE ------ */
class SmudgeBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    // multi-offset translucent passes = paint being dragged
    const off = style.size * 0.9;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const x = pts[i].x + Math.cos(k * 1.9) * off * (k / 4);
        const y = pts[i].y + Math.sin(k * 1.9) * off * (k / 4);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.globalAlpha = 0.16;
      ctx.lineWidth = style.size * 1.8;
      ctx.strokeStyle = style.color;
      ctx.stroke();
    }
  }
}

/* ----------------------------------------------------------- CLONE ------- */
class CloneBrush extends Brush {
  render(ctx, pts, style, app) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const src = app && app.worldCanvas;
    if (src) {
      const dx = style.cloneDx === undefined ? 120 : style.cloneDx;
      const dy = style.cloneDy === undefined ? -120 : style.cloneDy;
      ctx.globalAlpha = 0.95;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        const w = Math.max(2, style.size * 2.2);
        ctx.save();
        ctx.beginPath(); ctx.arc((a.x + b.x) / 2, (a.y + b.y) / 2, w, 0, TAU); ctx.clip();
        ctx.drawImage(src, 0, 0);
        ctx.restore();
      }
      return;
    }
    ctx.globalAlpha = 0.8; ctx.lineWidth = style.size * 2; ctx.strokeStyle = style.color;
    ctx.stroke(PathUtil.toPath2D(pts));
  }
}

/* ------------------------------------------------------------ HEAL ------- */
class HealBrush extends Brush {
  render(ctx, pts, style, app) {
    if (pts.length < 2) return;
    const src = app && app.worldCanvas;
    const R = style.size * 2;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
      if (src) { ctx.filter = 'blur(6px)'; ctx.drawImage(src, -8, -8); ctx.filter = 'none'; }
      else { ctx.fillStyle = Color.alpha(style.color, 0.3); ctx.fillRect(x - R, y - R, R * 2, R * 2); }
      ctx.restore();
    }
  }
}

/* -------------------------------------------------------- 3D EXTRUDE ----- */
class ExtrudeBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const depth = style.depth === undefined ? 16 : style.depth;
    const ang = (style.extrudeAngle === undefined ? 45 : style.extrudeAngle) * DEG2RAD;
    const dx = Math.cos(ang) * depth, dy = Math.sin(ang) * depth;
    const path = PathUtil.toPath2D(pts);
    const layers = 14;
    for (let i = layers; i >= 1; i--) {
      ctx.save();
      ctx.translate((dx / layers) * i, (dy / layers) * i);
      ctx.strokeStyle = Color.shade(style.color, -0.06 * (i / layers) - 0.05);
      ctx.lineWidth = Math.max(1, style.size);
      ctx.globalAlpha = 0.85;
      ctx.stroke(path);
      ctx.restore();
    }
    ctx.strokeStyle = Color.shade(style.color, 0.22);
    ctx.lineWidth = Math.max(1, style.size);
    ctx.stroke(path);
  }
}

/* -------------------------------------------------------- 3D REVOLVE ----- */
class RevolveBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const b = PathUtil.bounds(pts);
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const copies = style.copies || 12;
    const path = PathUtil.toPath2D(pts);
    for (let i = copies - 1; i >= 0; i--) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((i / copies) * TAU);
      ctx.scale(1 - (i / copies) * 0.06, 1 - (i / copies) * 0.06);
      ctx.translate(-cx, -cy);
      ctx.strokeStyle = Color.alpha(style.color, 0.35 + 0.5 * (1 - i / copies));
      ctx.lineWidth = Math.max(1, style.size);
      ctx.stroke(path);
      ctx.restore();
    }
  }
}

/* ----------------------------------------------------------- SCULPT ------ */
class SculptBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const segs = Array.from(this.segments(pts, style));
    for (const s of segs) {
      const a = angleTo(s.p1.x, s.p1.y, s.p2.x, s.p2.y);
      const hw = s.w * 0.9;
      const nx = Math.cos(a + PI / 2), ny = Math.sin(a + PI / 2);
      const g = ctx.createLinearGradient(s.p2.x - nx * hw, s.p2.y - ny * hw, s.p2.x + nx * hw, s.p2.y + ny * hw);
      g.addColorStop(0, Color.shade(style.color, 0.3));
      g.addColorStop(0.45, style.color);
      g.addColorStop(1, Color.shade(style.color, -0.3));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s.p1.x - nx * hw, s.p1.y - ny * hw);
      ctx.lineTo(s.p2.x - nx * hw, s.p2.y - ny * hw);
      ctx.lineTo(s.p2.x + nx * hw, s.p2.y + ny * hw);
      ctx.lineTo(s.p1.x + nx * hw, s.p1.y + ny * hw);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* ----------------------------------------------------------- ERASER ------ */
class EraserBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, style.size * 2.4);
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.globalAlpha = 1;
    ctx.stroke(PathUtil.toPath2D(pts));
    ctx.globalCompositeOperation = prev;
  }
}

/* -------------------------------------------------------------- INK ------ */
class InkBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const segs = Array.from(this.segments(pts, style));
    // pressure envelope: thin at start, swell in the middle, taper at the end
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const env = Math.sin(PI * s.t) ** 0.6;
      const w = Math.max(0.6, s.w * (0.35 + env * 0.95));
      ctx.beginPath();
      ctx.moveTo(s.p1.x, s.p1.y); ctx.lineTo(s.p2.x, s.p2.y);
      ctx.lineWidth = w; ctx.stroke();
    }
  }
}

/* ------------------------------------------------------------ CHALK ------ */
class ChalkBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.globalAlpha = 0.5;
    for (let pass = 0; pass < 3; pass++) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const jitter = this.noise.perlin2(i * 0.4 + pass * 5, pass) * style.size * 0.42;
        const x = pts[i].x + jitter, y = pts[i].y + this.noise.perlin2(pass * 3, i * 0.4) * style.size * 0.42;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.lineWidth = style.size * 0.8;
      ctx.strokeStyle = style.color;
      ctx.stroke();
    }
  }
}

/* ----------------------------------------------------------- CRAYON ------ */
class CrayonBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.globalAlpha = 0.22;
    const w = style.size * 1.5;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const steps = Math.max(1, Math.floor(distXY(a.x, a.y, b.x, b.y) / 2));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t);
        ctx.fillStyle = style.color;
        ctx.fillRect(x - w / 2 + this.noise.perlin2(i, s) * 2, y - w / 2 + this.noise.perlin2(s, i) * 2, w, w);
      }
    }
  }
}

/* -------------------------------------------------------- TECHNICAL ------ */
class TechnicalBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    ctx.lineWidth = Math.max(0.8, style.size * 0.5);
    ctx.strokeStyle = style.color;
    ctx.globalAlpha = 0.95;
    ctx.stroke(PathUtil.toPath2D(pts));
    // end caps: crosshair ticks
    const first = pts[0], last = pts[pts.length - 1];
    const tick = Math.max(5, style.size * 1.1);
    ctx.beginPath();
    ctx.moveTo(first.x - tick, first.y); ctx.lineTo(first.x + tick, first.y);
    ctx.moveTo(first.x, first.y - tick); ctx.lineTo(first.x, first.y + tick);
    ctx.moveTo(last.x - tick, last.y); ctx.lineTo(last.x + tick, last.y);
    ctx.moveTo(last.x, last.y - tick); ctx.lineTo(last.x, last.y + tick);
    ctx.stroke();
  }
}

/* ------------------------------------------------------ HIGHLIGHTER ------ */
class HighlighterBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'multiply';
    ctx.lineCap = 'butt';
    ctx.globalAlpha = 0.32;
    ctx.lineWidth = style.size * 3.2;
    ctx.strokeStyle = style.color;
    ctx.stroke(PathUtil.toPath2D(pts));
    ctx.globalCompositeOperation = prev;
    ctx.lineCap = 'round';
  }
}

/* ------------------------------------------------------------ PIXEL ------ */
class PixelBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const cell = Math.max(2, Math.floor(style.size));
    const seen = new Set();
    ctx.fillStyle = style.color;
    ctx.globalAlpha = 0.95;
    for (const p of pts) {
      const gx = Math.floor(p.x / cell) * cell, gy = Math.floor(p.y / cell) * cell;
      const key = gx + ':' + gy;
      if (seen.has(key)) continue;
      seen.add(key);
      ctx.fillRect(gx, gy, cell, cell);
    }
  }
}

/* --------------------------------------------------------- RIBBON3D ------ */
class RibbonBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const segs = Array.from(this.segments(pts, style));
    for (const s of segs) {
      const a = angleTo(s.p1.x, s.p1.y, s.p2.x, s.p2.y);
      const wave = Math.sin(s.t * PI * (style.twist || 6)) * s.w * 1.6;
      const nx = Math.cos(a + PI / 2), ny = Math.sin(a + PI / 2);
      ctx.fillStyle = Color.alpha(style.color, 0.55 + 0.4 * Math.abs(Math.sin(s.t * PI * (style.twist || 6))));
      ctx.beginPath();
      ctx.moveTo(s.p1.x + nx * wave, s.p1.y + ny * wave);
      ctx.lineTo(s.p2.x + nx * wave, s.p2.y + ny * wave);
      ctx.lineTo(s.p2.x - nx * wave, s.p2.y - ny * wave);
      ctx.lineTo(s.p1.x - nx * wave, s.p1.y - ny * wave);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* ------------------------------------------------------------ LASER ------ */
class LaserBrush extends Brush {
  render(ctx, pts, style) {
    if (pts.length < 2) return;
    this.setup(ctx, style);
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = 'lighter';
    const path = PathUtil.toPath2D(pts);
    ctx.lineCap = 'round';
    ctx.shadowColor = style.color; ctx.shadowBlur = style.size * 5;
    ctx.strokeStyle = Color.alpha(style.color, 0.35); ctx.lineWidth = style.size * 2.2; ctx.stroke(path);
    ctx.shadowBlur = style.size * 1.5;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, style.size * 0.35); ctx.stroke(path);
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = prev;
  }
}

/* ==========================================================================
   MODULE 40 · ANIMATION  —  deterministic keyframe + procedural tracks
   Every animation on the timeline is data, so the scene at time t can be
   evaluated exactly → scrubbing, recording and export all stay in sync.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------- TRACK ----- */
class Track {
  constructor(opts = {}) {
    this.id = opts.id || uid('tr');
    this.targetId = opts.targetId;
    this.prop = opts.prop || 'opacity';
    this.keys = (opts.keys || []).slice().sort((a, b) => a.t - b.t);
    this.ease = opts.ease || 'outCubic';
    this.repeat = opts.repeat || 0;          // 0 = once, -1 = forever
    this.direction = opts.direction || 'normal'; // normal | reverse | alternate
    this.speed = opts.speed === undefined ? 1 : opts.speed;
    this.delay = opts.delay || 0;
    this.priority = opts.priority || 0;
    this.behavior = opts.behavior || null;   // procedural behaviour name
    this.params = opts.params || {};
    this.holdEnd = opts.holdEnd !== false;
    this.label = opts.label || '';
  }
  get t0() { return this.keys.length ? this.keys[0].t + this.delay : this.delay; }
  get t1() { return this.keys.length ? this.keys[this.keys.length - 1].t + this.delay : this.delay; }
  span() { return Math.max(1e-6, this.t1 - this.t0); }

  /**
   * Map a global time to the local (key-space) time, applying speed, delay,
   * repeat count and play direction. Keyframe times are ABSOLUTE scene times,
   * so only `delay` is subtracted — the previous version subtracted `t0`
   * (which already includes keys[0].t) and then clamped against absolute key
   * times, which snapped every finished track back to its FIRST key value.
   */
  localTime(t) {
    if (!this.keys.length) return 0;
    const k0 = this.keys[0].t, k1 = this.keys[this.keys.length - 1].t;
    const span = Math.max(1e-6, k1 - k0);
    let lt = (t - this.delay) * this.speed;
    if (this.repeat !== 0 && lt > k0) {
      const cycles = (lt - k0) / span;
      const maxCycles = this.repeat < 0 ? Infinity : this.repeat + 1;
      if (cycles >= maxCycles) lt = k1;
      else {
        const whole = Math.floor(cycles);
        let frac = cycles - whole;
        if (this.direction === 'reverse') frac = 1 - frac;
        else if (this.direction === 'alternate' && whole % 2 === 1) frac = 1 - frac;
        lt = k0 + frac * span;
      }
    }
    return clamp(lt, k0, k1);
  }
  /** Normalised 0..1 progress with repeat/direction applied. */
  progress(t) {
    if (!this.keys.length) return 0;
    const k0 = this.keys[0].t, k1 = this.keys[this.keys.length - 1].t;
    if ((t - this.delay) * this.speed <= k0) return 0;
    return clamp01(invLerp(k0, k1, this.localTime(t)));
  }

  valueAt(t, ctx = {}) {
    if (this.behavior) return Procedural.value(this.behavior, t, this, ctx);
    if (this.keys.length === 0) return null;
    if (this.keys.length === 1) return this.keys[0].v;
    const lt = this.localTime(t);
    let i = 0;
    while (i < this.keys.length - 2 && this.keys[i + 1].t < lt) i++;
    const a = this.keys[i], b = this.keys[i + 1];
    const raw = invLerp(a.t, b.t, lt);
    const eName = b.ease || this.ease;
    const bez = /^cubic-bezier/.test(eName) ? null : null;
    const e = easeByName(eName) || Ease.linear;
    const k = e(clamp01(raw));
    if (typeof a.v === 'number' && typeof b.v === 'number') return lerp(a.v, b.v, k);
    if (typeof a.v === 'string' && typeof b.v === 'string' && a.v[0] === '#') return Color.mix(a.v, b.v, k);
    if (Array.isArray(a.v) && Array.isArray(b.v)) return a.v.map((q, idx) => lerp(q, b.v[idx] || q, k));
    return k < 0.5 ? a.v : b.v;
  }
  toJSON() {
    return {
      id: this.id, targetId: this.targetId, prop: this.prop, keys: this.keys, ease: this.ease,
      repeat: this.repeat, direction: this.direction, speed: this.speed, delay: this.delay,
      priority: this.priority, behavior: this.behavior, params: this.params, holdEnd: this.holdEnd, label: this.label
    };
  }
  static fromJSON(o) { return new Track(o); }
}

/* -------------------------------------------------------- PROCEDURAL ----- */
/** Non-keyframed motion: physics + oscillators. All are pure functions of t. */
const Procedural = {
  registry: {},
  def(name, fn, meta = {}) { Procedural.registry[name] = { fn, meta: { name, ...meta } }; },
  value(name, t, track, ctx) {
    const d = Procedural.registry[name];
    if (!d) return null;
    return d.fn(t, track.params || {}, ctx);
  },
  names() { return Object.keys(Procedural.registry); }
};

Procedural.def('shake', (t, p) => {
  const amp = p.amp || 6, f = p.freq || 24, decay = p.decay === undefined ? 1.2 : p.decay;
  const env = Math.exp(-decay * t);
  return { x: Math.sin(t * f) * amp * env, y: Math.cos(t * f * 1.31) * amp * env * 0.7 };
}, { label: 'Shake', props: ['x', 'y'] });

Procedural.def('wiggle', (t, p) => {
  const amp = p.amp || 5, f = p.freq || 3;
  return { x: noise.value1(t * f) * amp, y: noise.value1(t * f + 55) * amp };
}, { label: 'Wiggle', props: ['x', 'y'] });

Procedural.def('float', (t, p) => {
  const amp = p.amp || 8, f = p.freq || 1.2, rx = p.rot || 0.03;
  return { y: Math.sin(t * f) * amp, x: Math.cos(t * f * 0.7) * amp * 0.4, rot: Math.sin(t * f * 0.5) * rx };
}, { label: 'Float', props: ['x', 'y', 'rot'] });

Procedural.def('drift', (t, p) => {
  return { x: (p.vx || 20) * t, y: (p.vy || 0) * t, rot: (p.vr || 0) * t };
}, { label: 'Drift', props: ['x', 'y', 'rot'] });

Procedural.def('pulse', (t, p) => {
  const amp = p.amp || 0.06, f = p.freq || 2.4, base = p.base === undefined ? 1 : p.base;
  const s = base + Math.sin(t * f * TAU) * amp;
  return { sx: s, sy: s };
}, { label: 'Pulse', props: ['sx', 'sy'] });

Procedural.def('breathe', (t, p) => {
  const amp = p.amp || 0.03, f = p.freq || 0.6;
  const s = 1 + (Math.sin(t * f * TAU - PI / 2) * 0.5 + 0.5) * amp;
  return { sx: s, sy: s, opacity: 0.9 + Math.sin(t * f * TAU) * 0.06 };
}, { label: 'Breathe', props: ['sx', 'sy', 'opacity'] });

Procedural.def('orbit', (t, p) => {
  const cx = p.cx || 0, cy = p.cy || 0, r = p.r || 120, f = p.freq || 0.4, ph = p.phase || 0;
  const ecc = p.ecc === undefined ? 1 : p.ecc;
  const a = t * f * TAU + ph;
  return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * ecc };
}, { label: 'Orbit', props: ['x', 'y'], absolute: true });

Procedural.def('spring', (t, p) => {
  // damped harmonic oscillator — real physics, deterministic
  const k = p.k || 120, c = p.c || 12, x0 = p.from === undefined ? 1 : p.from, x1 = p.to === undefined ? 0 : p.to;
  const w0 = Math.sqrt(k), zeta = c / (2 * Math.sqrt(k));
  let x;
  if (zeta < 1) {
    const wd = w0 * Math.sqrt(1 - zeta * zeta);
    x = Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t));
  } else {
    x = Math.exp(-w0 * t) * (1 + w0 * t);
  }
  return { value: lerp(x1, x0, x) };
}, { label: 'Spring', props: ['value'] });

Procedural.def('bounce', (t, p) => {
  const h = p.height || 200, g = p.gravity || 900, x = p.x || 0;
  // analytic bounce: y = h - 0.5*g*(t mod T)^2, T from h
  const T = Math.sqrt(2 * h / g);
  let tt = t % (T * 2);
  if (tt > T) tt = T * 2 - tt;
  const y = h - 0.5 * g * tt * tt;
  return { x, y: p.baseY === undefined ? y : p.baseY - y };
}, { label: 'Bounce', props: ['x', 'y'] });

Procedural.def('pendulum', (t, p) => {
  const len = p.len || 200, max = p.max || 0.8, damp = p.damp === undefined ? 0.12 : p.damp, f = p.freq || 1;
  const a = Math.sin(t * f * TAU) * max * Math.exp(-damp * t);
  return { x: (p.px || 0) + Math.sin(a) * len, y: (p.py || 0) + Math.cos(a) * len, rot: a };
}, { label: 'Pendulum', props: ['x', 'y', 'rot'] });

Procedural.def('followPath', (t, p, ctx) => {
  const pts = ctx.pathPts || p.points;
  if (!pts || pts.length < 2) return { x: p.x || 0, y: p.y || 0 };
  const total = ctx.pathTotal || PathUtil.length(pts);
  const d = (t * (p.speed || 120)) % total;
  const cum = PathUtil.cumulative(pts);
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] >= d) {
      const k = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
      return { x: lerp(pts[i - 1].x, pts[i].x, k), y: lerp(pts[i - 1].y, pts[i].y, k) };
    }
  }
  const l = pts[pts.length - 1];
  return { x: l.x, y: l.y };
}, { label: 'Follow path', props: ['x', 'y'] });

Procedural.def('attract', (t, p) => {
  // magnetic attraction toward a point with inverse-square falloff
  const tx = p.tx || 0, ty = p.ty || 0, sx = p.sx || 0, sy = p.sy || 0, G = p.G || 4000;
  let x = sx, y = sy, vx = p.vx || 0, vy = p.vy || 0;
  const dt = 1 / 60;
  const steps = Math.min(1200, Math.floor(t / dt));
  for (let i = 0; i < steps; i++) {
    const dx = tx - x, dy = ty - y;
    const d2 = Math.max(400, dx * dx + dy * dy);
    const f = G / d2;
    const d = Math.sqrt(d2);
    vx += (dx / d) * f * dt; vy += (dy / d) * f * dt;
    x += vx * dt; y += vy * dt;
  }
  return { x, y };
}, { label: 'Attract', props: ['x', 'y'] });

Procedural.def('repel', (t, p) => {
  const tx = p.tx || 0, ty = p.ty || 0, sx = p.sx || 0, sy = p.sy || 0, G = p.G || 4000;
  let x = sx, y = sy, vx = 0, vy = 0;
  const dt = 1 / 60;
  const steps = Math.min(1200, Math.floor(t / dt));
  for (let i = 0; i < steps; i++) {
    const dx = x - tx, dy = y - ty;
    const d2 = Math.max(400, dx * dx + dy * dy);
    const f = G / d2; const d = Math.sqrt(d2);
    vx += (dx / d) * f * dt; vy += (dy / d) * f * dt;
    x += vx * dt; y += vy * dt;
  }
  return { x, y };
}, { label: 'Repel', props: ['x', 'y'] });

Procedural.def('lissajous', (t, p) => {
  return {
    x: (p.cx || 0) + (p.rx || 200) * Math.sin((p.a || 3) * t * (p.f || 1) + (p.delta || 0)),
    y: (p.cy || 0) + (p.ry || 150) * Math.sin((p.b || 2) * t * (p.f || 1))
  };
}, { label: 'Lissajous', props: ['x', 'y'] });

Procedural.def('spiralIn', (t, p) => {
  const r0 = p.r0 || 300, turns = p.turns || 2, f = p.freq || 0.4;
  const k = clamp01(t * f);
  const r = r0 * (1 - Ease.outCubic(k));
  const a = k * TAU * turns + (p.phase || 0);
  return { x: (p.cx || 0) + Math.cos(a) * r, y: (p.cy || 0) + Math.sin(a) * r };
}, { label: 'Spiral in', props: ['x', 'y'] });

Procedural.def('typewriter', (t, p) => {
  const dur = p.dur || 2, delay = p.delay || 0;
  return { reveal: clamp01((t - delay) / dur) };
}, { label: 'Typewriter', props: ['reveal'] });

Procedural.def('handwrite', (t, p) => {
  const dur = p.dur || 2.4, delay = p.delay || 0;
  const k = clamp01((t - delay) / dur);
  return { reveal: Ease.handDraw(k) };
}, { label: 'Handwrite', props: ['reveal'] });

Procedural.def('blink', (t, p) => {
  const f = p.freq || 2, duty = p.duty === undefined ? 0.5 : p.duty;
  return { opacity: ((t * f) % 1) < duty ? 1 : (p.dim === undefined ? 0.25 : p.dim) };
}, { label: 'Blink', props: ['opacity'] });

Procedural.def('flash', (t, p) => {
  const f = p.freq || 6;
  return { opacity: 0.45 + Math.abs(Math.sin(t * f * PI)) * 0.55 };
}, { label: 'Flash', props: ['opacity'] });

Procedural.def('spotlight', (t, p) => {
  return { opacity: 1, sx: 1 + Math.sin(t * (p.freq || 1.5)) * 0.02, sy: 1 + Math.sin(t * (p.freq || 1.5)) * 0.02 };
}, { label: 'Spotlight', props: ['opacity', 'sx', 'sy'] });

Procedural.def('parallax', (t, p, ctx) => {
  const cam = ctx.camera || { x: 0, y: 0, zoom: 1 };
  const depth = p.depth === undefined ? 0.3 : p.depth;
  return { x: -cam.x * depth * 0.02, y: -cam.y * depth * 0.02 };
}, { label: 'Parallax', props: ['x', 'y'] });

/* ----------------------------------------------------- ANIM PRESETS ------ */
/** High-level named animations → real Track objects. Used by planner + UI. */
const AnimPresets = {
  /* --- appearance --- */
  fadeIn: (el, t0, dur = 0.8, opts = {}) => new Track({ targetId: el.id, prop: 'opacity', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'outQuad', label: 'fade in', ...opts }),
  fadeOut: (el, t0, dur = 0.6, opts = {}) => new Track({ targetId: el.id, prop: 'opacity', keys: [{ t: t0, v: 1 }, { t: t0 + dur, v: 0 }], ease: 'inQuad', label: 'fade out', ...opts }),
  popIn: (el, t0, dur = 0.55, opts = {}) => new Track({ targetId: el.id, prop: 'scale', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'outBack', label: 'pop in', ...opts }),
  scaleIn: (el, t0, dur = 0.7, from = 0.6, opts = {}) => new Track({ targetId: el.id, prop: 'scale', keys: [{ t: t0, v: from }, { t: t0 + dur, v: 1 }], ease: 'outQuart', label: 'scale in', ...opts }),
  dropIn: (el, t0, dur = 0.7, dist = 260, opts = {}) => new Track({ targetId: el.id, prop: 'y', keys: [{ t: t0, v: el.base.y - dist }, { t: t0 + dur, v: el.base.y }], ease: 'outBounce', label: 'drop in', ...opts }),
  riseIn: (el, t0, dur = 0.7, dist = 200, opts = {}) => new Track({ targetId: el.id, prop: 'y', keys: [{ t: t0, v: el.base.y + dist }, { t: t0 + dur, v: el.base.y }], ease: 'outCubic', label: 'rise in', ...opts }),
  slideInLeft: (el, t0, dur = 0.7, dist = 420, opts = {}) => new Track({ targetId: el.id, prop: 'x', keys: [{ t: t0, v: el.base.x - dist }, { t: t0 + dur, v: el.base.x }], ease: 'outQuint', label: 'slide in ←', ...opts }),
  slideInRight: (el, t0, dur = 0.7, dist = 420, opts = {}) => new Track({ targetId: el.id, prop: 'x', keys: [{ t: t0, v: el.base.x + dist }, { t: t0 + dur, v: el.base.x }], ease: 'outQuint', label: 'slide in →', ...opts }),
  zoomOutIn: (el, t0, dur = 0.8, opts = {}) => new Track({ targetId: el.id, prop: 'scale', keys: [{ t: t0, v: 1.8 }, { t: t0 + dur, v: 1 }], ease: 'outExpo', label: 'zoom settle', ...opts }),
  /* --- drawing / reveal --- */
  drawOn: (el, t0, dur = 1.6, opts = {}) => new Track({ targetId: el.id, prop: 'reveal', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'linear', label: 'progressive draw', ...opts }),
  drawOnHand: (el, t0, dur = 2.2, opts = {}) => new Track({ targetId: el.id, prop: 'reveal', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'handDraw', label: 'hand draw', ...opts }),
  wipeReveal: (el, t0, dur = 1.0, opts = {}) => new Track({ targetId: el.id, prop: 'reveal', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'inOutSine', label: 'wipe reveal', ...opts }),
  typewriter: (el, t0, dur = 1.8, opts = {}) => new Track({ targetId: el.id, prop: 'reveal', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: 1 }], ease: 'step', label: 'typewriter', ...opts }),
  /* --- emphasis --- */
  pulse: (el, t0, dur = 2, opts = {}) => new Track({ targetId: el.id, prop: 'scale', behavior: 'pulse', params: { amp: 0.07, freq: 1.4 }, delay: t0, repeat: -1, label: 'pulse', ...opts }),
  shake: (el, t0, dur = 0.6, opts = {}) => new Track({ targetId: el.id, prop: 'xy', behavior: 'shake', params: { amp: 9, freq: 30, decay: 4 }, delay: t0, label: 'shake', ...opts }),
  glowPulse: (el, t0, dur = 2, opts = {}) => new Track({ targetId: el.id, prop: 'opacity', behavior: 'breathe', params: { amp: 0.05, freq: 0.8 }, delay: t0, repeat: -1, label: 'glow pulse', ...opts }),
  /* --- movement --- */
  float: (el, t0, opts = {}) => new Track({ targetId: el.id, prop: 'xy', behavior: 'float', params: { amp: 10, freq: 1.1 }, delay: t0, repeat: -1, label: 'float', ...opts }),
  orbit: (el, t0, params = {}, opts = {}) => new Track({ targetId: el.id, prop: 'xy', behavior: 'orbit', params: { freq: 0.35, r: 140, ...params }, delay: t0, repeat: -1, label: 'orbit', ...opts }),
  bounce: (el, t0, params = {}, opts = {}) => new Track({ targetId: el.id, prop: 'xy', behavior: 'bounce', params: { height: 160, ...params }, delay: t0, label: 'bounce', ...opts }),
  move: (el, t0, dur, to, opts = {}) => new Track({ targetId: el.id, prop: 'xy', keys: [{ t: t0, v: [el.base.x, el.base.y] }, { t: t0 + dur, v: [to.x, to.y] }], ease: 'inOutCubic', label: 'move', ...opts }),
  rotate: (el, t0, dur, turns = 1, opts = {}) => new Track({ targetId: el.id, prop: 'rot', keys: [{ t: t0, v: 0 }, { t: t0 + dur, v: turns * TAU }], ease: 'linear', label: 'rotate', ...opts }),
  /* --- transformation --- */
  morphColor: (el, t0, dur, from, to, opts = {}) => new Track({ targetId: el.id, prop: 'color', keys: [{ t: t0, v: from }, { t: t0 + dur, v: to }], ease: 'inOutSine', label: 'color morph', ...opts })
};

/* ------------------------------------------------------- ANIM ENGINE ----- */
class AnimationEngine {
  constructor() {
    this.physics = new Map();   // targetId -> integrated state for collision-aware motion
    this.stats = { tracksEvaluated: 0, procedural: 0 };
  }
  reset() { this.physics.clear(); }

  /** Evaluate every track at time t and write results into element.state. */
  evaluate(scene, t, dt) {
    this.stats.tracksEvaluated = 0; this.stats.procedural = 0;
    const byTarget = new Map();
    for (const el of scene.elements) el.state = {};
    for (const tr of scene.tracks) {
      if (!tr.targetId) continue;
      if (!byTarget.has(tr.targetId)) byTarget.set(tr.targetId, []);
      byTarget.get(tr.targetId).push(tr);
    }
    for (const [id, tracks] of byTarget) {
      const el = scene.byId(id);
      if (!el) continue;
      tracks.sort((a, b) => a.priority - b.priority);
      for (const tr of tracks) {
        const local = t - (tr.delay || 0);
        if (local < -0.0001) continue;
        if (tr.behavior) {
          this.stats.procedural++;
          const ctx = { camera: null, pathPts: tr.params.points };
          const v = Procedural.value(tr.behavior, Math.max(0, local), tr, ctx);
          if (v && typeof v === 'object') for (const k in v) el.state[k] = v[k];
          else if (v !== null && v !== undefined) el.state[tr.prop] = v;
        } else {
          const v = tr.valueAt(t);
          if (v === null || v === undefined) continue;
          if (tr.prop === 'scale') { el.state.sx = v; el.state.sy = v; }
          else if (tr.prop === 'xy' && Array.isArray(v)) { el.state.x = v[0]; el.state.y = v[1]; }
          else el.state[tr.prop] = v;
        }
        this.stats.tracksEvaluated++;
      }
    }
    // particle + custom element updates
    for (const el of scene.elements) {
      if (typeof el.update === 'function') { try { el.update(t, dt, null); } catch (e) { Log.warn('anim', 'element update failed', e.message); } }
    }
    return this.stats;
  }

  /** Timeline length implied by tracks (used to auto-size the timeline). */
  span(scene) {
    let end = 0;
    for (const tr of scene.tracks) end = Math.max(end, tr.t1 + (tr.repeat < 0 ? 2 : 0));
    for (const el of scene.elements) if (el.outT !== Infinity) end = Math.max(end, el.outT);
    return end;
  }
}

/* ------------------------------------------------- CAMERA KEYFRAMES ------ */
class CameraRig {
  constructor() { this.keys = []; this.mode = 'free'; this.follow = null; this.shake = 0; }
  static fromKeys(keys) { const r = new CameraRig(); r.keys = (keys || []).slice().sort((a, b) => a.t - b.t); return r; }
  add(key) { this.keys.push(key); this.keys.sort((a, b) => a.t - b.t); return this; }
  /** Returns {x,y,zoom,rot} at time t with smooth interpolation. */
  at(t) {
    if (!this.keys.length) return { x: 0, y: 0, zoom: 1, rot: 0 };
    if (t <= this.keys[0].t) return { ...this.keys[0] };
    const last = this.keys[this.keys.length - 1];
    if (t >= last.t) return { ...last };
    let i = 0;
    while (i < this.keys.length - 2 && this.keys[i + 1].t < t) i++;
    const a = this.keys[i], b = this.keys[i + 1];
    const k = (easeByName(b.ease || 'inOutCubic'))(clamp01(invLerp(a.t, b.t, t)));
    return {
      x: lerp(a.x || 0, b.x || 0, k), y: lerp(a.y || 0, b.y || 0, k),
      zoom: lerp(a.zoom === undefined ? 1 : a.zoom, b.zoom === undefined ? 1 : b.zoom, k),
      rot: lerp(a.rot || 0, b.rot || 0, k)
    };
  }
  /** Convenience: build a cinematic shot list from a list of focus targets. */
  static autoShots(targets, opts = {}) {
    const rig = new CameraRig();
    const hold = opts.hold === undefined ? 2.2 : opts.hold;
    const move = opts.move === undefined ? 1.4 : opts.move;
    const baseZoom = opts.zoom === undefined ? 1 : opts.zoom;
    rig.add({ t: 0, x: 0, y: 0, zoom: baseZoom, ease: 'linear' });
    let t = opts.startAt || 0.6;
    for (const tg of targets) {
      rig.add({ t, x: tg.x || 0, y: tg.y || 0, zoom: tg.zoom === undefined ? 1.35 : tg.zoom, ease: 'inOutCubic' });
      t += hold;
      rig.add({ t, x: tg.x || 0, y: tg.y || 0, zoom: tg.zoom === undefined ? 1.35 : tg.zoom, ease: 'linear' });
      t += move;
    }
    rig.add({ t: t + 0.6, x: 0, y: 0, zoom: baseZoom, ease: 'inOutCubic' });
    return rig;
  }
  toJSON() { return { keys: this.keys, mode: this.mode }; }
}

Object.assign(KALAM, { Track, Procedural, AnimPresets, AnimationEngine, CameraRig });


/* ──────────────────────────────────────────────────────────────────────
   50-render.js
   ────────────────────────────────────────────────────────────────────── */
/* ==========================================================================
   MODULE 50 · RENDERER  —  world buffer · static-bake cache · camera composite
   Mobile-first memory model: ONE world buffer + ONE bake cache + ONE fx
   buffer, all at project resolution. Layers stay logical (draw order,
   opacity, blend) so 8 layers cost 3 canvases, not 8.
   ========================================================================== */
'use strict';

class Renderer {
  constructor(app) {
    this.app = app;
    this.world = document.createElement('canvas');
    this.wctx = this.world.getContext('2d', { alpha: false });
    this.bake = document.createElement('canvas');
    this.bctx = this.bake.getContext('2d');
    this.fx = document.createElement('canvas');
    this.fctx = this.fx.getContext('2d', { willReadFrequently: true });
    this.display = null;
    this.dctx = null;
    this.w = 1920; this.h = 1080;
    this.quality = 1;
    this.stats = { drawn: 0, culled: 0, baked: 0, ms: 0, bakeMs: 0 };
    this._bakedIds = new Set();
    this._bakeDirty = true;
    this.showSafe = false;
    this.showGrid = false;
    this.bg = '#05070c';
  }
  attach(displayCanvas) {
    this.display = displayCanvas;
    this.dctx = displayCanvas.getContext('2d', { alpha: false, desynchronized: true });
  }
  setWorldSize(w, h) {
    this.w = Math.max(64, w | 0); this.h = Math.max(64, h | 0);
    this.world.width = this.w; this.world.height = this.h;
    this.bake.width = this.w; this.bake.height = this.h;
    const q = this.quality;
    this.fx.width = Math.max(64, Math.round(this.w * q));
    this.fx.height = Math.max(64, Math.round(this.h * q));
    this.invalidate();
  }
  setQuality(q) {
    if (Math.abs(q - this.quality) < 0.02) return;
    this.quality = clamp(q, 0.4, 1);
    this.fx.width = Math.max(64, Math.round(this.w * this.quality));
    this.fx.height = Math.max(64, Math.round(this.h * this.quality));
  }
  invalidate() { this._bakeDirty = true; this._bakedIds.clear(); }

  /** Camera → screen transform. Camera x/y are in world px offsets. */
  cameraMatrix(cam, viewW, viewH) {
    const fit = Math.min(viewW / this.w, viewH / this.h);
    const zoom = (cam.zoom === undefined ? 1 : cam.zoom) * fit;
    const cx = viewW / 2, cy = viewH / 2;
    const ox = this.w / 2 - (cam.x || 0), oy = this.h / 2 - (cam.y || 0);
    const m = new Matrix2D();
    const t = Matrix2D.translation(cx, cy)
      .multiply(Matrix2D.rotation(cam.rot || 0))
      .multiply(Matrix2D.scale(zoom))
      .multiply(Matrix2D.translation(ox - this.w / 2, oy - this.h / 2));
    return t;
  }
  worldToScreen(cam, viewW, viewH, x, y) { return this.cameraMatrix(cam, viewW, viewH).apply(x, y); }

  /** Is an element fully drawn & untouched by remaining tracks → bakeable. */
  canBake(el, scene, t) {
    if (this._bakedIds.has(el.id)) return 'already';
    if (el.type !== 'stroke' && el.type !== 'shape') return false;
    if (el.p('reveal') < 0.999) return false;
    if (el.p('opacity') < 0.995) return false;
    if (el.p('sx') !== 1 || el.p('sy') !== 1 || el.p('rot') !== 0) return false;
    if (el.style.blend && el.style.blend !== 'source-over') return false;
    if (el.style.glow) return false;
    if (el.outT !== Infinity && el.outT < scene.duration) return false;
    const moving = scene.tracks.some(tr => tr.targetId === el.id && (tr.t1 > t + 0.05 || tr.repeat < 0));
    if (moving) return false;
    return true;

  rebuildBake(scene, t) {
    const t0 = performance.now();
    this.bctx.clearRect(0, 0, this.w, this.h);
    this._bakedIds.clear();
    for (const el of scene.sorted()) {

    //    IMPORTANT: derive the CSS size from clientWidth/Height every frame and
    //    keep the backing store in sync here. Reading `display.width/dpr` alone

    //    bar collapses — the backing store never matched the CSS box.

   * shipping an invisible studio.

  collectFX(scene) {
    const out = [];

    if (scene.meta && scene.meta.fx) for (const f of scene.meta.fx) if (!out.find(o => o.id === (f.id || f))) out.push(typeof f === 'string' ? { id: f } : f);

  drawGuides(dc, vw, vh, scene, m) {
    dc.save();

      for (let y = 0; y <= this.h; y += step) { dc.moveTo(Math.max(x0, 0), y); dc.lineTo(Math.min(x1, this.w), y); }
      dc.stroke();

    if (this.showSafe) {
      const pad = 0.05;
      dc.strokeStyle = 'rgba(255,209,102,.55)';
      dc.setLineDash([10, 8]);
      dc.strokeRect(this.w * pad, this.h * pad, this.w * (1 - pad * 2), this.h * (1 - pad * 2));
      dc.strokeStyle = 'rgba(255,80,120,.4)';
      dc.strokeRect(this.w * 0.1, this.h * 0.1, this.w * 0.8, this.h * 0.8);
      dc.setLineDash([]);
      // thirds
      dc.strokeStyle = 'rgba(255,255,255,.12)';
      dc.beginPath();
      for (let i = 1; i < 3; i++) {
        dc.moveTo(this.w * i / 3, 0); dc.lineTo(this.w * i / 3, this.h);
        dc.moveTo(0, this.h * i / 3); dc.lineTo(this.w, this.h * i / 3);
      }
      dc.stroke();
    }
    dc.restore();
  }

  /** Thumbnail: render current frame into a small canvas and return dataURL. */
  thumbnail(w = 480) {
    const c = document.createElement('canvas');
    const h = Math.round(w * (this.h / this.w));
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.drawImage(this.world, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.82);
  }
  /** Full-resolution PNG of the current world buffer. */
  pngBlob(scale = 1) {
    return new Promise((resolve) => {
      if (scale === 1) { this.world.toBlob(b => resolve(b), 'image/png'); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(this.w * scale); c.height = Math.round(this.h * scale);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(this.world, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b), 'image/png');
    });
  }
}

class PromptAnalyzer {
  constructor() {
    this.lastReport = null;
  }
  normalize(text) {
    return String(text || '').toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
  }
  tokens(text) { return this.normalize(text).split(' ').map(w => w.replace(/[^a-z0-9\u0900-\u097F-]/g, '')).filter(w => w && !STOPWORDS.has(w)); }
  /** Score every keyword map, keep the evidence so the UI can explain itself. */
  score(text, map, weights) {
    const n = this.normalize(text);
    const toks = this.tokens(text);
    const out = {};
    for (const key in map) {
      let s = 0; const hits = [];
      for (const kw of map[key]) {
        const k = kw.toLowerCase();
        if (k.includes(' ')) { if (n.includes(k)) { s += 2 + k.split(' ').length * 0.4; hits.push(kw); } }
        else if (toks.includes(k)) { s += 1.6; hits.push(kw); }
        else if (k.length > 4 && n.includes(k)) { s += 0.8; hits.push(kw); }
      }
      if (s > 0) out[key] = { score: roundTo(s * ((weights && weights[key]) || 1), 4), hits };
    }
    return out;
  }
  detectEntities(text) {
    const n = this.normalize(text);
    const out = { numbers: [], title: null, items: [], lang: 'en', length: n.length };
    const nums = n.match(/\b\d+(\.\d+)?%?\b/g);
    if (nums) out.numbers = nums.slice(0, 24);
    // quoted title
    const q = String(text || '').match(/["“”']([^"“”']{2,80})["“”']/);
    if (q) out.title = q[1];
    // list items: "a, b and c" or "1) x 2) y"
    const listMatch = n.match(/(?:^|\s)([a-z0-9 ]+(?:,\s*[a-z0-9 ]+){1,7}(?:\s+and\s+[a-z0-9 ]+)?)/);
    if (listMatch) out.items = listMatch[1].split(/,|\sand\s/).map(s => s.trim()).filter(Boolean).slice(0, 12);
    if (/[\u0900-\u097F]/.test(String(text || ''))) out.lang = 'hi';
    else if (/\b(kya|hai|karo|banao|dikhao|samjha|chakra|ka|ki|ke|aur|mein|se)\b/.test(n)) out.lang = 'hinglish';
    // explicit title patterns: "title: X", "on X"
    const tm = n.match(/(?:title|topic|about|on|for)[:\s]+([a-z0-9 \-']{3,60})/);
    if (tm && !out.title) out.title = tm[1].trim();
    return out;
  }
  detectDuration(text) {
    const n = this.normalize(text);
    const m = n.match(/(\d+(?:\.\d+)?)\s*(second|sec|minute|min|s\b|m\b)/);
    if (m) {
      const v = parseFloat(m[1]);
      return /min/.test(m[2]) || m[2] === 'm' ? clamp(v * 60, 5, 3600) : clamp(v, 3, 600);
    }
    if (/short|reel|tiktok/.test(n)) return 22;
    if (/long|detailed|full|deep/.test(n)) return 90;
    return null;
  }
  analyze(text) {
    const raw = String(text || '').trim();
    const domains = this.score(raw, DOMAIN_KEYWORDS);
    /* "Explain the water cycle" — 'cycle' here is part of the subject, not a
       request for a cyclic animation. Blank out recognised subject phrases
       before scoring intents so nouns stop hijacking the verb. */
    let intentText = this.normalize(raw);
    for (const d in domains) for (const hit of domains[d].hits) {
      const h = String(hit).toLowerCase();
      if (h.includes(' ')) intentText = intentText.split(h).join(' ');
    }
    const intents = this.score(intentText, INTENT_KEYWORDS, INTENT_WEIGHT);
    const moods = this.score(raw, MOOD_KEYWORDS);
    const formats = this.score(raw, FORMAT_KEYWORDS);
    const styles = this.score(raw, STYLE_KEYWORDS);
    const entities = this.detectEntities(raw);
    const duration = this.detectDuration(raw);

    const top = (obj) => Object.entries(obj).sort((a, b) => b[1].score - a[1].score);
    const intentRank = top(intents);
    const domainRank = top(domains);

    const intent = intentRank.length ? intentRank[0][0] : (raw.length > 0 ? 'explain' : 'explain');
    const secondaryIntents = intentRank.slice(1, 4).map(x => x[0]);
    const domain = domainRank.length ? domainRank[0][0] : null;
    const secondaryDomains = domainRank.slice(1, 3).map(x => x[0]);
    const mood = Object.keys(moods).length ? top(moods)[0][0] : (domain === 'story' ? 'epic' : domain === 'workout' ? 'epic' : domain === 'ml' || domain === 'code' ? 'tech' : 'calm');
    const style = Object.keys(styles).length ? top(styles)[0][0] : (mood === 'tech' ? 'neon' : mood === 'playful' ? 'comic' : 'minimal');
    const format = Object.keys(formats).length ? top(formats)[0][0] : '16:9';

    // MASTER MODE resolution — 5 modes instead of 30 confusing options
    let mode = 'explainer';
    if (domain === 'story' || /character|scene|comic|hero/.test(this.normalize(raw))) mode = 'story';
    else if (style === 'sketch' || style === 'chalkboard' || style === 'notebook' || /whiteboard|hand drawn/.test(this.normalize(raw))) mode = 'sketch';
    else if (domain === 'chart' || domain === 'map' || domain === 'finance' || domain === 'economics' || intent === 'compare') mode = 'information';
    else if (/3d|isometric|cube|render|cgi/.test(this.normalize(raw))) mode = '3d';
    else mode = 'explainer';

    // evidence for the "why did the bot do this" panel
    const evidence = [];
    if (intentRank[0]) evidence.push(`intent "${intent}" ← [${intentRank[0][1].hits.slice(0, 4).join(', ')}]`);
    if (domainRank[0]) evidence.push(`domain "${domain}" ← [${domainRank[0][1].hits.slice(0, 4).join(', ')}]`);
    evidence.push(`mood "${mood}", style "${style}", mode "${mode}", format ${format}`);

    const confidence = clamp01(
      (intentRank[0] ? intentRank[0][1].score / 6 : 0.25) * 0.5 +
      (domainRank[0] ? Math.min(1, domainRank[0][1].score / 5) : 0.2) * 0.5
    );

    const report = {
      raw, tokens: this.tokens(raw), intent, secondaryIntents, domain, secondaryDomains,
      mood, style, mode, format, entities, duration, confidence,
      intents: intentRank.slice(0, 6).map(x => ({ k: x[0], s: roundTo(x[1].score, 2) })),
      domains: domainRank.slice(0, 6).map(x => ({ k: x[0], s: roundTo(x[1].score, 2) })),
      evidence
    };
    this.lastReport = report;
    Log.info('planner', `analyze: intent=${intent} domain=${domain} mode=${mode} conf=${roundTo(confidence, 2)}`, report.evidence);
    return report;
  }
}

const Analyzer = new PromptAnalyzer();

/** Builder API used by every scene generator. Keeps generators short + safe. */
class Storyboard {
  constructor(scene, analysis) {
    this.scene = scene;
    this.a = analysis;
    this.r = new RNG(scene.seed);
    this.pal = paletteByName(scene.palette);
    this.t = 0;               // running clock
    this.W = scene.format.w;
    this.H = scene.format.h;
    this.cx = this.W / 2; this.cy = this.H / 2;
    this.gap = 0.1;         // pause between consecutive strokes, like a real hand
    this.drawQueue = [];
    this._z = 1;
    this.handTargets = [];    // {t, x, y, el} → drives the visible bot hand
  }
  get colors() { return this.pal; }
  ink(i = 2) { return this.pal[clamp(i, 0, this.pal.length - 1)]; }
  accent() { return this.pal[this.pal.length - 2] || this.pal[1]; }
  bg() { return this.pal[0]; }

  /* timing helpers */
  at(t) { this.t = t; return this; }
  wait(d) { this.t += d; return this; }
  next() { return this.t; }

  /* ---- primitives ---- */
  background(kind, extra = {}) {
    const styles = {
      minimal: { kind: 'gradient', color1: this.pal[0], color2: Color.shade(this.pal[0], 0.06), vignette: true },
      neon: { kind: 'radial', color1: Color.shade(this.pal[0], 0.1), color2: '#02020a', vignette: true },
      sketch: { kind: 'notebook', color1: '#fbf7ef', grid: 56, gridColor: 'rgba(90,120,180,.16)', vignette: false },
      chalkboard: { kind: 'blackboard', color1: '#12211c', vignette: true },
      blueprint: { kind: 'blueprint', color1: '#06263f', grid: 48, gridColor: 'rgba(120,200,255,.22)', vignette: false },
      notebook: { kind: 'notebook', color1: '#fdfbf5', grid: 52, gridColor: 'rgba(90,120,180,.18)', vignette: false },
      cinematic: { kind: 'radial', color1: '#1a1f2e', color2: '#05070c', vignette: true, vignetteColor: 'rgba(0,0,0,.75)' },
      comic: { kind: 'gradient', color1: '#fff8e7', color2: '#ffe9c7', vignette: false, dot: true, grid: 26, dotColor: 'rgba(0,0,0,.14)' },
      watercolor: { kind: 'gradient', color1: '#f7f3ea', color2: '#e9e2d3', vignette: true },
      retro: { kind: 'gradient', color1: '#1b0b2e', color2: '#3d0f58', vignette: true }
    };
    const st = Object.assign(styles[this.a.style] || styles.minimal, extra);
    const el = this.scene.add(new BoardEl({ layerId: this.scene.layer('Background').id, style: st, data: { size: { w: this.W, h: this.H } }, z: -100 }));
    el.base.opacity = 1;
    el.base.reveal = 1;
    return el;
  }
  text(str, x, y, opts = {}) {
    const dark = this.a.style === 'sketch' || this.a.style === 'notebook' || this.a.style === 'comic' || this.a.style === 'watercolor';
    const st = Object.assign({
      size: Math.round(this.H * 0.045), color: dark ? '#1b1f27' : '#f2f6ff',
      family: this.a.style === 'sketch' ? 'handwriting' : (this.a.style === 'cinematic' ? 'heading' : 'sans'),
      weight: 700, align: 'center', maxWidth: this.W * 0.82
    }, opts.style || {});
    const el = this.scene.add(new TextEl({
      layerId: this.scene.layer(opts.layer || 'Labels').id,
      name: opts.name || Util.truncate(str, 28),
      base: { x, y, ax: opts.ax === undefined ? 0.5 : opts.ax, ay: opts.ay === undefined ? 0.5 : opts.ay, opacity: opts.reveal === false ? 1 : 0 },
      style: st, data: { text: str }, z: this._z++, inT: opts.inT === undefined ? this.t : opts.inT,
      outT: opts.outT === undefined ? Infinity : opts.outT
    }));
    if (opts.reveal !== false) this.anim(el, 'fadeIn', opts.t === undefined ? this.t : opts.t, opts.dur || 0.6);
    return el;
  }
  title(str, opts = {}) {
    const y = opts.y === undefined ? this.H * 0.2 : opts.y;
    return this.text(str, this.cx, y, Object.assign({
      name: 'Title',
      style: Object.assign({ size: Math.round(this.H * 0.082), weight: 800, tracking: -1, maxWidth: this.W * 0.86, glow: 18, glowColor: this.accent() }, opts.style || {})
    }, opts));
  }
  subtitle(str, opts = {}) {
    return this.text(str, this.cx, opts.y === undefined ? this.H * 0.315 : opts.y, Object.assign({
      style: Object.assign({ size: Math.round(this.H * 0.032), weight: 500, opacity: 0.85, maxWidth: this.W * 0.7 }, opts.style || {})
    }, opts));
  }
  caption(str, t, dur) {
    this.scene.captions.push({ t: t === undefined ? this.t : t, dur: dur || Math.max(2, str.length / 14), text: str });
    return this;
  }
  say(str, dur) {
    const d = dur || clamp(str.length / 14, 2.2, 7);
    this.caption(str, this.t, d);
    return this;
  }
  shape(kind, params, opts = {}) {
    const el = this.scene.add(new ShapeEl({
      layerId: this.scene.layer(opts.layer || 'Art').id,
      name: opts.name || kind,
      base: { x: opts.x === undefined ? 0 : opts.x, y: opts.y === undefined ? 0 : opts.y, opacity: opts.hidden ? 1 : 0, reveal: opts.reveal === undefined ? 0 : opts.reveal },
      style: Object.assign({ stroke: this.ink(2), size: Math.max(3, this.H * 0.0042), brush: this.brushFor(kind), color: this.ink(2), fill: opts.fill || null }, opts.style || {}),
      data: { kind, params }, z: this._z++,
      inT: opts.inT === undefined ? this.t : opts.inT, outT: opts.outT === undefined ? Infinity : opts.outT
    }));
    el.data.fill = opts.fill || null;
    const t0 = opts.t === undefined ? this.t : opts.t;
    if (opts.reveal === undefined || opts.reveal < 1) this.botDraw(el, t0, opts.dur);
    if (opts.t === undefined && !opts.hidden) this.t = t0 + (el._drawDur || 0.9) + (opts.gap === undefined ? this.gap : opts.gap);
    return el;
  }
  strokePts(pts, opts = {}) {
    if (!pts || pts.length < 2) return null;
    const el = this.scene.add(new StrokeEl({
      layerId: this.scene.layer(opts.layer || 'Art').id,
      name: opts.name || 'stroke',
      base: { opacity: opts.hidden ? 1 : 0, reveal: opts.reveal === undefined ? 0 : opts.reveal },
      style: Object.assign({ color: this.ink(2), size: Math.max(3, this.H * 0.0045), brush: this.brushFor(opts.kind) }, opts.style || {}),
      data: { pts }, z: this._z++,
      inT: opts.inT === undefined ? this.t : opts.inT, outT: opts.outT === undefined ? Infinity : opts.outT
    }));
    const t0 = opts.t === undefined ? this.t : opts.t;
    if (opts.reveal === undefined || opts.reveal < 1) this.botDraw(el, t0, opts.dur);
    if (opts.t === undefined && !opts.hidden) this.t = t0 + (el._drawDur || 0.9) + (opts.gap === undefined ? this.gap : opts.gap);
    return el;
  }
  diagram(nodes, edges, opts = {}) {
    const el = this.scene.add(new DiagramEl({
      layerId: this.scene.layer(opts.layer || 'Art').id,
      name: opts.name || 'diagram',
      base: { opacity: opts.hidden ? 1 : 0, reveal: opts.reveal === undefined ? 0 : opts.reveal },

/* helper: clean subject string for titles */
function subjectOf(a, fallback) {
  if (a.entities.title) return a.entities.title.replace(/\b\w/g, c => c.toUpperCase());
  const skip = new Set([...(a.intents[0] ? [a.intents[0].k] : []), ...(a.domain ? [a.domain] : [])]);
  const words = a.tokens.filter(w => !skip.has(w) && w.length > 2).slice(0, 7);
  const s = words.join(' ');
  return (s ? s.replace(/\b\w/g, c => c.toUpperCase()) : fallback);
}
